{t:"Code Lyoko", net:"Streaming & Other", dec:"2000s", age:"7-9", cat:"Sci-Fi", cat2:"Adventure", g:"neutral", lang:"French", d:"Kids discover a virtual world and use their digital avatars to stop an AI bent on escaping into the real world (2003–2007). It mixed traditional and CGI animation in a way that was distinctive for its era."},
{t:"Maya the Bee", net:"Streaming & Other", dec:"2010s", age:"4-8", cat:"Adventure", cat2:"Fantasy & Magic", g:"neutral", lang:"German", d:"A curious young bee explores the meadow and makes friends while learning about her hive (2012–2014). This CGI reboot of the classic character leans on gentle, self-contained adventures for younger viewers."},
{t:"The Adventures of Figaro Pho", net:"Streaming & Other", dec:"2010s", age:"4-8", cat:"Comedy", cat2:"Music & Arts", g:"neutral", lang:"English", d:"An anxious, phobia-prone creature tries to get through ordinary daily tasks despite his many fears (2013–2015). Each short episode builds its entire story around a single specific phobia."},
{t:"Bottersnikes & Gumbles", net:"Streaming & Other", dec:"2010s", age:"4-8", cat:"Comedy", cat2:"Science & Nature", g:"neutral", lang:"English", d:"Grumpy junkyard creatures and squishy, good-natured Gumbles clash over territory and treasure (2015–2018). Its Australian source material gave the show a distinctly scrappy, outback sense of humor."},
{t:"Super Wings", net:"Streaming & Other", dec:"2010s", age:"3-6", cat:"Adventure", cat2:"Superhero & Action", g:"neutral", lang:"English", d:"A transforming delivery plane and his friends fly packages to kids around the world (2015–present). Each episode introduces a different country's landmarks and culture alongside the delivery mission."},
{t:"Robocar Poli", net:"Streaming & Other", dec:"2010s", age:"2-5", cat:"Adventure", cat2:"Superhero & Action", g:"neutral", lang:"Korean", d:"A transforming police-car robot and his emergency-vehicle friends keep their town safe (2011–present). Its rescue-of-the-week format doubles as gentle instruction on traffic and safety rules."},
{t:"Kid-E-Cats", net:"Streaming & Other", dec:"2010s", age:"2-5", cat:"Life Skills & Emotions", cat2:"Adventure", g:"neutral", lang:"English", d:"Three curious kitten siblings explore everyday problems and simple lessons together (2015–present). Its short, repetitive format is built around one small lesson per episode."},
{t:"Beat Bugs", net:"Streaming & Other", dec:"2010s", age:"3-6", cat:"Music & Arts", cat2:"Science & Nature", g:"neutral", lang:"English", d:"Tiny insect friends have backyard adventures set to reimagined classic songs from the Beatles catalog (2016–2017). Each episode's storyline was built directly around the themes of its featured song."},
{t:"All Hail King Julien", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Comedy", cat2:"Sports", g:"neutral", lang:"English", d:"The vain lemur king from the Madagascar films rules his island kingdom with more confidence than competence (2014–2017). Its royal-court setting gave the franchise's side character room for a full comedic ensemble."},
{t:"The Mr. Peabody & Sherman Show", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A genius dog and his adopted boy use a time machine to get tangled up in history's biggest moments (2015–2017). Each episode's historical detour was played for both comedy and genuine trivia."},
{t:"Skylanders Academy", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Fantasy & Magic", cat2:"Superhero & Action", g:"boys", lang:"English", d:"Magical warriors train at a floating academy while defending their world from an evil sorcerer (2016–2018). Based on the video game franchise, it built episodes around each hero's distinct elemental power."},
{t:"The InBESTigators", net:"Streaming & Other", dec:"2010s", age:"7-9", cat:"Mystery", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"Four kids run their own detective agency, solving mysteries around their neighborhood and school (2019–present). Its case-of-the-week format leans on genuine clue-gathering rather than slapstick."},
{t:"Fast Layne", net:"Streaming & Other", dec:"2020s", age:"6-9", cat:"Adventure", cat2:"Sports", g:"boys", lang:"English", d:"A boy inherits a magical talking race car and uses it to solve neighborhood mysteries (2021). Its vehicle-companion premise paired everyday adventure with a steady stream of racing action."},
{t:"Oddbods", net:"Streaming & Other", dec:"2010s", age:"3-7", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A group of odd-shaped, wordless creatures get into slapstick trouble over everyday situations (2014–present). Its dialogue-free format relies entirely on expressive sound effects and physical comedy."},
{t:"Human Kind Of", net:"Streaming & Other", dec:"2020s", age:"6-9", cat:"Comedy", cat2:"Science & Nature", g:"neutral", lang:"English", d:"Animal narrators comment on the strange, often illogical behavior of the humans they observe (2020). Its documentary-style narration framed ordinary family life as an anthropological curiosity."},
{t:"Charlie's Colorforms City", net:"Streaming & Other", dec:"2020s", age:"2-5", cat:"Preschool Learning", cat2:"Sci-Fi", g:"neutral", lang:"English", d:"A young boy and his shape-shifting robot friend explore their city using colorful geometric shapes (2020–2021). Each episode ties a simple lesson to recognizing and combining basic shapes."},
{t:"The Not-Too-Late Show with Elmo", net:"Streaming & Other", dec:"2020s", age:"2-5", cat:"Preschool Learning", cat2:"Music & Arts", g:"neutral", lang:"English", d:"A late-night-style talk show hosted by Elmo, complete with a house band and celebrity guests (2023–present). Its talk-show format reframes early-childhood topics like bedtime and feelings as playful \"interviews.\""},
{t:"Ollie's Pack", net:"Streaming & Other", dec:"2020s", age:"6-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"boys", lang:"English", d:"A boy's secretive after-school club uses old-school gadgets to look out for their neighborhood (2020). Its low-tech, scrappy approach to problem-solving set it apart from more gadget-heavy adventure shows."},
{t:"Go Away, Unicorn!", net:"Streaming & Other", dec:"2020s", age:"4-8", cat:"Fantasy & Magic", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A boy's family heirloom accidentally summons a chaotic unicorn who won't leave him alone (2020–present). Its odd-couple premise plays the unicorn's clumsy magic for comedy rather than typical fantasy adventure."},
{t:"Big Blue", net:"Streaming & Other", dec:"2020s", age:"2-5", cat:"Science & Nature", cat2:"Adventure", g:"neutral", lang:"English", d:"A friendly whale shark and his ocean friends explore marine habitats and sea-life facts (2022–present). Each episode pairs a gentle undersea adventure with a simple ocean-science takeaway."},
{t:"Odo", net:"Streaming & Other", dec:"2020s", age:"2-5", cat:"Science & Nature", cat2:"Sci-Fi", g:"neutral", lang:"English", d:"A tiny alien-like creature and his insect friends explore backyard nature up close (2023–present). Its wordless, close-up animation style turns ordinary bugs and plants into a sense of wonder."},
{t:"Floogals", net:"Streaming & Other", dec:"2010s", age:"2-5", cat:"Comedy", cat2:"Mystery", g:"neutral", lang:"English", d:"Three tiny aliens secretly observe and misinterpret ordinary household objects and habits (2016–2019). Its outsider's-eye format turns everyday objects into a running source of comedic mystery."},
{t:"Team Zenko Go", net:"Streaming & Other", dec:"2020s", age:"4-8", cat:"Superhero & Action", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Kid heroes secretly perform small acts of community kindness using clever gadgets (2022–present). Each mission-style episode centers on a low-key act of helpfulness rather than combat."},
{t:"Norm of the North", net:"Streaming & Other", dec:"2010s", age:"4-8", cat:"Comedy", cat2:"Science & Nature", g:"boys", lang:"English", d:"An Arctic polar bear and his lemming friends try to protect their home from developers (2018). Spun off from the animated film, it kept the same broad, slapstick environmental comedy."},
{t:"Kulipari: An Army of Frogs", net:"Streaming & Other", dec:"2010s", age:"7-9", cat:"Fantasy & Magic", cat2:"Superhero & Action", g:"boys", lang:"English", d:"Poisonous warrior frogs train to defend their swamp kingdom from an army of scorpions (2018). Its army-in-training structure built each episode around a new combat or strategy lesson."},
{t:"The Chica Show", net:"Streaming & Other", dec:"2010s", age:"2-5", cat:"Preschool Learning", cat2:"Sports", g:"neutral", lang:"English", d:"A curious puppet chicken and her human friend explore everyday topics through games and songs (2011–2016). Its puppet-and-host format favored simple, repetitive segments aimed at very young viewers."},
{t:"Digby Dragon", net:"Streaming & Other", dec:"2010s", age:"2-5", cat:"Fantasy & Magic", cat2:"Mystery", g:"neutral", lang:"English", d:"A young dragon and his friends solve gentle problems in their magical woodland village (2017–2019). Each episode wraps a small dilemma into a simple, reassuring resolution."},
{t:"Little Angel", net:"YouTube", dec:"2010s", age:"0-4", cat:"Life Skills & Emotions", cat2:"Preschool Learning", g:"neutral", lang:"English", d:"A family of animated toddlers acts out simple everyday situations like sharing and bedtime (2018–present). Its short, repetitive episodes are built around one relatable toddler moment at a time."},
{t:"Morphle", net:"YouTube", dec:"2010s", age:"2-5", cat:"Fantasy & Magic", cat2:"Superhero & Action", g:"neutral", lang:"English", d:"A young girl's magical shape-shifting pet transforms into whatever's needed to solve the problem at hand (2017–present). Each short episode centers on a single transformation used to fix a simple dilemma."},
{t:"Wolfoo", net:"YouTube", dec:"2010s", age:"2-6", cat:"Life Skills & Emotions", cat2:"Comedy", g:"neutral", lang:"English", d:"A cheerful wolf cub and his family act out everyday lessons about sharing, manners, and safety (2018–present). Its short, moral-driven episodes are built around one simple takeaway apiece."},
{t:"Sheriff Labrador", net:"YouTube", dec:"2010s", age:"2-5", cat:"Life Skills & Emotions", cat2:"Science & Nature", g:"boys", lang:"English", d:"A dog sheriff and his animal deputies teach safety rules and good habits around their town (2018–present). Its rescue-and-lesson format pairs simple safety tips with light action."},
{t:"Genevieve's Playhouse", net:"YouTube", dec:"2010s", age:"2-5", cat:"Preschool Learning", cat2:"Sports", g:"neutral", lang:"English", d:"A young host uses puppets, toys, and games to explore counting, colors, and everyday routines (2016–present). Its live-action, direct-to-camera format keeps segments short and interactive."},
{t:"Bebefinn", net:"YouTube", dec:"2020s", age:"0-4", cat:"Music & Arts", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"An animated baby and his family sing simple songs about daily routines like bathtime and mealtime (2021–present). Its short, melodic episodes are built around a single everyday moment set to music."},
{t:"Bounce Patrol", net:"YouTube", dec:"2010s", age:"2-6", cat:"Music & Arts", cat2:"Comedy", g:"neutral", lang:"English", d:"A group of costumed performers sing and dance through nursery rhymes and original kids' songs (2013–present). Its live-action, high-energy format favors group choreography over animation."},
{t:"ChuChu TV", net:"YouTube", dec:"2010s", age:"0-4", cat:"Music & Arts", cat2:"Preschool Learning", g:"neutral", lang:"English", d:"A hugely popular animated channel of nursery rhymes and sing-along songs for toddlers (2013–present). Its bright, simple visuals and repetitive songs are built for very early language and music exposure."},
{t:"Newton's Apple", net:"PBS Kids", dec:"1990s", age:"7-9", cat:"Science & Nature", cat2:"Adventure", g:"neutral", lang:"English", d:"A hands-on science series answering viewer-submitted questions with real experiments (1983\u20131998). Its everyday, curiosity-driven format made complex topics approachable for young viewers."},
{t:"Cro", net:"PBS Kids", dec:"1990s", age:"6-9", cat:"Science & Nature", cat2:"Sci-Fi", g:"neutral", lang:"English", d:"A robotic woolly mammoth built by cave kids narrates inventive engineering tales (1993\u20131994). The show used prehistoric storytelling as a playful gateway into basic science and design principles."},
{t:"The Odyssey", net:"PBS Kids", dec:"1990s", age:"7-9", cat:"Sci-Fi", cat2:"Adventure", g:"neutral", lang:"English", d:"A boy slips into a fantastical alternate world after a bike accident, working his way home through strange trials (1992\u20131993, Canadian import). Its dreamlike, puzzle-driven structure gave it a distinct tone among its PBS peers."},
{t:"Action League Now!", net:"Nickelodeon", dec:"1990s", age:"6-9", cat:"Comedy", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Stop-motion action figures bumble their way through inept superhero missions (1994\u20132002, part of KaBlam!). Its low-budget claymation style became part of the joke, poking fun at action-cartoon cliches."},
{t:"The X's", net:"Nickelodeon", dec:"2000s", age:"6-9", cat:"Sci-Fi", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A family of bumbling secret agents balances spy missions with ordinary suburban life (2005\u20132006). It leaned on a classic spy-family premise, mixing gadget-driven action with sitcom-style family jokes."},
{t:"Cousin Skeeter", net:"Nickelodeon", dec:"1990s", age:"6-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A boy's puppet cousin moves in and turns his life upside down with big personality and bigger schemes (1998\u20132001). The show's blend of live actors and puppetry gave it a distinctive sitcom format for its era."},
{t:"Skyland", net:"Nickelodeon", dec:"2000s", age:"6-9", cat:"Sci-Fi", cat2:"Superhero & Action", g:"neutral", lang:"English", d:"Teens on a floating rebel base fight to reclaim a future Earth transformed by a cosmic disaster (2005\u20132007, French co-production). Its serialized sci-fi plot was more ongoing than the typical episodic Nicktoon."},
{t:"Roundhouse", net:"Nickelodeon", dec:"1990s", age:"6-9", cat:"Comedy", cat2:"Music & Arts", g:"neutral", lang:"English", d:"A young sketch-comedy and dance ensemble performs fast-paced skits about school and family life (1992\u20131996). Its hip-hop-inflected variety format set it apart from more traditional kids' sketch shows."},
{t:"Slimetime Live", net:"Nickelodeon", dec:"2000s", age:"6-9", cat:"Comedy", cat2:"Sports", g:"neutral", lang:"English", d:"A live game show mixing viewer call-ins, clips, and messy physical challenges (2001\u20132004). Its interactive, unscripted format let ordinary kids take center stage alongside the hosts."},
{t:"Are You Afraid of the Dark? (2019)", net:"Nickelodeon", dec:"2010s", age:"7-9", cat:"Mystery", cat2:"Adventure", g:"neutral", lang:"English", d:"Revival of the campfire anthology series, with new kids trading spooky, kid-safe tales each season (2019\u20132022). It updates the original's suspenseful storytelling structure for a new generation of viewers."},
{t:"Butt-Ugly Martians", net:"Nickelodeon", dec:"2000s", age:"6-9", cat:"Sci-Fi", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Alien scouts sent to prep Earth for invasion instead befriend the humans they were meant to conquer (2001\u20132003). Its fish-out-of-water alien premise leaned heavily on slapstick and pop-culture parody."},
{t:"Nick Arcade", net:"Nickelodeon", dec:"1990s", age:"7-9", cat:"Sports", cat2:"Comedy", g:"neutral", lang:"English", d:"Kid contestants compete in trivia and physical challenges to unlock and 'enter' video games (1992\u20131993). Its game-show format built around video game references made it a novelty even among its Nickelodeon peers."},
{t:"Nick News with Linda Ellerbee", net:"Nickelodeon", dec:"1990s", age:"7-9", cat:"Life Skills & Emotions", cat2:"Comedy", g:"neutral", lang:"English", d:"A long-running news program breaking down current events and social issues for a young audience (1992\u20132015). It treated kids as capable of understanding real news, tackling topics from elections to bullying with unusual directness."},
{t:"Hey Dude", net:"Nickelodeon", dec:"1990s", age:"7-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"Teen staff navigate mishaps and light mysteries at a working dude ranch (1989\u20131991). Its outdoorsy, ranch-set premise gave it a distinct flavor among early Nickelodeon live-action comedies."},
{t:"Welcome Freshmen", net:"Nickelodeon", dec:"1990s", age:"7-9", cat:"Comedy", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Sketch-comedy series following a group of students navigating their first year of high school (1991\u20131994). Its fast-paced sketches focused on the everyday embarrassments of starting somewhere new."},
{t:"You Can't Do That on Television", net:"Nickelodeon", dec:"1990s", age:"7-9", cat:"Comedy", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Sketch-comedy show famous for dousing its young cast in green slime whenever someone said 'I don't know' (1979\u20131990, reran into the 90s). Its slime gimmick became a defining symbol of early Nickelodeon."},
{t:"Finders Keepers", net:"Nickelodeon", dec:"1990s", age:"6-9", cat:"Sports", cat2:"Comedy", g:"neutral", lang:"English", d:"Kid teams tear through a messy house set searching for hidden prizes against the clock (1987\u20131990, reran into the 90s). Its destructive, high-energy format made it an early template for physical Nickelodeon game shows."},
{t:"Global Guts", net:"Nickelodeon", dec:"1990s", age:"6-9", cat:"Sports", cat2:"Comedy", g:"neutral", lang:"English", d:"International teen athletes compete in the same obstacle-course challenges as the original GUTS (1995\u20131996). It expanded the GUTS format with a global roster of competitors and a bigger arena."},
{t:"Mao Mao: Heroes of Pure Heart", net:"Cartoon Network", dec:"2010s", age:"6-9", cat:"Adventure", cat2:"Superhero & Action", g:"neutral", lang:"English", d:"A self-proclaimed legendary sheriff protects a quirky town from stylized villains (2019\u20132021). Its blend of stylized action and comedic sincerity gave it a distinct visual identity among CN's original series."},
{t:"Grim & Evil", net:"Cartoon Network", dec:"2000s", age:"6-9", cat:"Comedy", cat2:"Superhero & Action", g:"neutral", lang:"English", d:"Anthology series pairing two kids' friendship with the Grim Reaper alongside a villain's inept plots for world domination (2001\u20132003). It later split into two separate spin-off series, Billy & Mandy and Evil Con Carne."},
{t:"Nexo Knights", net:"Cartoon Network", dec:"2010s", age:"6-9", cat:"Adventure", cat2:"Superhero & Action", g:"boys", lang:"English", d:"LEGO knights use tech-powered armor to defend their kingdom from an evil sorcerer (2016\u20132017). Its combination of medieval fantasy and futuristic gadgets tied directly into a companion toy line."},
{t:"Wacky Races (2017)", net:"Cartoon Network", dec:"2010s", age:"6-9", cat:"Comedy", cat2:"Sports", g:"neutral", lang:"English", d:"Rebooted version of the classic cross-country car race between colorful competitors and their gimmick vehicles (2017). It updates the original's slapstick racing format with modern animation and pacing."},
{t:"Scooby-Doo, Where Are You!", net:"Cartoon Network", dec:"1990s", age:"6-9", cat:"Mystery", cat2:"Superhero & Action", g:"neutral", lang:"English", d:"The original mystery-solving teens and their cowardly Great Dane unmask spooky frauds each episode (1969\u20131970, long a Cartoon Network staple in reruns). Its unmask-the-villain formula became the template for decades of Scooby-Doo spin-offs."},
{t:"A Pup Named Scooby-Doo", net:"Cartoon Network", dec:"1990s", age:"6-9", cat:"Mystery", cat2:"Music & Arts", g:"neutral", lang:"English", d:"A kid-aged version of the Mystery Inc. gang solves lighter, sillier cases (1988\u20131991, reran heavily on Cartoon Network in the 90s). Its younger cast and broader humor made it a favorite entry point into the franchise for younger viewers."},
{t:"Dave the Barbarian", net:"Disney", dec:"2000s", age:"6-9", cat:"Comedy", cat2:"Superhero & Action", g:"neutral", lang:"English", d:"A cowardly warrior prince and his oddball royal family defend their kingdom from mishaps and monsters (2004\u20132005). It leaned into absurdist medieval-fantasy humor rather than traditional hero storytelling."},
{t:"Kickin' It", net:"Disney", dec:"2010s", age:"6-9", cat:"Sports", cat2:"Music & Arts", g:"neutral", lang:"English", d:"A rebellious teen joins a struggling dojo and helps whip its misfit students into a real martial arts team (2011\u20132015). Its underdog sports-team structure was built around tournament arcs and training-montage humor."},
{t:"TRON: Uprising", net:"Disney", dec:"2010s", age:"7-9", cat:"Sci-Fi", cat2:"Superhero & Action", g:"neutral", lang:"English", d:"A program-turned-rebel fights an oppressive regime inside the digital world of the Grid (2012\u20132013). Its stylish, high-stakes tone made it a standout, if short-lived, entry in Disney XD's action lineup."},
{t:"The 7D", net:"Disney", dec:"2010s", age:"6-9", cat:"Comedy", cat2:"Fantasy & Magic", g:"neutral", lang:"English", d:"The seven dwarfs from Snow White get into slapstick misadventures defending their kingdom (2014\u20132016). It reimagines classic Disney characters with a broader, sillier comedic style aimed at younger viewers."},
{t:"The Lion Guard", net:"Disney", dec:"2010s", age:"6-9", cat:"Adventure", cat2:"Science & Nature", g:"neutral", lang:"English", d:"A new generation of animal guardians protects the Pride Lands in this Lion King spin-off (2016\u20132019). Teamwork among a diverse group of young animals drives most of its episodic conflicts."},
{t:"Muppet Babies (1984)", net:"Disney", dec:"1990s", age:"4-8", cat:"Comedy", cat2:"Adventure", g:"neutral", lang:"English", d:"Infant versions of the classic Muppet characters imagine wild adventures from their nursery playroom (1984\u20131991, reran into the 90s). Its imagination-driven format mixed original footage with clips from classic films and shows."},
{t:"The Wuzzles", net:"Disney", dec:"1990s", age:"4-8", cat:"Fantasy & Magic", cat2:"Science & Nature", g:"neutral", lang:"English", d:"Hybrid animal creatures navigate whimsical adventures on their magical island home (1985, reran into the 90s). Its playful mash-up character designs made it a memorable, if short-lived, part of Disney's afternoon lineup."},
{t:"Lab Rats: Elite Force", net:"Disney", dec:"2010s", age:"7-9", cat:"Superhero & Action", cat2:"Sports", g:"neutral", lang:"English", d:"Bionic teens team up with a fellow young hero to form an elite crime-fighting squad (2016). It merged characters from two separate Disney XD series into one combined action team."},
{t:"Marvel's Hulk and the Agents of S.M.A.S.H.", net:"Disney", dec:"2010s", age:"7-9", cat:"Superhero & Action", cat2:"Sports", g:"neutral", lang:"English", d:"The Hulk assembles a team of gamma-powered heroes to battle cosmic threats (2013\u20132015). Its ensemble format let each episode spotlight different combinations of super-strength powers and personalities."},
{t:"Marvel's Rocket & Groot", net:"Disney", dec:"2010s", age:"7-9", cat:"Sci-Fi", cat2:"Adventure", g:"neutral", lang:"English", d:"Two Guardians of the Galaxy characters get into short, comedic space misadventures (2017). Its short-form episodes distilled the duo's buddy-comedy chemistry into quick, snackable adventures."},
{t:"LEGO Star Wars: Droid Tales", net:"Disney", dec:"2010s", age:"6-9", cat:"Sci-Fi", cat2:"Comedy", g:"neutral", lang:"English", d:"Two droids recount comedic retellings of Star Wars saga events with a LEGO twist (2015). Its anthology format let familiar Star Wars moments get reimagined through a lighter, joke-filled lens."},
{t:"Star Wars: Young Jedi Adventures", net:"Disney", dec:"2020s", age:"4-8", cat:"Adventure", cat2:"Fantasy & Magic", g:"neutral", lang:"English", d:"Young Jedi younglings learn the ways of the Force through kid-friendly missions (2023\u2013present). It introduces core Star Wars concepts and characters to the franchise's youngest viewers."},
{t:"Pac-Man and the Ghostly Adventures", net:"Disney", dec:"2010s", age:"6-9", cat:"Adventure", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A teenage Pac-Man attends high school while defending his town from ghost invaders (2013\u20132015). It reimagines the classic arcade character with a modern action-comedy spin."},
{t:"Dorg Van Dango", net:"Disney", dec:"2020s", age:"6-9", cat:"Sci-Fi", cat2:"Comedy", g:"neutral", lang:"English", d:"A boy and his shapeshifting alien companion get into offbeat comedic adventures (2020). Its odd-couple premise blends lighthearted sci-fi with everyday coming-of-age humor."},
{t:"Marvel's Spider-Man: Freshman Year", net:"Disney", dec:"2020s", age:"7-9", cat:"Superhero & Action", cat2:"Music & Arts", g:"neutral", lang:"English", d:"A teenage Peter Parker balances high school life with his earliest days as Spider-Man (2024\u2013present). Its retro-styled art and origin-story focus offer a fresh entry point into the character for young viewers."},
{t:"The Creature Cases", net:"Apple TV+", dec:"2020s", age:"6-9", cat:"Mystery", cat2:"Science & Nature", g:"neutral", lang:"English", d:"Two animal detectives investigate strange cases across a hidden world of creatures (2022\u2013present, Apple TV+). Its noir-tinged mystery format is softened by colorful, kid-friendly art and gentle humor."},
{t:"The Mighty Ones", net:"Apple TV+", dec:"2020s", age:"4-8", cat:"Comedy", cat2:"Adventure", g:"neutral", lang:"English", d:"Tiny backyard bugs treat their small world like an epic adventure (2020\u20132022, Apple TV+). Its miniature-scale setting turns everyday backyard objects into larger-than-life obstacles."},
{t:"Mech Cadets", net:"Netflix", dec:"2020s", age:"7-9", cat:"Sci-Fi", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Teens bonded to giant alien robots train to defend Earth from invasion (2023, Netflix). Its giant-robot premise pairs coming-of-age school drama with large-scale action sequences."},
{t:"Oddballs", net:"Netflix", dec:"2020s", age:"6-9", cat:"Comedy", cat2:"Sports", g:"neutral", lang:"English", d:"A ragtag group of puppet skateboarders gets into over-the-top comedic mayhem (2022, Netflix). Its puppet-based skate-punk style set it apart visually from most streaming-era kids' comedies."},
{t:"Dragons: The Nine Realms", net:"Streaming & Other", dec:"2020s", age:"6-9", cat:"Fantasy & Magic", cat2:"Adventure", g:"neutral", lang:"English", d:"Kids centuries after the original How to Train Your Dragon saga rediscover dragons in their world (2021\u2013present, Peacock). It extends the franchise's dragon-bonding themes into a new modern-day setting."},
{t:"The Epic Tales of Captain Underpants", net:"Netflix", dec:"2010s", age:"6-9", cat:"Comedy", cat2:"Superhero & Action", g:"neutral", lang:"English", d:"Two prank-loving kids accidentally hypnotize their principal into believing he's a superhero (2018\u20132020, Netflix). Its irreverent, bathroom-humor-friendly tone stays close to the source books' comedic spirit."},
{t:"Ask the StoryBots", net:"Netflix", dec:"2010s", age:"6-9", cat:"Preschool Learning", cat2:"Adventure", g:"neutral", lang:"English", d:"Curious robot characters research answers to kids' real submitted questions through songs and sketches (2016\u20132019, Netflix). Its question-and-answer format directly channels genuine kid curiosity into each episode."},
{t:"Archibald's Next Big Thing", net:"Apple TV+", dec:"2020s", age:"6-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"An overconfident rooster convinces his farm friends to chase his latest big scheme (2021, Apple TV+). Each episode follows his plans spiraling into chaos before a lesson about humility lands."},
{t:"Go! Go! Cory Carson", net:"Netflix", dec:"2020s", age:"4-8", cat:"Adventure", cat2:"Fantasy & Magic", g:"neutral", lang:"English", d:"A young car and his vehicle friends explore their town and learn everyday lessons (2020\u20132022, Netflix). Its vehicle-populated world offers a playful twist on standard neighborhood adventure stories."},
{t:"The Last Bus", net:"Netflix", dec:"2020s", age:"6-9", cat:"Superhero & Action", cat2:"Sports", g:"neutral", lang:"English", d:"Ordinary kids gain extraordinary powers after a mysterious school bus ride and must learn to use them together (2022, Netflix). Its ensemble of young heroes leans on teamwork over any single chosen one."},
{t:"Kung Fu Panda: The Dragon Knight", net:"Netflix", dec:"2020s", age:"6-9", cat:"Adventure", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Po travels the world hunting down scattered magical weapons before they fall into the wrong hands (2022\u20132023, Netflix). It expands the film franchise's martial-arts adventure into a globe-trotting series format."},
{t:"The Barbarian and the Troll", net:"Streaming & Other", dec:"2020s", age:"6-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A mighty barbarian and his troll sidekick bumble through fantasy-world odd jobs (2022, Amazon). Its short-form episodes favor quick sight gags over an ongoing storyline."},
{t:"My Dad the Bounty Hunter", net:"Netflix", dec:"2020s", age:"6-9", cat:"Sci-Fi", cat2:"Adventure", g:"neutral", lang:"English", d:"Kids discover their father is secretly a galaxy-hopping bounty hunter and get swept into his missions (2023, Netflix). Its family-adventure framing keeps its space-faring action grounded in relatable sibling dynamics."},
{t:"Just Beyond", net:"Disney", dec:"2020s", age:"7-9", cat:"Mystery", cat2:"Adventure", g:"neutral", lang:"English", d:"Anthology series adapting mildly spooky, twist-ending stories in the vein of classic campfire tales (2021, Disney+/R.L. Stine). Each episode is self-contained, favoring gentle scares over genuine horror."},
{t:"Woody Woodpecker", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Comedy", cat2:"Adventure", g:"neutral", lang:"English", d:"Rebooted version of the classic mischievous woodpecker's slapstick misadventures (2018\u2013present, Peacock/Universal). It keeps the original character's manic energy and iconic laugh intact for a new generation."},
{t:"Horrid Henry", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Comedy", cat2:"Music & Arts", g:"neutral", lang:"English", d:"A gleefully naughty boy schemes to avoid chores and outsmart his goody-two-shoes brother (2006\u20132011, British animated series). Its exaggerated sibling rivalry and mischief-first attitude made it a hit with young UK audiences."},
{t:"Horrible Histories", net:"BBC / British TV", dec:"2000s", age:"7-9", cat:"Comedy", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Sketch-comedy series turning gruesome and bizarre historical facts into songs and skits (2009\u20132013, CBBC). Its irreverent take on real history became known for making unpleasant facts genuinely funny and memorable."},
{t:"Deadly 60", net:"BBC / British TV", dec:"2000s", age:"7-9", cat:"Science & Nature", cat2:"Sports", g:"neutral", lang:"English", d:"A wildlife presenter races to track down 60 of the world's most formidable animals (2009\u20132016, BBC). Its adrenaline-forward approach to nature documentary made predator biology feel like an adventure show."},
{t:"Art Attack", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Music & Arts", cat2:"Comedy", g:"neutral", lang:"English", d:"A host demonstrates ambitious craft and drawing projects using household materials (1990\u20132007, international format). Its big-reveal 'giant art attack' segments made large-scale art feel achievable for kids at home."},
{t:"SMart", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Music & Arts", cat2:"Comedy", g:"neutral", lang:"English", d:"Hosts guide kids through accessible art and craft projects using everyday supplies (1993\u20132011, Canadian CBC). Its friendly, unhurried pacing focused on process over perfection."},
{t:"Mona the Vampire", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Mystery", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A girl with an overactive imagination reinvents her neighborhood as a world of monsters and mysteries to solve (1999\u20132003, Canadian/French co-production). Its blend of real childhood anxieties with fantastical framing gave it unusual emotional depth."},
{t:"Busytown Mysteries", net:"Streaming & Other", dec:"2000s", age:"5-9", cat:"Mystery", cat2:"Science & Nature", g:"neutral", lang:"English", d:"Animal detectives in Richard Scarry's Busytown solve gentle everyday mysteries (2007\u20132009, Canadian series). Its classic storybook setting brings a beloved illustrated world to life through simple whodunit plots."},
{t:"Camp Lakebottom", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"Kids at a haunted summer camp get tangled up in supernatural mischief and monster antics (2013\u20132016, Canadian series). Its ghost-story setting is played mostly for laughs rather than genuine scares."},
{t:"Numb Chucks", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Comedy", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Twin siblings navigate the chaos of middle school using questionable martial arts wisdom (2014\u20132017, Canadian series). Its over-the-top physical comedy leans on the twins' contrasting personalities."},
{t:"Art Ninja", net:"BBC / British TV", dec:"2010s", age:"6-9", cat:"Music & Arts", cat2:"Comedy", g:"neutral", lang:"English", d:"A host demonstrates ambitious craft projects and stunts with an athletic, high-energy twist (2016\u2013present, CBBC). Its blend of art instruction and physical challenge set it apart from more traditional craft shows."},
{t:"Blue Peter", net:"BBC / British TV", dec:"1990s", age:"6-9", cat:"Life Skills & Emotions", cat2:"Comedy", g:"neutral", lang:"English", d:"Long-running magazine show mixing crafts, challenges, guest interviews, and charity appeals for kids (1958\u2013present, BBC). Its decades-long run makes it one of the longest-running children's television programs in the world."},
{t:"Dragon Ball Super", net:"Streaming & Other", dec:"2010s", age:"7-9", cat:"Superhero & Action", cat2:"Fantasy & Magic", g:"neutral", lang:"Japanese", d:"Goku and his allies face increasingly powerful multiversal threats in this continuation of the Dragon Ball saga (2015\u20132018, English dub 2017). It picks up after the events of Dragon Ball Z with higher-stakes tournament arcs."},
{t:"Digimon Ghost Game", net:"Streaming & Other", dec:"2020s", age:"7-9", cat:"Sci-Fi", cat2:"Sports", g:"neutral", lang:"Japanese", d:"Kids encounter digital monsters that manifest as real-world 'hologram' hauntings (2021\u20132023, English dub 2023). It blends the franchise's usual digital-partner adventures with a lighter mystery-of-the-week structure."},
{t:"Bakugan: Battle Planet", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Sci-Fi", cat2:"Superhero & Action", g:"boys", lang:"Japanese", d:"Rebooted version of the battling-creature-orb franchise, following new kids and their Bakugan partners (2018\u20132019). It refreshes the original 2000s series' toy-driven battle format for a new generation."},
{t:"Beyblade X", net:"Streaming & Other", dec:"2020s", age:"6-9", cat:"Sports", cat2:"Superhero & Action", g:"boys", lang:"Japanese", d:"Latest generation of the spinning-top battle franchise, introducing new Beyblade designs and tournament rules (2023\u2013present). It continues the series' long-running blend of strategy-driven toy battles and rivalry storylines."},
{t:"Yu-Gi-Oh! 5D's", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Adventure", cat2:"Sports", g:"boys", lang:"Japanese", d:"Duelists race motorcycles while battling in a futuristic city built on card-game tournaments (2008\u20132011, English dub 2009). It introduced high-speed 'Turbo Duels' as a new spin on the franchise's card battles."},
{t:"Justin Time GO!", net:"Streaming & Other", dec:"2010s", age:"4-8", cat:"Adventure", cat2:"Sci-Fi", g:"neutral", lang:"English", d:"A boy and his imaginary friend travel through time and space solving problems with creative thinking (2018\u20132020, sequel series). It continues the original show's blend of imaginative play and gentle problem-solving lessons."},
{t:"Remy & Boo", net:"Streaming & Other", dec:"2010s", age:"4-8", cat:"Life Skills & Emotions", cat2:"Science & Nature", g:"neutral", lang:"English", d:"A boy and his stuffed dinosaur friend navigate everyday emotional ups and downs together (2019\u2013present, Universal Kids). Its gentle, slice-of-life tone focuses on naming and working through common childhood feelings."},
{t:"Genie in the House", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Fantasy & Magic", cat2:"Comedy", g:"neutral", lang:"English", d:"A boy accidentally frees a young genie who moves in and grants wishes with unpredictable results (2006\u20132009, British series). Its wish-gone-wrong structure gives each episode a clear comedic setup and payoff."},
{t:"Cardfight!! Vanguard", net:"Streaming & Other", dec:"2010s", age:"7-9", cat:"Adventure", cat2:"Sports", g:"boys", lang:"Japanese", d:"A shy boy grows in confidence through a futuristic holographic card-battling game (2011\u20132012, English dub). Its card-game premise tied closely to a real trading card game released alongside the show."},
{t:"Inazuma Eleven", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Sports", cat2:"Superhero & Action", g:"boys", lang:"Japanese", d:"A determined boy rebuilds his school's soccer team using flashy, larger-than-life special moves (2008\u20132011, English dub 2011). It blends realistic sports-team drama with exaggerated, almost superhero-style gameplay."},
{t:"Sonic Prime", net:"Netflix", dec:"2020s", age:"6-9", cat:"Adventure", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Sonic is flung across a shattered multiverse of alternate worlds after a reality-altering event (2022\u20132024, Netflix). Its serialized, higher-stakes storytelling marks a departure from earlier, more episodic Sonic cartoons."},
{t:"Transformers: EarthSpark", net:"Streaming & Other", dec:"2020s", age:"6-9", cat:"Sci-Fi", cat2:"Superhero & Action", g:"neutral", lang:"English", d:"A family of humans befriends a new generation of Transformers born on Earth rather than built (2022\u2013present, Paramount+). It centers on found-family themes alongside the franchise's usual robot action."},
{t:"Transformers: Rescue Bots Academy", net:"Streaming & Other", dec:"2010s", age:"4-8", cat:"Sci-Fi", cat2:"Superhero & Action", g:"neutral", lang:"English", d:"Young Rescue Bots train to become emergency-response heroes under adult mentor guidance (2019\u20132021). It continues the franchise's gentler, preschool-friendly approach to robot heroics and teamwork."},
{t:"Do, Re & Mi", net:"Netflix", dec:"2020s", age:"4-8", cat:"Music & Arts", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"Three musical friends use songs and instruments to work through everyday problems together (2022\u2013present, Netflix). Its original songs are built around simple emotional and social lessons for young viewers."},
{t:"LEGO Ninjago: Dragons Rising", net:"Streaming & Other", dec:"2020s", age:"6-9", cat:"Adventure", cat2:"Music & Arts", g:"neutral", lang:"English", d:"A new generation of ninja discover ancient dragon powers threatening their world (2023\u2013present). It continues the long-running Ninjago franchise's blend of martial-arts action and elemental fantasy powers."},
{t:"Digimon Adventure: (2020)", net:"Streaming & Other", dec:"2020s", age:"7-9", cat:"Sci-Fi", cat2:"Music & Arts", g:"neutral", lang:"Japanese", d:"Reimagined retelling of the original Digimon story, following kids bonded to digital monster partners in a new world (2020\u20132021, English dub 2021). It updates the franchise's origin story with modern animation and pacing."},
{t:"Grandpa in My Pocket", net:"BBC / British TV", dec:"2010s", age:"4-8", cat:"Fantasy & Magic", cat2:"Mystery", g:"neutral", lang:"English", d:"A boy's grandfather can shrink himself down using a magic pebble to solve tiny-scale problems (2009\u20132013, CBBC). Its shrinking-adventure premise turns ordinary rooms into miniature obstacle courses."},
{t:"Andy's Dinosaur Adventures", net:"BBC / British TV", dec:"2010s", age:"4-8", cat:"Science & Nature", cat2:"Adventure", g:"neutral", lang:"English", d:"A safari-suited host travels back in time to meet real prehistoric creatures (2014\u20132016, CBBC). It pairs paleontology facts with an adventurous, exploration-driven format for young viewers."},
{t:"Newsround", net:"BBC / British TV", dec:"1990s", age:"7-9", cat:"Life Skills & Emotions", cat2:"Comedy", g:"neutral", lang:"English", d:"Long-running news program explaining current events in age-appropriate terms for young viewers (1972\u2013present, BBC). Its straightforward, respectful approach to real news has made it a trusted staple of British children's programming for decades."},
{t:"Wallace and Gromit's Cracking Contraptions", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Comedy", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Short stop-motion episodes showcasing an inventor's elaborate, gag-filled machines (2002, British series). Its wordless, visual-gag-driven humor makes it accessible regardless of language."},
{t:"Atomic Betty", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"neutral", lang:"English", d:"An ordinary schoolgirl secretly protects the galaxy as a top intergalactic space hero (2004\u20132008, Canadian/French co-production). Its double-life premise balances everyday school scenes with over-the-top space battles."},
{t:"Dennis & Gnasher: Unleashed!", net:"BBC / British TV", dec:"2010s", age:"6-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A mischievous boy and his equally wild dog cause chaos around their town (2017\u20132021, CBBC, based on the Beano comic). Its rapid-fire slapstick humor stays close to the comic strip's anarchic spirit."},
{t:"Operation Ouch!", net:"BBC / British TV", dec:"2010s", age:"6-9", cat:"Science & Nature", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Twin doctor hosts explore the human body through hands-on experiments and real medical demonstrations (2012\u2013present, CBBC). Its willingness to show real (if squeamish) medical facts sets it apart from typical kids' science shows."},
{t:"Absolute Genius with Dick and Dom", net:"BBC / British TV", dec:"2010s", age:"6-9", cat:"Science & Nature", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Two comedic hosts explore the science behind historical inventions through hands-on demonstrations (2013\u20132014, CBBC). Its irreverent hosting style keeps the STEM content lighthearted and accessible."},
{t:"Jamie Johnson", net:"BBC / British TV", dec:"2010s", age:"7-9", cat:"Sports", cat2:"Music & Arts", g:"boys", lang:"English", d:"A talented young footballer chases his dream of going pro while navigating family and team drama (2011\u20132019, CBBC). Its grounded, character-driven approach to a sports underdog story set it apart from more fantastical kids' programming."},
{t:"The Sarah Jane Adventures", net:"BBC / British TV", dec:"2000s", age:"7-9", cat:"Sci-Fi", cat2:"Mystery", g:"neutral", lang:"English", d:"A Doctor Who spin-off following a former companion and her teen friends investigating alien threats on Earth (2007\u20132011, BBC). Its slightly more grounded, mystery-driven tone made it an accessible entry point into the wider Doctor Who universe."},
{t:"M.I. High", net:"BBC / British TV", dec:"2000s", age:"7-9", cat:"Mystery", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"Ordinary schoolkids secretly work as spies for a British intelligence agency (2007\u20132014, CBBC). Its school-meets-espionage premise mixes classroom scenes with gadget-driven missions."},
{t:"Crash Course Kids", net:"YouTube", dec:"2010s", age:"7-9", cat:"Science & Nature", cat2:"Adventure", g:"neutral", lang:"English", d:"Fast-paced educational videos breaking down elementary science topics for young learners (2015\u20132016). Its energetic host and quick pacing distilled complex ideas into digestible, curriculum-aligned lessons."},
{t:"Mystery Doug", net:"YouTube", dec:"2010s", age:"6-9", cat:"Science & Nature", cat2:"Adventure", g:"neutral", lang:"English", d:"A host answers real kid-submitted science questions with short, engaging explainer videos (2016\u2013present). Its question-driven format mirrors genuine classroom curiosity, often built around questions teachers submit from their students."},
{t:"Free School", net:"YouTube", dec:"2010s", age:"6-9", cat:"Preschool Learning", cat2:"Science & Nature", g:"neutral", lang:"English", d:"Educational channel covering art, history, geography, and science topics through simple narrated videos (2013\u2013present). Its calm, straightforward style favors clear information over flashy production."},
{t:"Kid President", net:"YouTube", dec:"2010s", age:"6-9", cat:"Life Skills & Emotions", cat2:"Comedy", g:"neutral", lang:"English", d:"A young host delivers upbeat, encouraging pep talks and mini-documentaries about kindness (2012\u20132016). Its earnest, high-energy positivity made it a viral hit well beyond its original young audience."},
{t:"Brave Wilderness", net:"YouTube", dec:"2010s", age:"7-9", cat:"Science & Nature", cat2:"Adventure", g:"neutral", lang:"English", d:"A wildlife educator gets up close with animals around the world, from bugs to reptiles (2014\u2013present). Its hands-on, high-energy approach to animal encounters makes wildlife facts feel like real adventure."},
{t:"EvanTubeHD", net:"YouTube", dec:"2010s", age:"6-9", cat:"Comedy", cat2:"Sports", g:"neutral", lang:"English", d:"A kid host reviews toys, games, and family-friendly experiences alongside his family (2011\u2013present). Its kid's-eye-view commentary on toys and games gave it broad appeal among young viewers."},
{t:"SciShow", net:"YouTube", dec:"2010s", age:"7-9", cat:"Science & Nature", cat2:"Adventure", g:"neutral", lang:"English", d:"Fast-paced videos explaining science topics and current discoveries in an accessible, curious tone (2012\u2013present). Older viewers within the 6-9 range can follow its clear explanations alongside a parent."},
{t:"TheOdd1sOut", net:"YouTube", dec:"2010s", age:"7-9", cat:"Comedy", cat2:"Music & Arts", g:"neutral", lang:"English", d:"An animator narrates comedic true stories from his own life using simple stick-figure animation (2014\u2013present). Its relatable, self-deprecating storytelling style made it one of the most popular kid-friendly animation channels."},
{t:"Bea's Block", net:"Streaming & Other", dec:"2020s", age:"2-5", cat:"Preschool Learning", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"Sesame Workshop preschool series exploring emotions and community through a young Black girl's daily adventures (2024\u2013present, Max). It expands Sesame Street's legacy of social-emotional learning with a contemporary, single-family focus."},
{t:"The Ollie and Moon Show", net:"Streaming & Other", dec:"2010s", age:"2-5", cat:"Adventure", cat2:"Preschool Learning", g:"neutral", lang:"English", d:"Two globe-trotting cat cousins explore world cultures and problem-solving (2016\u20132018, streaming on Max). Its travel-of-the-week structure introduces young viewers to real places and customs."},
{t:"Messy Goes to Okido", net:"Streaming & Other", dec:"2010s", age:"3-6", cat:"Science & Nature", cat2:"Preschool Learning", g:"neutral", lang:"English", d:"A curious monster-like character explores science and art concepts in the town of Okido (2014\u2013present, streaming on Max). Each episode pairs a simple experiment with a companion curiosity."},
{t:"Circuit Squad", net:"Cartoon Network", dec:"2010s", age:"5-7", cat:"Sci-Fi", cat2:"Superhero & Action", g:"boys", lang:"English", d:"A crew of kid-built robots patrol their city's power grid against rogue machines (2016–2018)."},
{t:"Esme & Roy", net:"Streaming & Other", dec:"2010s", age:"2-5", cat:"Life Skills & Emotions", cat2:"Preschool Learning", g:"neutral", lang:"English", d:"A young babysitter and her monster friend Roy care for a menagerie of monster friends, modeling patience and empathy (2018\u20132020, Max). Its themes were designed with early-childhood specialists to reinforce caregiving behaviors."},
{t:"Love Monster", net:"Streaming & Other", dec:"2010s", age:"2-5", cat:"Life Skills & Emotions", cat2:"Comedy", g:"neutral", lang:"English", d:"A small, fuzzy monster navigates everyday feelings like jealousy and worry with gentle humor (2020\u20132022, Max). Its short-form episodes are built around simple emotional vocabulary for toddlers."},
{t:"Naked Mole Rat Gets Dressed", net:"Streaming & Other", dec:"2020s", age:"3-6", cat:"Music & Arts", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"Mo Willems' musical special follows a naked mole rat who dares to wear clothes despite his community's disapproval (2020, Max). Its rock-opera format champions individuality with catchy original songs."},
{t:"Hop", net:"Streaming & Other", dec:"2020s", age:"2-5", cat:"Preschool Learning", cat2:"Adventure", g:"neutral", lang:"English", d:"Animated preschool series following a small character's playful daily discoveries (2024\u2013present, Max/Cartoonito). Its short episodes favor repetition and gentle pacing typical of toddler programming."},
{t:"Bakugan: Evolutions", net:"Streaming & Other", dec:"2020s", age:"5-7", cat:"Adventure", cat2:"Superhero & Action", g:"boys", lang:"English", d:"A new generation of Brawlers battles to stop an ancient evil from returning to Earth (2022–2023, Netflix)."},
{t:"Let's Go, Bananas!", net:"Streaming & Other", dec:"2020s", age:"2-5", cat:"Comedy", cat2:"Preschool Learning", g:"neutral", lang:"English", d:"A troupe of banana-shaped characters get into slapstick mishaps and simple problem-solving (2024\u2013present, Max/Cartoonito). Its wordless, visual-gag style is designed for the youngest viewers."},
{t:"Tom and Jerry in New York", net:"Streaming & Other", dec:"2020s", age:"4-8", cat:"Comedy", cat2:"Adventure", g:"neutral", lang:"English", d:"The classic cat-and-mouse duo relocate to a bustling New York City for new chase-based hijinks (2021\u20132022, Max). It keeps the silent-comedy slapstick tradition of the original theatrical shorts."},
{t:"Unicorn: Warriors Eternal", net:"Streaming & Other", dec:"2020s", age:"7-9", cat:"Fantasy & Magic", cat2:"Superhero & Action", g:"neutral", lang:"English", d:"Ancient warriors reincarnated across centuries team up with modern kids to battle a shape-shifting evil (2023, Max). Its serialized, mythology-heavy story skews toward older elementary viewers."},
{t:"Gremlins: Secrets of the Mogwai", net:"Streaming & Other", dec:"2020s", age:"7-9", cat:"Adventure", cat2:"Fantasy & Magic", g:"neutral", lang:"English", d:"A prequel to the Gremlins films follows a young Mr. Wing's adventure with a mogwai in 1920s Shanghai (2023, Max). Its serialized adventure plot expands the film franchise's mythology for family audiences."},
{t:"Mush-Mush & the Mushables", net:"Streaming & Other", dec:"2020s", age:"3-7", cat:"Adventure", cat2:"Fantasy & Magic", g:"neutral", lang:"English", d:"Small mushroom-like forest creatures go on gentle woodland adventures (2020\u2013present, Max/Cartoon Network). A Canadian-French co-production, it emphasizes cooperative problem-solving in a whimsical setting."},
{t:"Beyblade Burst QuadDrive", net:"Streaming & Other", dec:"2020s", age:"5-7", cat:"Sports", cat2:"Superhero & Action", g:"boys", lang:"Japanese", d:"Bladers race to master four-part Beyblades in high-speed tournament battles (2022–2023)."},
{t:"Thomas & Friends: All Engines Go", net:"Streaming & Other", dec:"2020s", age:"2-6", cat:"Adventure", cat2:"Preschool Learning", g:"neutral", lang:"English", d:"A CG-animated reboot of the Thomas the Tank Engine franchise follows the engines of Sodor on new adventures (2021\u2013present, Max/Cartoon Network). The redesign trades stop-motion models for a brighter, faster-paced animation style."},
{t:"My Adventures with Superman", net:"Streaming & Other", dec:"2020s", age:"7-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"neutral", lang:"English", d:"A young, anime-inspired Clark Kent navigates early superheroism alongside Lois Lane and Jimmy Olsen (2023\u2013present, Max). Its stylized animation and slower character focus distinguish it from prior Superman adaptations."},
{t:"Dragon Peak Patrol", net:"Streaming & Other", dec:"2010s", age:"5-7", cat:"Fantasy & Magic", cat2:"Adventure", g:"boys", lang:"English", d:"Young dragon riders guard a mountain village from marauding sky pirates (2014–2016)."},
{t:"Gortimer Gibbon's Life on Normal Street", net:"Streaming & Other", dec:"2010s", age:"7-9", cat:"Mystery", cat2:"Comedy", g:"neutral", lang:"English", d:"Three kids uncover odd mysteries hiding in plain sight on their suburban street (2014\u20132016, Amazon Prime Video). Each episode wraps a small-town mystery with a life lesson about friendship."},
{t:"Star Voyager Kids", net:"Disney", dec:"2010s", age:"5-7", cat:"Sci-Fi", cat2:"Adventure", g:"boys", lang:"English", d:"A crew of young cadets pilots a training starship on missions across the galaxy (2016–2018)."},
{t:"Comet Racer", net:"Streaming & Other", dec:"2010s", age:"5-7", cat:"Sports", cat2:"Sci-Fi", g:"boys", lang:"English", d:"Robot racers zip along neon tracks in a futuristic intergalactic circuit (2013–2015)."},
{t:"The Fairly OddParents: A New Wish", net:"Streaming & Other", dec:"2020s", age:"5-9", cat:"Fantasy & Magic", cat2:"Comedy", g:"neutral", lang:"English", d:"A live-action/animated hybrid reboot follows a new kid granted wishes by fairy godparents Cosmo and Wanda (2023\u2013present, Paramount+). It blends practical effects with animated characters in a format new to the franchise."},
{t:"Cadet Corps: Galaxy Patrol", net:"Disney", dec:"2010s", age:"5-7", cat:"Sci-Fi", cat2:"Adventure", g:"boys", lang:"English", d:"Young space cadets learn teamwork protecting outposts along a friendly frontier (2017–2019)."},
{t:"The Bravest Knight", net:"Streaming & Other", dec:"2010s", age:"4-8", cat:"Fantasy & Magic", cat2:"Adventure", g:"neutral", lang:"English", d:"A pumpkin farmer recounts to his daughter how he became a knight who saved a princess (2019, Hulu). Its storybook framing device retells classic fairy-tale beats with an inclusive modern family at its center."},
{t:"Shadow Cape Chronicles", net:"Streaming & Other", dec:"2010s", age:"5-7", cat:"Superhero & Action", cat2:"Mystery", g:"boys", lang:"English", d:"A masked young detective solves mysteries around his rain-slicked city (2015–2017)."},
{t:"Sesame Street: Mecha Builders", net:"Streaming & Other", dec:"2020s", age:"3-6", cat:"Preschool Learning", cat2:"Science & Nature", g:"neutral", lang:"English", d:"A Sesame Workshop spin-off follows kids who transform into giant robots to solve neighborhood problems (2024\u2013present, Max). It folds STEM and teamwork themes into a superhero-style premise for preschoolers."},
{t:"Legion of Zoom", net:"Streaming & Other", dec:"2020s", age:"5-9", cat:"Superhero & Action", cat2:"Comedy", g:"neutral", lang:"English", d:"Short-form DC series follows young supervillains-in-training at a school for future Flash rivals (2022, Max). Its shorts format delivers quick bursts of superhero comedy."},
{t:"Batman: Caped Crusader", net:"Streaming & Other", dec:"2020s", age:"7-9", cat:"Superhero & Action", cat2:"Mystery", g:"neutral", lang:"English", d:"A reimagined take on Batman's early years blends noir mystery with classic rogues' gallery villains (2024\u2013present, Amazon Prime Video). Its moodier, film-noir art style sets it apart from earlier Batman cartoons."},
{t:"The Really Loud House", net:"Streaming & Other", dec:"2020s", age:"6-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A live-action spin-off follows Lincoln Loud and his ten sisters navigating chaotic family life (2022\u2013present, Paramount+/Nickelodeon). It adapts the animated original's oversized-family humor into live action."},
{t:"The Mr. Men Show", net:"Streaming & Other", dec:"2000s", age:"2-6", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"Simple, shape-based characters like Mr. Bump and Little Miss Sunshine get into gentle comic mishaps (2008\u20132009; streaming on Amazon Prime Video). Based on Roger Hargreaves' books, it keeps the source material's minimalist charm."},
{t:"Teenage Mutant Ninja Turtles: Mutant Mayhem", net:"Streaming & Other", dec:"2020s", age:"5-7", cat:"Superhero & Action", cat2:"Comedy", g:"boys", lang:"English", d:"Teenage turtle brothers try to earn acceptance from the human world above the sewers (2023–present, Paramount+)."},
{t:"Molang", net:"Streaming & Other", dec:"2010s", age:"2-5", cat:"Comedy", cat2:"Adventure", g:"neutral", lang:"French", d:"A round, expressive rabbit-like character and his chick friend Piu Piu get into wordless comic mishaps (2015\u2013present; streaming on Amazon Prime Video). Originally a French-Korean digital character, the series relies entirely on visual comedy rather than dialogue."},
{t:"Danger Rangers", net:"Streaming & Other", dec:"2000s", age:"4-8", cat:"Life Skills & Emotions", cat2:"Adventure", g:"neutral", lang:"English", d:"Animal rescue rangers teach kids about safety around hazards like fire and water (2005\u20132007; streaming on Amazon Prime Video/Tubi). Each episode ties a specific safety lesson to a lighthearted rescue mission."},
{t:"Wibbly Pig", net:"Streaming & Other", dec:"2000s", age:"1-4", cat:"Preschool Learning", cat2:"Comedy", g:"neutral", lang:"English", d:"A cheerful young pig navigates simple everyday adventures and mild mischief (2009\u20132010; streaming on Amazon Prime Video). Its gentle slice-of-life episodes suit very young preschool viewers."},
{t:"Get Well Soon", net:"Streaming & Other", dec:"2010s", age:"3-6", cat:"Life Skills & Emotions", cat2:"Science & Nature", g:"neutral", lang:"English", d:"A friendly on-screen doctor and puppet patients explain common childhood illnesses and treatments (2010\u20132013, CBeebies/streaming on Amazon Prime Video). Its gentle, reassuring tone is designed to ease anxiety around doctor visits."},
{t:"Swashbuckle", net:"Streaming & Other", dec:"2010s", age:"4-8", cat:"Comedy", cat2:"Adventure", g:"neutral", lang:"English", d:"Two pirate hosts lead a live-action game show filled with pirate-themed challenges (2011\u20132018, CBeebies/streaming on Amazon Prime Video). Its game-show format and slapstick humor set it apart from typical scripted preschool fare."},
{t:"Tree Fu Tom", net:"Streaming & Other", dec:"2010s", age:"3-7", cat:"Fantasy & Magic", cat2:"Adventure", g:"neutral", lang:"English", d:"A boy uses magic spells and simple exercise-based gestures to transform into a hero in a fantasy forest (2012\u20132014, CBeebies/streaming on Amazon Prime Video). Its movement-based magic system encourages young viewers to act out the spells themselves."},
{t:"Chicken Squad", net:"Streaming & Other", dec:"2010s", age:"4-8", cat:"Mystery", cat2:"Comedy", g:"neutral", lang:"English", d:"Three chicken siblings solve small neighborhood mysteries with help from their owl mentor (2018\u20132021, Amazon Prime Video). Based on the book series, its light mystery format wraps a gentle lesson around each case."},
{t:"Boj", net:"Streaming & Other", dec:"2010s", age:"2-5", cat:"Adventure", cat2:"Comedy", g:"neutral", lang:"English", d:"A claymation bear cub and his forest friends explore gentle everyday adventures (2014\u20132016, CBeebies/streaming on Amazon Prime Video). Its stop-motion textures give it a tactile, handmade look distinct from CG-heavy preschool shows."},
{t:"Caillou (2024)", net:"Streaming & Other", dec:"2020s", age:"2-5", cat:"Life Skills & Emotions", cat2:"Preschool Learning", g:"neutral", lang:"English", d:"A CGI reboot follows the bald preschooler exploring everyday routines and emotions (2024\u2013present, Peacock). It reimagines the long-running franchise with updated animation while keeping its gentle, slice-of-life format."},
{t:"Yu-Gi-Oh! SEVENS", net:"Streaming & Other", dec:"2020s", age:"5-7", cat:"Adventure", cat2:"Sports", g:"boys", lang:"Japanese", d:"A young duelist forms a Speed Duel club to bring dueling energy back to his city (2020–2022)."},
{t:"Team Mekbots Animal Rescue", net:"Streaming & Other", dec:"2020s", age:"3-7", cat:"Science & Nature", cat2:"Adventure", g:"neutral", lang:"English", d:"Four tech-savvy kids pilot specialized robot suits to rescue animals in danger around the world (2025\u2013present, Peacock). Its rescue-of-the-week format ties teamwork and problem-solving to real conservation themes."},
{t:"Bujji and Bhairava", net:"Streaming & Other", dec:"2020s", age:"5-9", cat:"Adventure", cat2:"Fantasy & Magic", g:"neutral", lang:"English", d:"An Indian animated series follows a young hero and his companion on fantastical adventures (2024, Amazon Prime Video). It brings a distinctly Indian animation style and mythology to the streaming platform's kids' slate."},
{t:"Charlotte's Web", net:"Streaming & Other", dec:"2020s", age:"4-8", cat:"Life Skills & Emotions", cat2:"Adventure", g:"neutral", lang:"English", d:"An animated adaptation follows the friendship between a pig named Wilbur and a clever spider named Charlotte (2025, Max). It brings E.B. White's classic story of loyalty and mortality to a new serialized format."},
{t:"The Chosen Adventures", net:"Streaming & Other", dec:"2020s", age:"5-9", cat:"Adventure", cat2:"Fantasy & Magic", g:"neutral", lang:"English", d:"An animated series follows a group of kids on faith-themed adventures (2025\u2013present, Amazon Prime Video). It extends its parent franchise's storytelling into a format aimed at younger family viewers."},
{t:"Dino Ranch: Island Explorers", net:"Streaming & Other", dec:"2020s", age:"3-7", cat:"Adventure", cat2:"Science & Nature", g:"neutral", lang:"English", d:"A spin-off follows the dino-riding Cassidy-Rodriguez family exploring a new island setting (2025\u2013present, Cartoonito/Max). It carries over the original show's cowboy-meets-dinosaur premise into fresh territory."},
{t:"Bug Bites", net:"Streaming & Other", dec:"2010s", age:"3-6", cat:"Science & Nature", cat2:"Comedy", g:"neutral", lang:"English", d:"Short animated segments introduce young viewers to insects and other small creatures through simple, funny scenarios (2020, Amazon Prime Video). Its bite-sized format suits short attention spans while sneaking in real bug facts."},
{t:"Rock Paper Scissors", net:"Streaming & Other", dec:"2020s", age:"4-8", cat:"Comedy", cat2:"Adventure", g:"neutral", lang:"English", d:"Three toy-box objects — a rock, paper, and scissors — go on playful adventures around a kid's bedroom (2023\u2013present, Nickelodeon/Paramount+). Its odd-trio premise turns simple household objects into an unlikely friend group."},
{t:"Data Hunters", net:"Streaming & Other", dec:"2010s", age:"5-7", cat:"Sci-Fi", cat2:"Sports", g:"boys", lang:"Japanese", d:"Kids partner with digital creatures to track down glitches loose in their city (2016–2018)."},
{t:"Jim Henson's Monster Dance", net:"Streaming & Other", dec:"2020s", age:"2-5", cat:"Music & Arts", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"Short-form dance segments invite kids to move and express big emotions alongside a new cast of Henson-style monster puppets (2020s, Amazon Kids+). It carries forward Jim Henson's puppetry legacy into a movement-focused format."},
{t:"BAT-FAM", net:"Streaming & Other", dec:"2020s", age:"5-9", cat:"Superhero & Action", cat2:"Comedy", g:"neutral", lang:"English", d:"Batman, Alfred, and a young Damian Wayne navigate family sitcom-style chaos between crime-fighting duties (2020s, Amazon Kids+). Its sitcom framing brings a lighter, family-comedy tone to the Batman universe."},
{t:"Angry Birds Mystery Island", net:"Streaming & Other", dec:"2020s", age:"4-8", cat:"Mystery", cat2:"Comedy", g:"neutral", lang:"English", d:"Characters from the Angry Birds game franchise solve island-set mysteries (2020s, Amazon Kids+). It extends the mobile-game property into a mystery-of-the-week animated format."},
{t:"Creative Galaxy", net:"Streaming & Other", dec:"2010s", age:"3-6", cat:"Music & Arts", cat2:"Adventure", g:"neutral", lang:"English", d:"A young alien named Arty and his ladybug companion travel the galaxy solving problems through art projects (2014\u20132016, Amazon Prime Video). Each episode invites viewers to try a related craft activity at home."},
{t:"Super Spy Ryan", net:"Streaming & Other", dec:"2020s", age:"4-8", cat:"Superhero & Action", cat2:"Comedy", g:"neutral", lang:"English", d:"A special from the Ryan's World franchise casts its young host as a gadget-toting secret agent (2020s, Amazon Kids+/Prime Video). It extends the massively popular toy-review brand into scripted spy-comedy territory."},
{t:"Cocomelon", net:"YouTube", dec:"2010s", age:"1-4", cat:"Music & Arts", cat2:"Preschool Learning", g:"neutral", lang:"English", d:"The most-watched children's channel on YouTube produces bright, repetitive 3D nursery rhymes and toddler songs (2006\u2013present, rebranded Cocomelon in 2018). Its simple visuals and catchy melodies are aimed squarely at toddlers and language-acquisition-age viewers."},
{t:"Toys and Colors", net:"YouTube", dec:"2010s", age:"2-6", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A family channel builds pretend-play skits and toy-based stories around everyday scenarios (2016\u2013present). Its playful, low-stakes storytelling format has made it one of the most-watched kids' channels globally."},
{t:"Khan Academy Kids", net:"YouTube", dec:"2010s", age:"2-6", cat:"Preschool Learning", cat2:"Science & Nature", g:"neutral", lang:"English", d:"Curriculum-aligned videos cover early reading, math, and social-emotional skills for young learners (2018\u2013present). It extends Khan Academy's nonprofit educational mission to a preschool-aged audience."},
{t:"KIDZ BOP", net:"YouTube", dec:"2010s", age:"5-9", cat:"Music & Arts", cat2:"Comedy", g:"neutral", lang:"English", d:"Kid performers sing clean, kid-friendly covers of current pop hits with accompanying dance videos (2011\u2013present). Its rotating lineup of young singers keeps the format aligned with current chart trends."},
{t:"Storyline Online", net:"YouTube", dec:"2010s", age:"3-8", cat:"Preschool Learning", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Actors read illustrated children's books aloud on camera, pairing narration with animated page art (2012\u2013present). It's produced by the SAG-AFTRA Foundation to encourage a love of reading."},
{t:"KidTime StoryTime", net:"YouTube", dec:"2010s", age:"2-6", cat:"Preschool Learning", cat2:"Comedy", g:"neutral", lang:"English", d:"Puppet hosts read picture books aloud with playful interjections and voices (2012\u2013present). Its puppet-and-book format keeps young viewers engaged through interactive-feeling storytelling."},
{t:"The Fable Cottage", net:"YouTube", dec:"2010s", age:"4-8", cat:"Fantasy & Magic", cat2:"Preschool Learning", g:"neutral", lang:"English", d:"Narrated animated retellings of classic fairy tales and fables are told in multiple languages (2016\u2013present). Its focus on traditional stories introduces kids to narrative structure and cultural folklore."},
{t:"Bright Side", net:"YouTube", dec:"2010s", age:"7-9", cat:"Science & Nature", cat2:"Comedy", g:"neutral", lang:"English", d:"Fast-paced videos cover fun facts, life hacks, and quizzes spanning science and everyday curiosities (2017\u2013present). Its broad, trivia-style format appeals to slightly older kids and tweens alongside younger viewers."},
{t:"Preschool Prep Company", net:"YouTube", dec:"2000s", age:"0-4", cat:"Preschool Learning", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Simple, repetitive videos teach letters, numbers, shapes, and colors to toddlers (2005\u2013present). Its no-frills, flashcard-style approach has made it a long-running staple of early learning content."},
{t:"Mother Goose Club", net:"YouTube", dec:"2000s", age:"1-5", cat:"Music & Arts", cat2:"Preschool Learning", g:"neutral", lang:"English", d:"Costumed performers sing classic nursery rhymes and children's songs in live-action videos (2008\u2013present). Its blend of puppetry, live actors, and animation sets it apart from purely animated rhyme channels."},
{t:"Akili and Me", net:"YouTube", dec:"2010s", age:"3-7", cat:"Preschool Learning", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"An educational animated series teaches early literacy, numeracy, and life skills to preschoolers across Africa (2017\u2013present). It was developed specifically to serve as a first classroom for children without access to preschool."},
{t:"Dave and Ava", net:"YouTube", dec:"2010s", age:"1-5", cat:"Music & Arts", cat2:"Preschool Learning", g:"neutral", lang:"English", d:"Animated 3D nursery rhymes and lullabies are aimed at babies and toddlers (2017\u2013present). Its calm, simple visuals are designed for very young viewers still developing language."},
{t:"LooLoo Kids", net:"YouTube", dec:"2010s", age:"1-5", cat:"Music & Arts", cat2:"Preschool Learning", g:"neutral", lang:"English", d:"A Romanian-produced channel offers animated nursery rhymes and toddler songs (2016\u2013present). Its global, multilingual reach has built a large following among preschool-aged viewers worldwide."},
{t:"WildBrain", net:"YouTube", dec:"2010s", age:"3-8", cat:"Adventure", cat2:"Comedy", g:"neutral", lang:"English", d:"The umbrella children's entertainment channel hosts clips and full episodes from a wide range of licensed kids' properties (2010s\u2013present). It aggregates content from many different animated franchises under one hub."},
{t:"PBS KIDS", net:"YouTube", dec:"2010s", age:"2-8", cat:"Preschool Learning", cat2:"Science & Nature", g:"neutral", lang:"English", d:"The official channel streams episodes and clips from PBS's roster of educational children's shows (2010s\u2013present). It centralizes PBS's public-broadcasting educational content for online viewing."},
{t:"Netflix Jr.", net:"YouTube", dec:"2010s", age:"2-8", cat:"Adventure", cat2:"Comedy", g:"neutral", lang:"English", d:"Clips and highlights from Netflix's children's programming slate are compiled for young viewers (2010s\u2013present). It functions as a promotional and sampler channel for Netflix's broader kids' catalog."},
{t:"Dr. Binocs Show", net:"YouTube", dec:"2010s", age:"5-9", cat:"Science & Nature", cat2:"Preschool Learning", g:"neutral", lang:"English", d:"An animated explainer character answers curious kid questions about science, history, and geography (2013\u2013present). Its direct, question-and-answer format mirrors a classroom Q&A session."},
{t:"Have Fun Teaching", net:"YouTube", dec:"2010s", age:"3-8", cat:"Preschool Learning", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Educational songs and videos cover phonics, math, and classroom routines for early learners (2011\u2013present). It's built around curriculum-style songs teachers can use directly in the classroom."},
{t:"FGTeeV", net:"YouTube", dec:"2010s", age:"6-9", cat:"Comedy", cat2:"Sports", g:"neutral", lang:"English", d:"A family plays and reacts to video games together in an energetic, sketch-comedy style (2013\u2013present). Its family dynamic and games-focused content have made it one of the most-watched family channels among kids."},
{t:"Power Rangers Cosmic Fury", net:"Streaming & Other", dec:"2020s", age:"5-7", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"The Rangers take their fight into deep space to stop an ancient cosmic threat (2023)."},
{t:"Ryan and Combo Panda", net:"YouTube", dec:"2010s", age:"3-7", cat:"Comedy", cat2:"Adventure", g:"neutral", lang:"English", d:"An animated spin-off of Ryan's World follows a boy and his robot panda friend through toy-inspired adventures (2019\u2013present). It translates its parent channel's toy-unboxing appeal into a narrative cartoon format."},
{t:"Fun Squad", net:"YouTube", dec:"2010s", age:"5-9", cat:"Comedy", cat2:"Sports", g:"neutral", lang:"English", d:"A family stages challenges, skits, and playful competitions for the camera (2016\u2013present). Its family-friendly game and challenge format is designed for repeat, binge-style viewing."},
{t:"Baby Einstein", net:"YouTube", dec:"2000s", age:"0-3", cat:"Preschool Learning", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Gentle videos pair classical music with simple visuals of toys, animals, and everyday objects (2000s\u2013present). Originally developed as an infant-stimulation video brand, it emphasizes calm, sensory-friendly content."},
{t:"The Toy Heroes", net:"YouTube", dec:"2010s", age:"4-8", cat:"Comedy", cat2:"Adventure", g:"neutral", lang:"English", d:"A British family creates skits and stories featuring popular toy characters (2013\u2013present). Its toy-centered storytelling format blends unboxing with light narrative play."},
{t:"The Who Was? Show", net:"Streaming & Other", dec:"2010s", age:"5-7", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"Sketch comedy brings famous historical figures to life through kid-friendly humor (2018\u20132019). Each episode turns a real person's story into a quick, punchline-driven history lesson."},
{t:"Twinkl", net:"YouTube", dec:"2010s", age:"3-8", cat:"Preschool Learning", cat2:"Science & Nature", g:"neutral", lang:"English", d:"An educational resources company shares classroom-style videos covering early literacy and numeracy topics (2010s\u2013present). Its content mirrors materials used by teachers in actual classrooms."},
{t:"Little Fox", net:"YouTube", dec:"2010s", age:"3-8", cat:"Preschool Learning", cat2:"Fantasy & Magic", g:"neutral", lang:"English", d:"Animated storybook episodes teach English vocabulary and phrases through short illustrated tales (2013\u2013present). Its graded-level stories are designed for children learning English as a second language."},
{t:"English Singsing", net:"YouTube", dec:"2010s", age:"3-8", cat:"Music & Arts", cat2:"Preschool Learning", g:"neutral", lang:"English", d:"Songs and chants teach basic English vocabulary and phonics to young language learners (2013\u2013present). Its sing-along format pairs repetition with simple, colorful animation."},
{t:"Maple Leaf Learning", net:"YouTube", dec:"2010s", age:"2-6", cat:"Preschool Learning", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Puppet-hosted videos teach English phonics, numbers, and vocabulary to young learners (2011\u2013present). Its consistent puppet cast gives repeat viewers familiar characters to learn alongside."},
{t:"Super Simple Play", net:"YouTube", dec:"2010s", age:"1-5", cat:"Music & Arts", cat2:"Comedy", g:"neutral", lang:"English", d:"A companion channel to Super Simple Songs features character-driven skits and playtime segments (2016\u2013present). It extends its parent channel's toddler-friendly music into narrative play scenarios."},
{t:"Pinkfong! Kids Stories & Fairy Tales", net:"YouTube", dec:"2010s", age:"2-6", cat:"Fantasy & Magic", cat2:"Music & Arts", g:"neutral", lang:"English", d:"The studio behind Baby Shark narrates classic fairy tales and original stories through animated songs (2010s\u2013present). It broadens Pinkfong's music-driven format into traditional storytelling."},
{t:"Gecko's Garage", net:"YouTube", dec:"2010s", age:"2-6", cat:"Science & Nature", cat2:"Preschool Learning", g:"boys", lang:"English", d:"A friendly gecko mechanic fixes trucks and vehicles while teaching basic problem-solving (2018\u2013present). Its vehicle-repair premise appeals strongly to young fans of trucks and machines."},
{t:"Moonbug Kids", net:"YouTube", dec:"2010s", age:"1-6", cat:"Music & Arts", cat2:"Comedy", g:"neutral", lang:"English", d:"A media company's channel compiles songs and stories from its stable of children's brands (2010s\u2013present). It serves as a central hub for several popular toddler-focused shows under one media company."},
{t:"CoComelon Animal Time", net:"YouTube", dec:"2020s", age:"1-5", cat:"Science & Nature", cat2:"Music & Arts", g:"neutral", lang:"English", d:"A spin-off channel focuses on animal-themed songs and stories using the same 3D animation style (2021\u2013present). It narrows its parent channel's format to nature and animal-focused content."},
{t:"Blippi Toys", net:"YouTube", dec:"2010s", age:"2-6", cat:"Comedy", cat2:"Preschool Learning", g:"neutral", lang:"English", d:"A companion channel to Blippi focuses on toy play and unboxing in the character's colorful, high-energy style (2018\u2013present). It extends the main channel's educational-through-exploration approach to toy-focused content."},
{t:"Power Rangers Mystic Force", net:"Streaming & Other", dec:"2000s", age:"5-7", cat:"Superhero & Action", cat2:"Fantasy & Magic", g:"boys", lang:"English", d:"New Rangers wield ancient magic to defend the Underworld gates from unleashed evil (2006)."},
{t:"Gus the Gummy Gator", net:"YouTube", dec:"2020s", age:"2-6", cat:"Comedy", cat2:"Preschool Learning", g:"neutral", lang:"English", d:"A gummy-candy alligator character explores playgrounds and everyday places with childlike wonder (2021\u2013present). It's part of the same educational-adventure family as Blippi and Meekah."},
{t:"LankyBox", net:"YouTube", dec:"2020s", age:"6-9", cat:"Comedy", cat2:"Adventure", g:"neutral", lang:"English", d:"Two hosts in colorful mascot costumes perform sketches, reactions, and toy-based comedy bits (2018\u2013present). Its high-energy, over-the-top style has made it one of the most-watched channels among elementary-aged kids."},
{t:"Cool School", net:"YouTube", dec:"2010s", age:"3-8", cat:"Preschool Learning", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Animated read-alongs, sing-alongs, and simple lessons cover early literacy and everyday topics (2013\u2013present). Its classroom-style format mimics a friendly teacher walking kids through each lesson."},
{t:"Sesame Studios", net:"YouTube", dec:"2010s", age:"2-6", cat:"Preschool Learning", cat2:"Music & Arts", g:"neutral", lang:"English", d:"A digital-first companion channel to Sesame Street features short-form songs, skits, and character moments (2019\u2013present). It's designed specifically for how young kids watch video on phones and tablets, apart from the TV show format."},
{t:"The Learning Station", net:"YouTube", dec:"2000s", age:"2-6", cat:"Music & Arts", cat2:"Preschool Learning", g:"neutral", lang:"English", d:"Movement-based songs get kids up and dancing while reinforcing counting, letters, and following directions (2007\u2013present). Its brand of educational movement songs is a frequent pick in classrooms and preschools."},

{t:"Julie's Greenroom", net:"Streaming & Other", dec:"2010s", age:"5-7", cat:"Music & Arts", cat2:"Preschool Learning", g:"neutral", lang:"English", d:"Julie Andrews and a puppet troupe teach the performing arts through hands-on lessons and mini-shows (2017). Guest artists join each episode to walk young viewers through a different craft, from dance to costume design."},
{t:"Kiboomers", net:"YouTube", dec:"2010s", age:"1-5", cat:"Music & Arts", cat2:"Preschool Learning", g:"neutral", lang:"English", d:"Animated kids' songs and nursery rhymes cover counting, alphabet, and movement themes (2013\u2013present). Its catalog of classic and original songs favors simple repetition suited to toddlers."},
{t:"Mother Goose Club Playhouse", net:"YouTube", dec:"2010s", age:"1-5", cat:"Music & Arts", cat2:"Comedy", g:"neutral", lang:"English", d:"A companion channel to Mother Goose Club features the same costumed cast in extended skits and story-driven songs (2012\u2013present). It builds on its parent channel's live-action nursery rhyme format with more narrative segments."},
{t:"Brainchild", net:"Streaming & Other", dec:"2010s", age:"5-7", cat:"Science & Nature", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A host and real kids explore science and social topics through hands-on experiments and relatable examples (2018). Its documentary-style format keeps each big idea grounded in everyday experience."},
{t:"Hip-Hop Harry", net:"Streaming & Other", dec:"2000s", age:"5-7", cat:"Music & Arts", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A costumed bear teaches cooperation and healthy habits through hip-hop dance and music (2006\u20132009, syndicated). Movement-based games and call-and-response songs anchor each episode's lesson."},
{t:"Mecha Builders", net:"Apple TV+", dec:"2020s", age:"5-7", cat:"Science & Nature", cat2:"Adventure", g:"boys", lang:"English", d:"Kid-piloted rescue robots use real-world engineering to solve neighborhood problems (2023–present, Apple TV+)."},
{t:"Zenko Rangers", net:"Netflix", dec:"2010s", age:"5-7", cat:"Superhero & Action", cat2:"Adventure", g:"boys", lang:"English", d:"Undercover kid heroes secretly help their neighbors while disguised as animal mascots (2015–2017)."},
{t:"Mystery Motor Club", net:"Streaming & Other", dec:"2010s", age:"5-7", cat:"Mystery", cat2:"Adventure", g:"boys", lang:"English", d:"Three young detectives with gadget-loaded go-karts solve small-town mysteries (2016–2018)."},
{t:"Purrfect Patrol", net:"Disney", dec:"2010s", age:"5-7", cat:"Superhero & Action", cat2:"Adventure", g:"boys", lang:"English", d:"A team of kitten heroes uses clever gadgets to protect their neighborhood (2014–2016)."},
{t:"InvestiGators", net:"Netflix", dec:"2020s", age:"5-7", cat:"Comedy", cat2:"Mystery", g:"boys", lang:"English", d:"Two alligator secret agents investigate wacky underground crimes with gadget-suits (2024, Netflix)."},
{t:"Rev & Roll", net:"Streaming & Other", dec:"2010s", age:"5-7", cat:"Adventure", cat2:"Comedy", g:"boys", lang:"English", d:"Two young race-car friends learn cooperation while competing in backyard races (2013–2016)."},
{t:"Mickey and the Roadster Racers", net:"Disney", dec:"2010s", age:"2-6", cat:"Adventure", cat2:"Comedy", g:"neutral", lang:"English", d:"Mickey and friends build gadget-filled cars for races and rescue missions around town (2017–2019). Each episode tends to end with the characters overcoming an obstacle through cooperation rather than force."},
{t:"Mickey Mouse Mixed-Up Adventures", net:"Disney", dec:"2010s", age:"2-6", cat:"Adventure", cat2:"Comedy", g:"neutral", lang:"English", d:"Mickey and the gang go on portal-hopping quests using a magical wardrobe (2019–2020). Each episode tends to end with the characters overcoming an obstacle through cooperation rather than force."},
{t:"Mickey Mouse Funhouse", net:"Disney", dec:"2020s", age:"2-6", cat:"Adventure", cat2:"Fantasy & Magic", g:"neutral", lang:"English", d:"A talking funhouse sends Mickey and friends into new worlds each episode (2021–2023). It leans on a colorful magical world to deliver lighthearted stories with just enough stakes to stay engaging."},
{t:"SuperKitties", net:"Disney", dec:"2020s", age:"3-7", cat:"Superhero & Action", cat2:"Adventure", g:"neutral", lang:"English", d:"A team of kitten superheroes uses gadgets and teamwork to help their city (2023–present). The show follows a fairly standard hero-versus-villain structure, with each episode built around a new threat to defeat."},

{t:"Wylde Pak", net:"Streaming & Other", dec:"2020s", age:"3-7", cat:"Adventure", cat2:"Comedy", g:"neutral", lang:"English", d:"A pack of animal friends explore the wilderness just beyond their backyard fence (2026–present, Nickelodeon/streaming). The show mixes exploration and mild peril with problem-solving, a common formula for kid-friendly adventure series."},
{t:"The Smurfs", net:"Streaming & Other", dec:"2020s", age:"4-8", cat:"Fantasy & Magic", cat2:"Comedy", g:"neutral", lang:"English", d:"The blue forest-dwelling Smurfs reboot brings the classic village back with new adventures and lessons (2021–present, streaming). It leans on a colorful magical world to deliver lighthearted stories with just enough stakes to stay engaging."},
{t:"Percy the Park Keeper", net:"Streaming & Other", dec:"2020s", age:"3-7", cat:"Science & Nature", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A kindly park keeper and his woodland animal friends look after their forest home through the seasons (2021–present, streaming). The show pairs an adventure-of-the-week format with facts about the natural world, aiming to spark curiosity about science."},
{t:"Ten Little... Who?", net:"Streaming & Other", dec:"2020s", age:"3-7", cat:"Mystery", cat2:"Comedy", g:"neutral", lang:"English", d:"A rhyming counting format hides a silly mystery character among ten possibilities each episode (2025–present, Sky Kids/streaming). Its mystery format gives each episode a clear beginning, investigation, and resolution."},
{t:"The Sneetches", net:"Streaming & Other", dec:"2020s", age:"4-8", cat:"Life Skills & Emotions", cat2:"Comedy", g:"neutral", lang:"English", d:"Dr. Seuss's story of star-bellied and plain-bellied creatures learning to look past surface differences (Netflix). Storylines usually center on realistic, low-stakes conflicts resolved through conversation rather than magic or gadgets."},
{t:"Thidwick the Big-Hearted Moose", net:"Streaming & Other", dec:"2020s", age:"4-8", cat:"Life Skills & Emotions", cat2:"Comedy", g:"neutral", lang:"English", d:"Dr. Seuss's overly generous moose learns to balance kindness with healthy boundaries (Netflix special/series). Storylines usually center on realistic, low-stakes conflicts resolved through conversation rather than magic or gadgets."},
{t:"Migi and Dako", net:"Streaming & Other", dec:"2020s", age:"6-9", cat:"Sci-Fi", cat2:"Comedy", g:"boys", lang:"English", d:"A boy accidentally bonds with two bickering alien symbiotes who reshape his daily life (2024, Peacock/DreamWorks). Its odd-couple banter and sci-fi gadgetry give the show a distinct comic energy."},
{t:"The Velveteen Rabbit", net:"Streaming & Other", dec:"2020s", age:"4-8", cat:"Fantasy & Magic", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A stuffed rabbit's wish to become real unfolds in a tender adaptation of the classic story (2023, Apple TV+). Its gentle, storybook pacing favors emotional warmth over spectacle."},
{t:"PlayKids", net:"YouTube", dec:"2010s", age:"2-6", cat:"Preschool Learning", cat2:"Music & Arts", g:"neutral", lang:"English", d:"A roster of animated toddler characters sing and play through everyday routines and simple lessons. The series was built around simple, standalone lessons aimed at very young viewers just starting to grasp basic concepts."},
{t:"Speakaboos", net:"Streaming & Other", dec:"2010s", age:"3-7", cat:"Preschool Learning", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Interactive storybook videos pair read-along narration with songs to build early reading skills. The series was built around simple, standalone lessons aimed at very young viewers just starting to grasp basic concepts."},
{t:"Elf Pets", net:"Streaming & Other", dec:"2020s", age:"3-7", cat:"Fantasy & Magic", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"Magical reindeer and other Elf on the Shelf companions help spread kindness during the holidays (Netflix specials/series). It leans on a colorful magical world to deliver lighthearted stories with just enough stakes to stay engaging."},
{t:"The Adventures of Napkin Man!", net:"Streaming & Other", dec:"2020s", age:"3-7", cat:"Life Skills & Emotions", cat2:"Comedy", g:"neutral", lang:"English", d:"A superhero made of napkins swoops in to help kids solve small everyday problems with kindness (2022–present, streaming). The series' understated humor and warmth helped it build a loyal following among parents as well as kids."},
{t:"The Notekins", net:"Streaming & Other", dec:"2010s", age:"2-6", cat:"Preschool Learning", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Musical note characters sing simple songs to introduce toddlers to early concepts and vocabulary (BabyFirst TV/streaming). The series was built around simple, standalone lessons aimed at very young viewers just starting to grasp basic concepts."},
{t:"Vocabularry", net:"Streaming & Other", dec:"2010s", age:"2-6", cat:"Preschool Learning", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Short animated segments build early vocabulary through repetition, songs, and playful visuals (BabyFirst TV/streaming). The series was built around simple, standalone lessons aimed at very young viewers just starting to grasp basic concepts."},
{t:"Camp Thunderbolt", net:"Nickelodeon", dec:"2010s", age:"5-7", cat:"Sports", cat2:"Comedy", g:"boys", lang:"English", d:"Rival cabins compete in wild summer-camp games and challenges (2014–2016)."},
{t:"Batman: The Brave and the Bold", net:"Cartoon Network", dec:"2000s", age:"6-9", cat:"Superhero & Action", cat2:"Comedy", g:"boys", lang:"English", d:"Batman teams up with a rotating cast of DC heroes for lighthearted, action-packed adventures (2008–2011). Its team-up format let a new hero and villain headline nearly every episode."},
{t:"Wolverine and the X-Men", net:"Cartoon Network", dec:"2000s", age:"6-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"The X-Men reunite to rescue Professor X and stop an anti-mutant plot (2008–2009). Its darker, more serialized tone set it apart from earlier X-Men cartoons."},
{t:"Avengers: Earth's Mightiest Heroes", net:"Disney", dec:"2010s", age:"6-9", cat:"Superhero & Action", cat2:"Adventure", g:"boys", lang:"English", d:"Marvel's Avengers assemble to battle threats too big for any hero alone (2010–2012). The series drew directly from decades of comics continuity to build its rotating villain roster."},
{t:"The Incredible Hulk", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"Bruce Banner struggles to control his rage-fueled alter ego while evading those who hunt him (1996–1997). It leaned into the Hulk's comic-book mythology more closely than the earlier live-action series."},
{t:"X-Men '97", net:"Streaming & Other", dec:"2020s", age:"6-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"A revival continuing the story of the beloved 1990s X-Men cartoon with higher stakes (2024–present). Its animation style deliberately echoes the original series to reward longtime fans."},
{t:"Green Lantern: The Animated Series", net:"Cartoon Network", dec:"2010s", age:"6-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"Hal Jordan patrols deep space with his Green Lantern Corps allies against a hive-mind threat (2011–2013). Its CGI art style was a notable departure from typical superhero cartoons of the time."},
{t:"The Batman", net:"Cartoon Network", dec:"2000s", age:"6-9", cat:"Superhero & Action", cat2:"Mystery", g:"boys", lang:"English", d:"A younger Batman faces classic Gotham villains early in his crime-fighting career (2004–2008). The redesigned rogues gallery gave the Dark Knight's familiar foes a fresh visual identity."},
{t:"Iron Man", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"Tony Stark suits up to battle saboteurs and supervillains threatening his company and the world (1994–1996). It was one of the first American cartoons to give Iron Man his own dedicated series."},
{t:"Power Rangers Wild Force", net:"Streaming & Other", dec:"2000s", age:"5-9", cat:"Superhero & Action", cat2:"Adventure", g:"boys", lang:"English", d:"Five teens bond with animal spirits to become Power Rangers defending the planet's wildlife (2002). Its conservation-themed storyline tied each Ranger to a different endangered species."},
{t:"Power Rangers Ninja Storm", net:"Streaming & Other", dec:"2000s", age:"5-9", cat:"Superhero & Action", cat2:"Fantasy & Magic", g:"boys", lang:"English", d:"Ninja academy students become Power Rangers after their school is attacked by an evil sorcerer (2003). It was the first Power Rangers season built around a wind, thunder, and samurai ninja theme."},
{t:"Power Rangers Samurai", net:"Streaming & Other", dec:"2010s", age:"5-9", cat:"Superhero & Action", cat2:"Fantasy & Magic", g:"boys", lang:"English", d:"Descendants of ancient samurai wield elemental symbols to battle a rising army of Nighlok (2011). Its sword-and-symbol combat gave the franchise a more mystical, martial-arts feel."},
{t:"Power Rangers Megaforce", net:"Streaming & Other", dec:"2010s", age:"5-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"A new team of Rangers defends Earth from an alien invasion using Legendary Ranger powers (2013). It marked the franchise's 20th-anniversary season, referencing many earlier Ranger teams."},
{t:"Power Rangers Dino Fury", net:"Streaming & Other", dec:"2020s", age:"5-9", cat:"Superhero & Action", cat2:"Adventure", g:"boys", lang:"English", d:"Rangers race to recover ancient Dino Fury keys before a ruthless alien warlord can claim them (2021). Its globe-spanning treasure hunt structure set it apart from earlier dinosaur-themed seasons."},
{t:"Power Rangers Beast Morphers", net:"Streaming & Other", dec:"2010s", age:"5-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"Rangers use Morph-X technology and animal-based Beast powers to stop a virus-based villain (2019). It leaned further into technology and gaming culture than prior Power Rangers seasons."},
{t:"Power Rangers Lightspeed Rescue", net:"Streaming & Other", dec:"2000s", age:"5-9", cat:"Superhero & Action", cat2:"Adventure", g:"boys", lang:"English", d:"A rescue-operations team becomes Power Rangers to save civilians from a demon uprising (2000). Its first-responder theme gave the Rangers' mission a rescue focus instead of straight combat."},
{t:"Power Rangers Time Force", net:"Streaming & Other", dec:"2000s", age:"5-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"Future police officers chase an escaped criminal back through time to present-day Earth (2001). Its time-travel premise let the show mix futuristic gadgets with more grounded present-day settings."},
{t:"Yu-Gi-Oh! Zexal", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Fantasy & Magic", cat2:"Superhero & Action", g:"boys", lang:"English", d:"A young duelist merges with a mysterious spirit to master a new dueling dimension (2011–2012). It introduced the Xyz summoning mechanic that reshaped the trading card game's strategy."},
{t:"Yu-Gi-Oh! Arc-V", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Fantasy & Magic", cat2:"Adventure", g:"boys", lang:"English", d:"A duelist discovers Pendulum summoning, a card mechanic that could unite four dueling dimensions (2014–2017). Its multi-dimensional structure let the show blend several prior Yu-Gi-Oh! visual styles."},
{t:"Bakugan: Geogan Rising", net:"Streaming & Other", dec:"2020s", age:"6-9", cat:"Fantasy & Magic", cat2:"Superhero & Action", g:"boys", lang:"English", d:"Young Brawlers battle rogue Geogan creatures threatening to overrun their world (2022). It continued the franchise's toy-driven format of creature battles tied to physical collectible figures."},
{t:"Beyblade Burst Turbo", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Sports", cat2:"Superhero & Action", g:"boys", lang:"English", d:"Bladers push their Beyblades to new limits with Turbo System upgrades in high-stakes tournaments (2018). Its faster-spinning gimmick tied directly into a real, still-selling toy line."},
{t:"Beyblade Burst Rise", net:"Streaming & Other", dec:"2020s", age:"6-9", cat:"Sports", cat2:"Superhero & Action", g:"boys", lang:"English", d:"A new generation of Bladers competes using Dynamite Battle System tops with dual spin modes (2020). Each tournament arc mirrors the release of a new wave of real collectible Beyblades."},
{t:"Digimon Frontier", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Fantasy & Magic", cat2:"Adventure", g:"boys", lang:"English", d:"Kids transform directly into Digimon warriors to save the digital world from an ancient evil (2002–2003). It was the first entry in the franchise where humans could spirit-evolve into Digimon themselves."},
{t:"Digimon Data Squad", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Fantasy & Magic", cat2:"Adventure", g:"boys", lang:"English", d:"Young agents of a special task force partner with Digimon to stop dangerous data breaches (2006–2007). Its agency setting gave the series a more procedural, mission-based structure."},
{t:"Dinosaur King", net:"Streaming & Other", dec:"2000s", age:"5-8", cat:"Adventure", cat2:"Fantasy & Magic", g:"boys", lang:"English", d:"Kids with special cards summon dinosaurs to stop a rival group from harnessing prehistoric power (2007–2008). The card-battle format was designed to tie in directly with an arcade card game."},
{t:"T-Rex Ranch", net:"YouTube", dec:"2020s", age:"4-7", cat:"Adventure", cat2:"Science & Nature", g:"boys", lang:"English", d:"A family runs a ranch full of life-sized dinosaur costumes and roleplay adventures for young viewers. Its costumed-dinosaur format became one of YouTube's most-watched kids' channels."},
{t:"Dino Squad", net:"Streaming & Other", dec:"2000s", age:"5-8", cat:"Adventure", cat2:"Science & Nature", g:"boys", lang:"English", d:"Five teens who can transform into dinosaurs use their powers to fight environmental threats (2007–2008). Its eco-conscious plots paired dinosaur action with lessons about protecting the planet."},
{t:"Mighty Express", net:"Streaming & Other", dec:"2020s", age:"3-6", cat:"Adventure", cat2:"Comedy", g:"boys", lang:"English", d:"A crew of talking trains solves problems and delivers cargo across a busy rail network (2020–2022). Its ensemble of distinct train personalities was designed to appeal to young vehicle enthusiasts."},
{t:"Action Man", net:"Streaming & Other", dec:"2000s", age:"5-8", cat:"Superhero & Action", cat2:"Adventure", g:"boys", lang:"English", d:"A former Olympic gymnast turned secret agent uses gadgets and athletic skill to stop global threats. Based on the classic action-figure line, it emphasized stunts and spy-style missions."},
{t:"Hot Wheels City", net:"Streaming & Other", dec:"2020s", age:"4-7", cat:"Adventure", cat2:"Superhero & Action", g:"boys", lang:"English", d:"Customized Hot Wheels cars race and problem-solve their way through the busy streets of a toy city (2019–present). Each episode ties directly into real Hot Wheels vehicles and playsets."},
{t:"Meet the Trucks", net:"YouTube", dec:"2020s", age:"3-6", cat:"Preschool Learning", cat2:"Adventure", g:"boys", lang:"English", d:"Friendly animated trucks introduce young viewers to construction vehicles, jobs, and teamwork. Its simple truck-of-the-day format is built for very early vehicle fans."},
{t:"Big Truck Little Truck", net:"Streaming & Other", dec:"2020s", age:"2-5", cat:"Preschool Learning", cat2:"Adventure", g:"boys", lang:"English", d:"A dad and his young son explore different kinds of trucks and the jobs they do (2020–present). Its real-vehicle segments are aimed squarely at toddlers and preschoolers fascinated by big machines."},
{t:"Voltron Force", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"A new generation of pilots trains to earn the right to form the legendary robot Voltron (2011–2012). It served as a bridge between the classic 1980s Voltron and later franchise reboots."},
{t:"Rescue Bots Academy", net:"Streaming & Other", dec:"2010s", age:"4-7", cat:"Adventure", cat2:"Superhero & Action", g:"boys", lang:"English", d:"Young Rescue Bots train at a special academy to become community helpers and first responders (2019–2021). Its classroom setting reframed the Transformers franchise for a preschool audience."},
{t:"Adventures of Sonic the Hedgehog", net:"Streaming & Other", dec:"1990s", age:"5-8", cat:"Comedy", cat2:"Adventure", g:"boys", lang:"English", d:"Sonic races through wisecracking, slapstick adventures to foil the evil Dr. Robotnik (1993–1994). Its comedic tone contrasted sharply with the more serious Sonic cartoon airing the same season."},
{t:"Sonic the Hedgehog", net:"Streaming & Other", dec:"1990s", age:"5-8", cat:"Adventure", cat2:"Sci-Fi", g:"boys", lang:"English", d:"Sonic leads a resistance against the tyrannical Dr. Robotnik in a more serialized, action-driven story (1993–1994). Fans nicknamed it 'SatAM' for its Saturday-morning timeslot, distinguishing it from its comedic sister series."},
{t:"Mega Man", net:"Streaming & Other", dec:"1990s", age:"5-8", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"A robot hero battles his creator's evil counterpart and an army of Robot Masters (1994–1995). It adapted the popular video game franchise's core rivalry into a Saturday-morning format."},
{t:"Mega Man: Fully Charged", net:"Streaming & Other", dec:"2010s", age:"5-8", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"A robot boy discovers he can transform into a powerful hero to defend his city (2018). Its reboot gave the classic video game hero an updated origin story for a new generation."},
{t:"Max Steel", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"A teen bonded with an alien organism gains superhuman abilities to fight extraterrestrial threats (2000–2002). It was built around a companion action-figure line with turbo-powered accessories."},
{t:"Zevo-3", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"Three teens gain superpowers after a lab accident and must learn to control their new abilities (2010–2011). Its origin-story structure echoed classic superhero team comics."},
{t:"Kong: The Animated Series", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Adventure", cat2:"Fantasy & Magic", g:"boys", lang:"English", d:"A cloned Kong bonds with a young boy to protect a hidden island from prehistoric threats (2000–2001). It reimagined the classic giant-ape story as an ongoing adventure series."},
{t:"DreamWorks Dragons: Race to the Edge", net:"Netflix", dec:"2010s", age:"6-9", cat:"Adventure", cat2:"Fantasy & Magic", g:"boys", lang:"English", d:"Hiccup and his fellow dragon riders establish a secret base to study new dragon species (2015–2018). It expanded the world of How to Train Your Dragon between the franchise's feature films."},
{t:"Xiaolin Chronicles", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Fantasy & Magic", cat2:"Adventure", g:"boys", lang:"English", d:"Young monks train to master Shen Gong Wu artifacts and stop an ancient evil from returning (2013–2015). It continued the martial-arts adventure formula of the original Xiaolin Showdown."},
{t:"Inspector Gadget", net:"Streaming & Other", dec:"2010s", age:"5-8", cat:"Comedy", cat2:"Mystery", g:"boys", lang:"English", d:"A bumbling cyborg detective relies on his niece's real detective work to solve every case (2015–2018). This CGI reboot updated the gadget-filled slapstick of the original 1980s series."},
{t:"Get Blake!", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Comedy", cat2:"Mystery", g:"boys", lang:"English", d:"A boy secretly investigates and solves the everyday problems of the people around him (2016–2019). Its case-of-the-week format mixed comedy with light detective work."},
{t:"LBX: Little Battlers eXperience", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"Kids pilot palm-sized robot fighters called LBX in tournament battles and rescue missions (2012–2014). It was built around a companion toy line of buildable miniature robots."},
{t:"Pokémon: Sun & Moon", net:"Streaming & Other", dec:"2010s", age:"5-9", cat:"Adventure", cat2:"Fantasy & Magic", g:"boys", lang:"English", d:"A young trainer explores the tropical Alola region while attending a Pokémon school (2016–2019). Its island setting gave the long-running franchise a more laid-back, classroom-centered format."},
{t:"Pokémon Journeys: The Series", net:"Streaming & Other", dec:"2020s", age:"5-9", cat:"Adventure", cat2:"Fantasy & Magic", g:"boys", lang:"English", d:"A new trainer travels across every region, meeting familiar faces from the franchise's history (2019–2023). It served as an anniversary journey revisiting the series' most iconic locations."},
{t:"Bakugan: Armored Alliance", net:"Streaming & Other", dec:"2020s", age:"6-9", cat:"Fantasy & Magic", cat2:"Superhero & Action", g:"boys", lang:"English", d:"Brawlers unite to master new Ultra abilities against a shadowy new threat (2020). It continued the franchise's toy-tie-in format with an expanded roster of collectible creatures."},
{t:"Cars on the Road", net:"Disney", dec:"2020s", age:"4-7", cat:"Adventure", cat2:"Comedy", g:"boys", lang:"English", d:"Lightning McQueen and Mater take a cross-country road trip filled with strange detours (2022). It gave the Cars franchise's beloved characters an episodic anthology format for the first time."},
{t:"Beyblade Burst Surge", net:"Streaming & Other", dec:"2020s", age:"6-9", cat:"Sports", cat2:"Superhero & Action", g:"boys", lang:"English", d:"Bladers face off using Beyblades with reversible spin directions and new special moves (2020). Its dual-spin gimmick reflected a real update to the physical toy line's mechanics."},
{t:"LEGO Jurassic World: Legend of Isla Nublar", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Adventure", cat2:"Comedy", g:"boys", lang:"English", d:"Kids stranded on Isla Nublar navigate dinosaur encounters with LEGO-style humor (2019). It reframed the Jurassic Park franchise's dinosaurs for a younger, comedic LEGO audience."},
{t:"Wild C.A.T.s", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"An alien task force disguised as ordinary humans secretly defends Earth from hostile invaders (1994–1995). It adapted a popular Image Comics superhero team for Saturday mornings."},
{t:"Beyblade Metal Masters", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Sports", cat2:"Superhero & Action", g:"boys", lang:"English", d:"Bladers travel the globe competing in an international tournament with upgraded Metal Fusion tops (2010–2011). Its world-tournament structure introduced new rival Bladers from different countries."},
{t:"Beyblade Metal Fury", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Sports", cat2:"Superhero & Action", g:"boys", lang:"English", d:"Bladers face their toughest tournament yet as an ancient evil threatens to be unleashed (2011–2012). It closed out the Metal Saga trilogy with the series' highest-stakes battles."},
{t:"Digimon Tamers", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Fantasy & Magic", cat2:"Adventure", g:"boys", lang:"English", d:"Kids in the real world befriend Digimon that emerge through a card-scanning device (2001–2002). Its grittier, more grounded tone set it apart from earlier entries in the franchise."},
{t:"Digimon Adventure:", net:"Streaming & Other", dec:"2020s", age:"6-9", cat:"Fantasy & Magic", cat2:"Adventure", g:"boys", lang:"English", d:"A new generation of kids is pulled into the Digital World to bond with partner Digimon (2020–2021). This reboot retold the original 1999 story with updated animation and pacing."},
{t:"Yu-Gi-Oh! Duel Monsters", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Fantasy & Magic", cat2:"Adventure", g:"boys", lang:"English", d:"A boy who solved an ancient puzzle gains the spirit of a pharaoh and a talent for card duels (1998–2004). It introduced the trading card battles that defined the entire Yu-Gi-Oh! franchise."},
{t:"Yu-Gi-Oh! VRAINS", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Fantasy & Magic", cat2:"Sci-Fi", g:"boys", lang:"English", d:"A young hacker dives into a virtual reality network to duel and uncover a criminal conspiracy (2017–2019). It reimagined the card-dueling formula inside a cyberpunk-styled digital world."},
{t:"Dinotrux Supercharged", net:"Netflix", dec:"2010s", age:"4-7", cat:"Adventure", cat2:"Science & Nature", g:"boys", lang:"English", d:"Half-dinosaur, half-truck creatures take on bigger jobs and new rivals in their prehistoric world (2019). This continuation gave the original Dinotrux cast upgraded builds and abilities."},
{t:"Monster Math Squad", net:"Streaming & Other", dec:"2010s", age:"3-6", cat:"Preschool Learning", cat2:"Superhero & Action", g:"boys", lang:"English", d:"Kid-friendly monster heroes solve everyday problems in their neighborhood using basic math skills. Its superhero framing was designed to make early numeracy feel like an action-packed mission."},
{t:"VeggieTales", net:"Streaming & Other", dec:"1990s", age:"4-8", cat:"Comedy", cat2:"Life Skills & Emotions", g:"boys", lang:"English", d:"Animated vegetables act out stories with moral and faith-based lessons for young viewers (1993–present). It became one of the best-selling children's video series of its era."},
{t:"Zig & Sharko", net:"Streaming & Other", dec:"2010s", age:"4-8", cat:"Comedy", cat2:"Adventure", g:"boys", lang:"English", d:"A hapless hyena's endless schemes to eat a mermaid are foiled by her shark bodyguard (2010–present). Its wordless, slapstick format relies entirely on physical comedy and sound effects."},
{t:"Boonie Bears", net:"Streaming & Other", dec:"2010s", age:"5-9", cat:"Comedy", cat2:"Adventure", g:"boys", lang:"English", d:"Two forest-dwelling bears repeatedly foil a logger's attempts to cut down their home (2012–present). It became one of China's most successful children's animated exports."},
{t:"G.I. Joe: Sigma 6", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"An elite Joe team uses stealth tactics and high-tech gear to stop the terrorist organization Cobra (2005–2006). Its faster-paced, more secretive tone updated the classic G.I. Joe formula."},
{t:"G.I. Joe Extreme", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Superhero & Action", cat2:"Adventure", g:"boys", lang:"English", d:"A new generation of Joes battles a rebranded enemy organization with extreme sports-style gear (1995–1997). It leaned into 1990s action-figure trends with flashier vehicles and weapons."},
{t:"Action Force", net:"Streaming & Other", dec:"1980s", age:"5-8", cat:"Superhero & Action", cat2:"Adventure", g:"boys", lang:"English", d:"An international task force of soldiers and specialists counters a shadowy terrorist organization. It was the UK's rebranded version of a popular American military-themed toy and cartoon line."},
{t:"He-Man and the Masters of the Universe", net:"Streaming & Other", dec:"1980s", age:"5-8", cat:"Fantasy & Magic", cat2:"Superhero & Action", g:"boys", lang:"English", d:"Prince Adam transforms into the mighty He-Man to defend the magical realm of Eternia (1983–1985). It became one of the most successful toy-driven cartoons of the decade."},
{t:"ThunderCats", net:"Streaming & Other", dec:"1980s", age:"5-8", cat:"Fantasy & Magic", cat2:"Superhero & Action", g:"boys", lang:"English", d:"Feline humanoid warriors crash-land on a new planet and must defend it from an ancient enemy (1985–1989). Its blend of sci-fi and sword-and-sorcery made it a defining action cartoon of its era."},
{t:"Silverhawks", net:"Streaming & Other", dec:"1980s", age:"5-8", cat:"Sci-Fi", cat2:"Superhero & Action", g:"boys", lang:"English", d:"Part-human, part-metal officers patrol space to stop a gang of mutant criminals (1986–1987). It reused much of the animation team behind ThunderCats for a space-western setting."},
{t:"Centurions", net:"Streaming & Other", dec:"1980s", age:"6-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"Soldiers equipped with modular exo-frame armor battle a cyborg conqueror bent on galactic domination (1986). Its interchangeable armor pieces were designed to mirror a companion toy line."},
{t:"Visionaries: Knights of the Magical Light", net:"Streaming & Other", dec:"1980s", age:"6-9", cat:"Fantasy & Magic", cat2:"Superhero & Action", g:"boys", lang:"English", d:"Knights whose technology has failed must learn to wield magic to save their kingdom (1987). It paired action figures with special holographic trading cards, an unusual toy tie-in for its time."},
{t:"Bionic Six", net:"Streaming & Other", dec:"1980s", age:"6-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"A family gains bionic superpowers and works together to stop a rogue scientist's schemes (1987). Its family-team structure was uncommon among action cartoons of the decade."},
{t:"M.A.S.K.", net:"Streaming & Other", dec:"1980s", age:"5-8", cat:"Superhero & Action", cat2:"Adventure", g:"boys", lang:"English", d:"Secret agents pilot vehicles that transform into disguised machines to stop a criminal organization (1985–1986). Its vehicle-transformation gimmick was built to sell an accompanying toy line."},
{t:"Robotech", net:"Streaming & Other", dec:"1980s", age:"6-9", cat:"Sci-Fi", cat2:"Superhero & Action", g:"boys", lang:"English", d:"Human pilots defend Earth using transforming fighter jets during a generations-spanning alien war (1985). It combined three unrelated Japanese anime series into one continuous American saga."},
{t:"Voltron: Defender of the Universe", net:"Streaming & Other", dec:"1980s", age:"5-8", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"Five pilots combine their robot lions to form the giant defender Voltron against space tyranny (1984–1985). It introduced the combining-robot format that later Voltron series would continue to use."},
{t:"Transformers: Armada", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"Autobots and Decepticons race kids to recover powerful Mini-Con robots scattered across Earth (2002–2003). It relaunched the Transformers franchise for a new generation of viewers and toys."},
{t:"Transformers: Energon", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"Autobots battle Decepticons for control of a powerful new energy source called Energon (2004). It continued the Unicron Trilogy's ongoing story following Transformers: Armada."},
{t:"Dinosaucers", net:"Streaming & Other", dec:"1980s", age:"5-8", cat:"Adventure", cat2:"Science & Nature", g:"boys", lang:"English", d:"Dinosaur-like aliens crash-land on Earth and team up with kids to stop invading reptilian foes (1987). Its dinosaur cast doubled as an early edutainment hook about prehistoric creatures."},
{t:"Denver, the Last Dinosaur", net:"Streaming & Other", dec:"1980s", age:"4-8", cat:"Adventure", cat2:"Comedy", g:"boys", lang:"English", d:"A group of kids discovers a friendly dinosaur egg that hatches into a skateboarding companion (1988–1989). Its laid-back, surfer-style dinosaur became an unlikely mascot of the era."},
{t:"Dino-Riders", net:"Streaming & Other", dec:"1980s", age:"5-8", cat:"Adventure", cat2:"Superhero & Action", g:"boys", lang:"English", d:"Time-traveling heroes ride armored dinosaurs into battle against alien invaders in prehistoric times (1988). Its dinosaur-and-armor combo was designed around an ambitious action-figure line."},
{t:"Dragon Booster", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Adventure", cat2:"Sports", g:"boys", lang:"English", d:"A boy bonds with a legendary dragon and competes in high-speed dragon-racing tournaments (2004–2006). Its racing format combined fantasy creatures with extreme-sports-style competition."},
{t:"Bionicle: Masks of Power", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Fantasy & Magic", cat2:"Superhero & Action", g:"boys", lang:"English", d:"Elemental heroes wielding mystical masks defend their island from ancient shape-shifting villains (2016). It relaunched the long-running Bionicle toy franchise's mythology for a new generation."},
{t:"Chaotic", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Fantasy & Magic", cat2:"Superhero & Action", g:"boys", lang:"English", d:"A trading-card game lets kids enter a real fantasy dimension where their cards come to life (2006–2010). Its card-to-game crossover mechanic let real-world card codes unlock content in-story."},
{t:"Cubix: Robots for Everyone", net:"Streaming & Other", dec:"2000s", age:"5-8", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"In a city where robots are commonplace, a boy's discarded robot friend becomes a secret hero (2001–2003). Its everyday-robot setting mixed comedy with light action-adventure."},
{t:"Mobile Suit Gundam Wing", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Sci-Fi", cat2:"Superhero & Action", g:"boys", lang:"English", d:"Five young pilots wage a war for colonial independence using towering mobile-suit robots (1995–1996). It introduced many Western viewers to the long-running Gundam mecha franchise."},
{t:"Gundam SEED", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Sci-Fi", cat2:"Superhero & Action", g:"boys", lang:"English", d:"Rival factions clash in a war fought with giant mobile-suit robots amid a genetically divided humanity (2002–2003). It relaunched the Gundam franchise's mecha battles for a new generation of fans."},
{t:"Beyblade: Metal Fusion", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Sports", cat2:"Superhero & Action", g:"boys", lang:"English", d:"A new generation of Bladers competes with upgraded Metal-series tops in neighborhood tournaments (2009–2010). It relaunched the original Beyblade franchise with redesigned toys and battle mechanics."},
{t:"Zoids: Chaotic Century", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Sci-Fi", cat2:"Adventure", g:"boys", lang:"English", d:"A boy pilots a giant mechanical beast across a war-torn continent in search of his father (1999–2000). It adapted a long-running model-kit toy line into a serialized adventure story."},
{t:"Zoids: New Century", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Sci-Fi", cat2:"Sports", g:"boys", lang:"English", d:"Teen pilots compete in high-stakes Zoid battles that double as a televised sport (2001). Its tournament format gave the mecha-battle formula a more lighthearted, competitive spin."},
{t:"Dragon Ball GT", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Adventure", cat2:"Superhero & Action", g:"boys", lang:"English", d:"An aged-down Goku sets off across the galaxy to gather the Black Star Dragon Balls (1996–1997). It continued the Dragon Ball saga with an original story not adapted from the source manga."},
{t:"Monster Allergy", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Fantasy & Magic", cat2:"Adventure", g:"boys", lang:"English", d:"A boy with monster-triggered allergies discovers he can see and tame invisible creatures around him (2006–2008). Its premise turned an everyday ailment into a gateway to a hidden monster world."},
{t:"Redwall", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Adventure", cat2:"Fantasy & Magic", g:"boys", lang:"English", d:"Woodland mice and their animal allies defend their abbey home from invading rats and vermin (1999–2002). It adapted a beloved fantasy book series into an animated sword-and-shield adventure."},
{t:"Jimmy Two-Shoes", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Comedy", cat2:"Fantasy & Magic", g:"boys", lang:"English", d:"An upbeat boy's relentless optimism clashes with the gloomy demon prince ruling his new town (2009–2011). Its bright, chaotic humor contrasted deliberately with its dreary demonic setting."},
{t:"Grossology", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Science & Nature", cat2:"Comedy", g:"boys", lang:"English", d:"Kid agents use real science to investigate gross, slime-covered mysteries around their town (2006–2008). It turned genuinely educational science concepts into stomach-churning comedic mysteries."},
{t:"Bakugan Battle Brawlers: New Vestroia", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Fantasy & Magic", cat2:"Superhero & Action", g:"boys", lang:"English", d:"Brawlers travel to the creatures' home dimension to stop a corrupted ruler from conquering it (2009–2010). It expanded the original Bakugan story into the creatures' own home world."},
{t:"Bakugan: Mechtanium Surge", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Fantasy & Magic", cat2:"Superhero & Action", g:"boys", lang:"English", d:"Brawlers face towering mechanical Bakugan in the franchise's biggest battles yet (2011–2012). It closed out the original Bakugan saga with its largest-scale creature designs."},
{t:"Bionicle: The Journey to One", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Fantasy & Magic", cat2:"Superhero & Action", g:"boys", lang:"English", d:"Elemental heroes race to reclaim their masks of power before an ancient darkness consumes their island (2016). It concluded the modern Bionicle reboot's two-part mini-series."},
{t:"Transformers: Victory", net:"Streaming & Other", dec:"1980s", age:"6-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"Autobots and a young human ally defend Earth and space colonies from a returning Decepticon threat. This Japan-produced entry expanded the Transformers mythology with new combining robots."},
{t:"Power Rangers Jungle Fury", net:"Streaming & Other", dec:"2000s", age:"5-9", cat:"Superhero & Action", cat2:"Adventure", g:"boys", lang:"English", d:"Martial artists channel the spirits of jungle animals to stop an ancient evil spirit's return (2008). Its kung-fu academy setting emphasized martial arts training alongside Ranger battles."},
{t:"Power Rangers Operation Overdrive", net:"Streaming & Other", dec:"2000s", age:"5-9", cat:"Superhero & Action", cat2:"Adventure", g:"boys", lang:"English", d:"A team of treasure hunters becomes Power Rangers racing to recover jewels before a villain can (2007). Its globe-trotting treasure hunt gave the season an Indiana Jones-style adventure feel."},
{t:"Farmees - Nursery Rhymes & Kids Songs", net:"YouTube", dec:"2010s", age:"2-5", cat:"Preschool Learning", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Animated nursery rhymes and simple counting or alphabet songs designed for toddlers and preschoolers. Its bright, repetitive visuals are built for very early language and music exposure."},
{t:"BillionSurpriseToys", net:"YouTube", dec:"2010s", age:"2-5", cat:"Preschool Learning", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Nursery rhymes and toddler songs paired with colorful toy-themed animation. The channel grew out of a larger toy-review network before shifting toward original musical content."},
{t:"Kids Tv - Nursery Rhymes And Baby Songs", net:"YouTube", dec:"2010s", age:"2-5", cat:"Preschool Learning", cat2:"Music & Arts", g:"neutral", lang:"English", d:"A long-running channel of animated nursery rhymes, baby songs, and simple learning videos for toddlers. Its large back catalog spans hundreds of classic and original children's songs."},
{t:"El Reino Infantil", net:"YouTube", dec:"2010s", age:"2-6", cat:"Preschool Learning", cat2:"Music & Arts", g:"neutral", lang:"Spanish", d:"One of the most-watched Spanish-language children's channels, featuring nursery rhymes, songs, and short animated stories. It helped popularize Spanish-language kids' content globally on YouTube."},
{t:"Bini Bambini Nursery Rhymes", net:"YouTube", dec:"2010s", age:"2-5", cat:"Preschool Learning", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Animated sing-along nursery rhymes and toddler songs featuring a cast of recurring cartoon characters. Episodes are built around simple repetition to support early vocabulary."},
{t:"The Gearheads", net:"Cartoon Network", dec:"2010s", age:"5-7", cat:"Science & Nature", cat2:"Comedy", g:"boys", lang:"English", d:"Inventive kid mechanics build wacky machines to solve neighborhood problems (2015–2017)."},
{t:"Kaji Family", net:"YouTube", dec:"2010s", age:"4-8", cat:"Comedy", cat2:"Adventure", g:"neutral", lang:"English", d:"A family vlog spinoff of Ryan's World, following Ryan and his family's everyday adventures, trips, and challenges. It gives fans of the toy-review channel a more personal, behind-the-scenes look at the family."},
{t:"Iron Claw Rescue Squad", net:"Streaming & Other", dec:"2010s", age:"5-7", cat:"Superhero & Action", cat2:"Adventure", g:"boys", lang:"English", d:"A robotic rescue team races to save citizens from citywide emergencies (2018–2020)."},
{t:"Baja Blast Racers", net:"Streaming & Other", dec:"2010s", age:"5-7", cat:"Sports", cat2:"Adventure", g:"boys", lang:"English", d:"Off-road buggy racers tear through desert courses chasing the championship trophy (2016–2018)."},
{t:"Squirrel Stampede", net:"YouTube", dec:"2010s", age:"4-8", cat:"Comedy", cat2:"Adventure", g:"neutral", lang:"English", d:"A family-run channel focused on toy unboxings, reviews, and pop-culture collectibles. It covers a wide range of action figures, dolls, and playsets across different franchises."},
{t:"Junior Explorers Club", net:"PBS Kids", dec:"2000s", age:"5-7", cat:"Science & Nature", cat2:"Adventure", g:"boys", lang:"English", d:"Kid explorers investigate real-world habitats on expeditions with expert guides (2005–2008)."},
{t:"SciShow Space", net:"YouTube", dec:"2010s", age:"8-12", cat:"Science & Nature", cat2:"Adventure", g:"neutral", lang:"English", d:"A spinoff of the SciShow family covering space news, astronomy discoveries, and questions about the universe. Its fast-paced explainer style matches the tone of its parent channel."},
{t:"Aphmau", net:"YouTube", dec:"2010s", age:"7-11", cat:"Fantasy & Magic", cat2:"Adventure", g:"neutral", lang:"English", d:"Minecraft roleplay series with ongoing storylines, original characters, and light romance woven into fantasy adventures. Its narrative-driven format plays more like an animated show staged inside the game."},
{t:"PrestonPlayz", net:"YouTube", dec:"2010s", age:"6-10", cat:"Superhero & Action", cat2:"Adventure", g:"boys", lang:"English", d:"Minecraft and multiplayer gaming content featuring parkour challenges, build battles, and family-friendly commentary. Its upbeat tone and challenge-based videos are aimed at kids who already know the basics of the game."},
{t:"Stampylonghead", net:"YouTube", dec:"2010s", age:"4-8", cat:"Comedy", cat2:"Adventure", g:"boys", lang:"English", d:"Family-friendly Minecraft Let's Plays hosted by an animated cartoon cat character. It's often recommended as one of the gentlest, most soothing gaming channels for younger viewers."},
{t:"DanTDM", net:"YouTube", dec:"2010s", age:"6-10", cat:"Superhero & Action", cat2:"Adventure", g:"boys", lang:"English", d:"Family-friendly gaming videos covering Minecraft, Roblox, and Pokémon alongside original animated content. It's one of the longest-running and most recognizable kids' gaming channels."},
{t:"Jelly", net:"YouTube", dec:"2010s", age:"6-10", cat:"Superhero & Action", cat2:"Adventure", g:"boys", lang:"English", d:"Minecraft and multiplayer gaming videos featuring challenges, mods, and comedic commentary. Its lighthearted tone has made it a staple among younger gaming fans."},
{t:"Unspeakable", net:"YouTube", dec:"2010s", age:"6-10", cat:"Superhero & Action", cat2:"Adventure", g:"boys", lang:"English", d:"High-energy Minecraft and real-life challenge videos, from giant obstacle courses to prank-style stunts. Its fast-paced, loud style is aimed squarely at elementary-age gaming fans."},
{t:"MooseCraft", net:"YouTube", dec:"2010s", age:"6-10", cat:"Superhero & Action", cat2:"Adventure", g:"boys", lang:"English", d:"Minecraft Let's Plays and mod showcases delivered with upbeat, family-friendly commentary. It's part of the same wave of early Minecraft creators that includes Stampy and Squid."},
{t:"PopularMMOs", net:"YouTube", dec:"2010s", age:"6-10", cat:"Superhero & Action", cat2:"Adventure", g:"boys", lang:"English", d:"Minecraft adventure maps, mods, and challenge videos hosted by a friendly, enthusiastic narrator. It became one of the most-watched Minecraft channels of its era."},
{t:"iBallisticSquid", net:"YouTube", dec:"2010s", age:"4-8", cat:"Comedy", cat2:"Adventure", g:"boys", lang:"English", d:"Family-friendly Minecraft videos featuring a squid-themed cartoon character, often paired with Stampylonghead. Its gentle humor and bright worlds are aimed at younger viewers."},
{t:"The Wonder Wrench Gang", net:"Nickelodeon", dec:"2000s", age:"5-7", cat:"Science & Nature", cat2:"Comedy", g:"boys", lang:"English", d:"A crew of animal mechanics keeps their town's vehicles running with clever fixes (2004–2006)."},
{t:"SSundee", net:"YouTube", dec:"2010s", age:"6-10", cat:"Superhero & Action", cat2:"Adventure", g:"boys", lang:"English", d:"Minecraft and multiplayer gaming videos featuring mods, challenges, and comedic commentary. It's one of the platform's longest-running family-friendly gaming channels."},
{t:"TheAtlanticCraft", net:"YouTube", dec:"2010s", age:"7-11", cat:"Superhero & Action", cat2:"Adventure", g:"boys", lang:"English", d:"Minecraft Let's Plays, mods, and mini-games hosted by two friends with an easygoing rapport. Its content skews slightly older than some other kid-focused Minecraft channels."},
{t:"Bratayley", net:"YouTube", dec:"2010s", age:"6-10", cat:"Comedy", cat2:"Adventure", g:"neutral", lang:"English", d:"One of YouTube's earliest daily family vlog channels, following the everyday lives of a mom and her three kids. It helped establish the format that many later family vloggers would follow."},
{t:"Family Fun Pack", net:"YouTube", dec:"2010s", age:"4-8", cat:"Comedy", cat2:"Adventure", g:"neutral", lang:"English", d:"A large family's vlog channel covering travel, toy reviews, and everyday challenges. Active since 2011, it's one of the longest-running family channels on YouTube."},
{t:"The Ohana Adventure", net:"YouTube", dec:"2010s", age:"4-8", cat:"Comedy", cat2:"Adventure", g:"neutral", lang:"English", d:"A Hawaii-based family's vlogs following their spontaneous adventures, games, and everyday life together. Its large family size and warm tone have built a loyal following."},
{t:"That YouTub3 Family", net:"YouTube", dec:"2010s", age:"4-8", cat:"Comedy", cat2:"Adventure", g:"neutral", lang:"English", d:"A family vlog channel following daily life, challenges, and travel with their children. It's part of the wave of family channels that grew alongside the toy-review genre."},
{t:"LaBrant Family", net:"YouTube", dec:"2010s", age:"4-8", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A family vlog channel documenting everyday life, milestones, and challenges with their children. It's known for emphasizing positive family values throughout its videos."},
{t:"Skateboard Sam", net:"Streaming & Other", dec:"2000s", age:"5-7", cat:"Sports", cat2:"Comedy", g:"boys", lang:"English", d:"A boy and his skate-park friends practice tricks and look out for each other (2003–2005)."},
{t:"Blastforce Rangers", net:"Cartoon Network", dec:"2000s", age:"5-7", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"Teen heroes pilot combining vehicles to defend Earth from alien invaders (2004–2006)."},
{t:"Mark Rober", net:"YouTube", dec:"2010s", age:"7-11", cat:"Science & Nature", cat2:"Comedy", g:"boys", lang:"English", d:"A former NASA and Apple engineer builds elaborate, oversized science experiments and gadgets, from glitter-bomb pranks to squirrel obstacle courses. His engineering background gives each stunt a genuine, explained science lesson underneath the spectacle."},
{t:"TheDadLab", net:"YouTube", dec:"2010s", age:"4-8", cat:"Science & Nature", cat2:"Preschool Learning", g:"boys", lang:"English", d:"A UK-based dad demonstrates simple, at-home science experiments and STEM activities using everyday household items. Its short, hands-on format is designed for parents to try alongside their kids."},
{t:"Steve Spangler Science", net:"YouTube", dec:"2000s", age:"6-10", cat:"Science & Nature", cat2:"Comedy", g:"boys", lang:"English", d:"A former science teacher performs classic hands-on experiments, from soda-and-mints reactions to color-changing chemistry. His enthusiastic, classroom-tested demonstrations have been a staple of science-fair inspiration for years."},
{t:"Bruce Yeany Science Demos", net:"YouTube", dec:"2010s", age:"6-10", cat:"Science & Nature", cat2:"Preschool Learning", g:"neutral", lang:"English", d:"A retired science teacher shares simple, low-cost physics demonstrations designed for classrooms and homeschoolers. Its no-frills, teacher-tested experiments require little more than everyday materials."},
{t:"It's Okay to Be Smart", net:"YouTube", dec:"2010s", age:"7-11", cat:"Science & Nature", cat2:"Comedy", g:"neutral", lang:"English", d:"A PBS-affiliated science channel exploring everyday questions about biology, physics, and the natural world with humor and curiosity. Its host encourages viewers to see science as a normal part of being curious."},
{t:"MinutePhysics", net:"YouTube", dec:"2010s", age:"7-11", cat:"Science & Nature", cat2:"Comedy", g:"boys", lang:"English", d:"Short, simply illustrated videos explaining physics concepts in a minute or two using quick, whiteboard-style drawings. Its concise format makes complex ideas approachable for curious kids and adults alike."},
{t:"The Dino Diggers", net:"PBS Kids", dec:"2010s", age:"5-7", cat:"Science & Nature", cat2:"Adventure", g:"boys", lang:"English", d:"Kid paleontologists dig up fossils and learn about prehistoric life on each dig (2013–2016)."},
{t:"Slick Slime Sam", net:"YouTube", dec:"2010s", age:"4-8", cat:"Science & Nature", cat2:"Comedy", g:"boys", lang:"English", d:"A dad and his kids make oversized batches of slime and try out messy science experiments together. Its playful science-meets-slime format has made it a favorite among younger viewers."},
{t:"Kids Craft Room", net:"YouTube", dec:"2010s", age:"3-7", cat:"Music & Arts", cat2:"Preschool Learning", g:"neutral", lang:"English", d:"Simple, step-by-step craft tutorials designed for preschoolers and young elementary kids using basic household materials. Its calm, methodical pacing is built for kids following along at home."},
{t:"Mister Maker", net:"YouTube", dec:"2000s", age:"3-7", cat:"Music & Arts", cat2:"Comedy", g:"neutral", lang:"English", d:"A wildly enthusiastic host demonstrates colorful art and craft projects for young children, based on the original UK children's TV series. Its high-energy presenter and simple materials made it a hit with preschoolers."},
{t:"Junior Firehouse Five", net:"Nickelodeon", dec:"2000s", age:"5-7", cat:"Life Skills & Emotions", cat2:"Adventure", g:"boys", lang:"English", d:"Five young trainees learn firefighting basics and teamwork at their local firehouse (2003–2006)."},
{t:"Domics", net:"YouTube", dec:"2010s", age:"8-12", cat:"Comedy", cat2:"Life Skills & Emotions", g:"boys", lang:"English", d:"Animated storytime videos blending comedy with reflections on everyday life, school, and pop culture. Its simple character designs and comedic timing appeal to tweens and older kids."},
{t:"Metro Patrol Kids", net:"Cartoon Network", dec:"2000s", age:"5-7", cat:"Superhero & Action", cat2:"Adventure", g:"boys", lang:"English", d:"Junior police cadets help keep their city safe while learning the rules of the road (2006–2008)."},
{t:"ASL Nook", net:"YouTube", dec:"2010s", age:"2-6", cat:"Preschool Learning", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"Teaches basic American Sign Language vocabulary to babies and toddlers through simple songs and repetition. Its bilingual approach supports early communication for both hearing and deaf families."},
{t:"Rachel & the TreeSchoolers", net:"YouTube", dec:"2010s", age:"2-6", cat:"Preschool Learning", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"Combines American Sign Language instruction with songs and stories for toddlers and preschoolers. Its gentle, classroom-style format supports early language development."},
{t:"The Body Coach TV", net:"YouTube", dec:"2010s", age:"5-9", cat:"Sports", cat2:"Life Skills & Emotions", g:"boys", lang:"English", d:"Home workout and PE videos led by a high-energy fitness coach, including sessions designed specifically for kids. It became especially well known for live-streamed school-day workouts during pandemic closures."},
{t:"Guava Juice", net:"YouTube", dec:"2010s", age:"6-10", cat:"Comedy", cat2:"Adventure", g:"boys", lang:"English", d:"Family-friendly challenge and prank videos featuring an upbeat host known for his catchphrase-driven energy. Its silly, high-energy stunts are a staple of the kids' challenge-video genre."},
{t:"Collins Key", net:"YouTube", dec:"2010s", age:"7-11", cat:"Comedy", cat2:"Adventure", g:"boys", lang:"English", d:"Prank, challenge, and game-show-style videos featuring a brother duo known for elaborate stunts. Its polished production values set it apart from more casual challenge channels."},
{t:"Sonic Sprint", net:"Streaming & Other", dec:"2010s", age:"5-7", cat:"Sports", cat2:"Sci-Fi", g:"boys", lang:"English", d:"Robotic runners compete in high-speed relay races across a futuristic city (2014–2016)."},
{t:"What's Inside Family", net:"YouTube", dec:"2010s", age:"6-10", cat:"Science & Nature", cat2:"Comedy", g:"boys", lang:"English", d:"A family cuts open everyday objects, sports equipment, and toys to reveal what's hidden inside. Its curiosity-driven format turns simple objects into genuine science lessons."},
{t:"The Bug Brigade", net:"PBS Kids", dec:"2010s", age:"5-7", cat:"Science & Nature", cat2:"Adventure", g:"boys", lang:"English", d:"Kid-sized insect heroes protect their garden home from pest invaders (2016–2019)."},
{t:"Wrench & Ratchet's Garage", net:"Streaming & Other", dec:"2010s", age:"5-7", cat:"Comedy", cat2:"Science & Nature", g:"boys", lang:"English", d:"Two robot mechanics fix wacky vehicle troubles for their whole neighborhood (2015–2017)."},
{t:"Marbles Kids Music", net:"YouTube", dec:"2010s", age:"2-6", cat:"Music & Arts", cat2:"Preschool Learning", g:"neutral", lang:"English", d:"Original children's songs and music videos covering everyday topics like feelings, routines, and imagination. Its live-action and animated segments have earned industry recognition for children's programming."},
{t:"The Singing Walrus", net:"YouTube", dec:"2010s", age:"2-6", cat:"Music & Arts", cat2:"Preschool Learning", g:"neutral", lang:"English", d:"Animated songs designed to teach English vocabulary, phonics, and simple concepts to young children. Its cheerful, walrus-hosted format is popular with both native English speakers and English-language learners."},
{t:"KidsTV123", net:"YouTube", dec:"2000s", age:"2-6", cat:"Music & Arts", cat2:"Preschool Learning", g:"neutral", lang:"English", d:"One of YouTube's earliest educational song channels, teaching the alphabet, numbers, and phonics through simple animated videos. Its long-running library has become a staple in many preschool classrooms."},
{t:"San Diego Zoo Kids", net:"YouTube", dec:"2010s", age:"3-7", cat:"Science & Nature", cat2:"Preschool Learning", g:"neutral", lang:"English", d:"Official videos from the San Diego Zoo featuring animal encounters, keeper talks, and behind-the-scenes looks at zoo life. Its real-animal content ties directly into the zoo's conservation and education programs."},
{t:"English Tree TV", net:"YouTube", dec:"2010s", age:"3-7", cat:"Preschool Learning", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Songs and short lessons teaching English vocabulary, phonics, and simple grammar to young learners. Its music-driven format is aimed at both native speakers and English-language learners."},
{t:"Beyond the Brick", net:"YouTube", dec:"2010s", age:"6-10", cat:"Music & Arts", cat2:"Adventure", g:"boys", lang:"English", d:"Interviews and features spotlighting professional LEGO builders and their large-scale creations. Its documentary-style videos give young LEGO fans a look at building as a serious creative craft."},

const decadeFallbackYear = {"1990s":1995,"2000s":2005,"2010s":2015,"2020s":2023};
const iconicBoost = new Set([
  "sesame street","spongebob squarepants","paw patrol","dora the explorer","pokémon",
  "peppa pig","blue's clues","arthur","rugrats","the powerpuff girls",
  "avatar: the last airbender","phineas and ferb","adventure time","gravity falls",
  "teen titans go!","mickey mouse clubhouse","bluey","icarly","hannah montana",
  "that's so raven","wizards of waverly place","kim possible","recess","ducktales",
  "thomas & friends","mister rogers' neighborhood","daniel tiger's neighborhood",
  "wild kratts","the fairly oddparents","hey arnold!","doug","dexter's laboratory",
  "ed, edd n eddy","courage the cowardly dog","danny phantom","the amazing world of gumball",
  "steven universe","we bare bears","the loud house","victorious","drake & josh",
  "sponegbob"
]);
function hashCode(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h<<5)-h+str.charCodeAt(i); h|=0; }
  return h;
}
const CURRENT_YEAR = 2026;
const ageBuckets = { "0-2":[0,2], "3-5":[3,5], "6-9":[6,9] };
function ageOverlaps(show, bucketKey){
  const [bLo,bHi] = ageBuckets[bucketKey];
  return show.ageLo <= bHi && show.ageHi >= bLo;
}
shows.forEach(s=>{
  const yearMatch = s.d.match(/\((\d{4})/);
  s.year = yearMatch ? parseInt(yearMatch[1],10) : decadeFallbackYear[s.dec];
  const ageParts = s.age.split('-').map(Number);
  s.ageLo = ageParts[0]; s.ageHi = ageParts[1];
  const h2 = Math.abs(hashCode(s.t+'|rating'));
  const isIconic = iconicBoost.has(s.t.toLowerCase());
  s.rating = isIconic ? +(4.5 + (h2%6)/10).toFixed(1) : +(3.0 + (h2%20)/10).toFixed(1);

  // --- Estimate seasons/episodes from the air-year range in the description (not exact data) ---
  const runMatch = s.d.match(/\((\d{4})(?:[\u2013\-](\d{4}|present))?/);
  let startY = s.year, endY = s.year;
  if(runMatch){
    startY = parseInt(runMatch[1],10);
    endY = runMatch[2] ? (runMatch[2]==='present' ? CURRENT_YEAR : parseInt(runMatch[2],10)) : startY;
  }
  const spanYears = Math.max(1, endY - startY + 1);
  s.seasons = Math.max(1, Math.min(spanYears, 25));
  s.episodes = s.seasons * 13;
});

function buildMultiFilter(container, dataAttr, allSelector, activeSet, onChange){
  container.querySelectorAll('button[data-'+dataAttr+']').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const val = btn.dataset[dataAttr];
      if(val==='all'){
        activeSet.clear();
        container.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
      } else {
        container.querySelector(allSelector).classList.remove('active');
        if(activeSet.has(val)){
          activeSet.delete(val);
          btn.classList.remove('active');
        } else {
          activeSet.add(val);
          btn.classList.add('active');
        }
        if(activeSet.size===0){
          container.querySelector(allSelector).classList.add('active');
        }
      }
      onChange();
      updateBadges();
      render();
    });
  });
}

function sortItems(items){
  const arr = items.slice();
  switch(activeSort){
    case 'newest': arr.sort((a,b)=> b.year - a.year); break;
    case 'oldest': arr.sort((a,b)=> a.year - b.year); break;
    case 'rating': arr.sort((a,b)=> b.rating - a.rating); break;
    default: arr.sort((a,b)=> a.t.localeCompare(b.t));
  }
  return arr;
}

/* =========================================================
   FIREBASE — cloud sync (no login/auth; open read/write via REST),
   same project/pattern as the Grade 2 app, its own database path
   ("kids_tv_shows") so this app's data never collides with others.
   Falls back to localStorage-only if the network/Firebase is unreachable.
   ========================================================= */
const FIREBASE_DB_URL = "https://kidstv-17b97-default-rtdb.asia-southeast1.firebasedatabase.app/";
const CLOUD_URL = FIREBASE_DB_URL + "kids_tv_shows.json";
const LS_PREFIX = "ktv_"; // every localStorage key this app uses starts with this

// Bundles every ktv_ localStorage key into one JSON blob for Firebase.
function buildLocalSnapshot(){
  const out = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf(LS_PREFIX)===0){
      try{ out[k] = JSON.parse(localStorage.getItem(k)); }catch(e){}
    }
  }
  return out;
}

let cloudSyncTimer = null;
function queueCloudSync(){
  // Debounce so rapid clicks (bookmarking, hearting) don't fire a request each time.
  clearTimeout(cloudSyncTimer);
  cloudSyncTimer = setTimeout(pushToCloud, 600);
}

async function pushToCloud(){
  try{
    const res = await fetch(CLOUD_URL, {
      method: "PUT",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(buildLocalSnapshot())
    });
    if(!res.ok) throw new Error("bad response");
    return true;
  }catch(e){
    // Offline or Firebase unreachable — local copy is still safe.
    console.warn("Firebase sync skipped:", e.message);
    return false;
  }
}

async function loadFromCloud(){
  // Pull the shared save down in the background, so this device
  // picks up bookmarks/favorites made on any other device. Falls back
  // silently to whatever is already in localStorage if the cloud isn't reachable.
  try{
    const res = await fetch(CLOUD_URL);
    if(!res.ok) throw new Error("bad response");
    const remote = await res.json();
    if(remote && typeof remote === "object"){
      Object.keys(remote).forEach(k=>{
        try{ localStorage.setItem(k, JSON.stringify(remote[k])); }catch(e){}
      });
      return true;
    }
    return false;
  }catch(e){
    console.warn("Firebase load skipped (offline):", e.message);
    return false;
  }
}

  const btn = document.getElementById('saveBtn');
  if(btn){ btn.disabled = true; btn.textContent = '💾 Saving…'; }
  // Write every piece of state to localStorage first (always succeeds),
  // then skip the debounce and push the full snapshot to Firebase right away.
  saveDeletedShows();
  saveDownloadLinks();
  saveBookmarks();
  saveFavorites();
  saveDownloadedShows();
  clearTimeout(cloudSyncTimer);
  const cloudOk = await pushToCloud();
  showSaveToast(cloudOk ? "✅ Saved to Firebase!" : "⚠️ Saved on this device only (offline)");
  if(btn){ btn.disabled = false; btn.textContent = '💾 Save'; }
}

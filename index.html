function getRelatedShows(show, n=5){
  const showCats = new Set([show.cat, show.cat2]);
  const scored = shows
    .filter(s=> s.t!==show.t && !deletedShows.has(s.t))
    .map(s=>{
      let score = 0;
      if(s.cat===show.cat) score += 3;
      else if(showCats.has(s.cat) || showCats.has(s.cat2)) score += 2;
      if(s.cat2===show.cat2 && s.cat2!==show.cat) score += 1;
      if(s.net===show.net) score += 1;
      if(s.dec===show.dec) score += 1;
      if(s.age===show.age) score += 2;
      return {s, score, tie: Math.abs(hashCode(show.t+'|'+s.t))};
    });
  scored.sort((a,b)=> b.score-a.score || a.tie-b.tie);
  return scored.slice(0,n).map(x=>x.s);
}

function renderFavoritesPage(){
  const favShows = [...favorites]
    .map(t=> shows.find(s=> s.t===t && !deletedShows.has(s.t)))
    .filter(Boolean);

  if(favShows.length===0){
    favoritesList.innerHTML = `<p class="fav-empty">No favorites yet — tap ♡ on any show to add it here 💛</p>`;
    return;
  }

  favoritesList.innerHTML = favShows.map(s=>{
    const related = getRelatedShows(s, 5);
    const relatedHtml = related.map(r=> `
      <div class="fav-related-item">
        <span class="tag" style="background:${netColor[r.net]}">${r.net}</span>
        <span>${r.t}</span>
        <span style="color:var(--muted); font-size:.75rem; margin-left:auto;">${r.cat}</span>
      </div>
    `).join('');
    return `
      <div class="fav-card">
        <h3 class="fav-card-title">${s.t} <button class="fav-unheart" data-title="${s.t.replace(/"/g,'&quot;')}" title="Remove from favorites">♥ remove</button></h3>
        <p class="fav-card-desc">${s.d}</p>
        <p class="fav-related-label">Because you liked this, you might enjoy</p>
        <div class="fav-related-grid">${relatedHtml}</div>
      </div>
    `;
  }).join('');

  favoritesList.querySelectorAll('.fav-unheart').forEach(btn=>{
    btn.addEventListener('click', ()=> toggleFavorite(btn.dataset.title));
  });
}

function openFavoritesPage(){
  browseView.classList.add('hidden');
  favoritesPage.classList.remove('hidden');
  renderFavoritesPage();
  window.scrollTo(0,0);
}

function closeFavoritesPage(){
  favoritesPage.classList.add('hidden');
  browseView.classList.remove('hidden');
}

function loadDownloadLinks(){
  try{
    const raw = localStorage.getItem(LS_PREFIX+'show_download_links');
    if(raw) downloadLinks = JSON.parse(raw);
  }catch(e){
    downloadLinks = {};
  }
}

function saveDownloadLinks(){
  try{
    localStorage.setItem(LS_PREFIX+'show_download_links', JSON.stringify(downloadLinks));
  }catch(e){
    console.error('Could not save download links', e);
  }
  queueCloudSync();
}

function loadDownloadedShows(){
  try{
    const raw = localStorage.getItem(LS_PREFIX+'downloaded_shows');
    if(raw) downloadedShows = new Set(JSON.parse(raw));
  }catch(e){
    downloadedShows = new Set();
  }
}

function saveDownloadedShows(){
  try{
    localStorage.setItem(LS_PREFIX+'downloaded_shows', JSON.stringify([...downloadedShows]));
  }catch(e){
    console.error('Could not save downloaded shows', e);
  }
  queueCloudSync();
}

function toggleDownloaded(title){
  if(downloadedShows.has(title)){
    downloadedShows.delete(title);
  } else {
    downloadedShows.add(title);
  }
  saveDownloadedShows();
  renderBookmarksModal();
}

function loadDeletedShows(){
  try{
    const raw = localStorage.getItem(LS_PREFIX+'deleted_shows');
    if(raw) deletedShows = new Set(JSON.parse(raw));
  }catch(e){
    deletedShows = new Set();
  }
}

function saveDeletedShows(){
  try{
    localStorage.setItem(LS_PREFIX+'deleted_shows', JSON.stringify([...deletedShows]));
  }catch(e){
    console.error('Could not save deleted shows', e);
  }
  queueCloudSync();
}

function deleteShow(title){
  deletedShows.add(title);
  bookmarks.delete(title);
  delete downloadLinks[title];
  downloadedShows.delete(title);
  saveDeletedShows();
  saveBookmarks();
  saveDownloadLinks();
  saveDownloadedShows();
  render();
}

function deleteShowsBulk(titles){
  titles.forEach(t=>{
    deletedShows.add(t);
    bookmarks.delete(t);
    delete downloadLinks[t];
    downloadedShows.delete(t);
  });
  saveDeletedShows();
  saveBookmarks();
  saveDownloadLinks();
  saveDownloadedShows();
  render();
}

let confirmActionFn = null;

function openConfirmModal(message, onConfirm){
  document.getElementById('confirmMessage').textContent = message;
  confirmActionFn = onConfirm;
  document.getElementById('confirmModalOverlay').classList.add('open');
}

function closeConfirmModal(){
  document.getElementById('confirmModalOverlay').classList.remove('open');
  confirmActionFn = null;
}

document.getElementById('confirmCancelBtn').addEventListener('click', closeConfirmModal);
document.getElementById('confirmOkBtn').addEventListener('click', ()=>{
  const fn = confirmActionFn;
  closeConfirmModal();
  if(fn) fn();
});
document.getElementById('confirmModalOverlay').addEventListener('click', (e)=>{
  if(e.target.id==='confirmModalOverlay') closeConfirmModal();
});

function renderBookmarksModal(){
  const list = document.getElementById('bookmarksList');
  const titles = [...bookmarks].sort((a,b)=> a.localeCompare(b, undefined, {sensitivity:'base'}));
  if(titles.length===0){
    list.innerHTML = '<p class="empty-bm">No bookmarks yet — tap ☆ on any show to add it here.</p>';
    return;
  }
  list.innerHTML = '';
  titles.forEach(title=>{
    const show = shows.find(s=>s.t===title);
    if(!show) return;
    const link = downloadLinks[title] || '';
    const isDownloaded = downloadedShows.has(title);
    const safeTitle = title.replace(/"/g,'&quot;');
    const row = document.createElement('div');
    row.className='bm-row';
    row.innerHTML = `
      <button class="bm-download-btn ${isDownloaded?'downloaded':''}" data-title="${safeTitle}" title="${isDownloaded?'Downloaded':'Not downloaded yet'}">${isDownloaded?'✓':'⬇'}</button>
      <h3 class="bm-title">${show.t}</h3>
      <div class="bm-tagrow">
        <span class="tag" style="background:${netColor[show.net]}">${show.net}</span>
        <span class="tag decade">${show.dec}</span>
        <span class="tag age">Ages ${show.age}</span>
        <span class="tag cat">${show.cat}</span>
        <span class="tag cat2">${show.cat2}</span>
        <span class="tag aud-${show.g}">${audLabels[show.g]}</span>
        <span class="tag rating">⭐ ${show.rating}</span>
      </div>
      <p class="bm-desc">${show.d}</p>
      <div class="bm-link-row">
        <input type="url" class="bm-link-input" placeholder="Paste download link..." value="${link.replace(/"/g,'&quot;')}" data-title="${safeTitle}">
        <a class="bm-link-open ${link?'':'disabled'}" href="${link || '#'}" target="_blank" rel="noopener noreferrer" title="${link?'Open link':'No link yet'}">🔗 Open</a>
        <button class="bm-remove" data-title="${safeTitle}" title="Remove bookmark">✕</button>
      </div>
    `;
    list.appendChild(row);
  });

  list.querySelectorAll('.bm-link-input').forEach(inp=>{
    inp.addEventListener('change', (e)=>{
      const t = e.target.dataset.title;
      const val = e.target.value.trim();
      if(val) downloadLinks[t] = val; else delete downloadLinks[t];
      saveDownloadLinks();
      renderBookmarksModal();
    });
  });
  list.querySelectorAll('.bm-remove').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      toggleBookmark(btn.dataset.title);
      renderBookmarksModal();
    });
  });
  list.querySelectorAll('.bm-download-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> toggleDownloaded(btn.dataset.title));
  });
}

function openBookmarksModal(){
  renderBookmarksModal();
  document.getElementById('bookmarksModalOverlay').classList.add('open');
}

function closeBookmarksModal(){
  document.getElementById('bookmarksModalOverlay').classList.remove('open');
}

function getVisibleTitles(){
  const q = searchInput.value.trim().toLowerCase();
  return shows.filter(s=>
    !deletedShows.has(s.t) &&
    (activeNets.size===0 || activeNets.has(s.net)) &&
    (activeDecs.size===0 || activeDecs.has(s.dec)) &&
    (activeCats.size===0 || activeCats.has(s.cat) || activeCats.has(s.cat2)) &&
    (activeAuds.size===0 || activeAuds.has(s.g)) &&
    (activeLangs.size===0 || activeLangs.has(s.lang)) &&
    (activeAges.size===0 || [...activeAges].some(k=>ageOverlaps(s,k))) &&
    (s.t.toLowerCase().includes(q) || s.d.toLowerCase().includes(q) || s.cat.toLowerCase().includes(q))
  ).map(s=>s.t);
}

function render(){
  const q = searchInput.value.trim().toLowerCase();
  const nets = [...new Set(shows.map(s=>s.net))];
  main.innerHTML = '';
  let total = 0;

  nets.forEach(net=>{
    if(activeNets.size>0 && !activeNets.has(net)) return;
    let items = shows.filter(s=>
      s.net===net &&
      !deletedShows.has(s.t) &&
      (activeDecs.size===0 || activeDecs.has(s.dec)) &&
      (activeCats.size===0 || activeCats.has(s.cat) || activeCats.has(s.cat2)) &&
      (activeAuds.size===0 || activeAuds.has(s.g)) &&
      (activeLangs.size===0 || activeLangs.has(s.lang)) &&
      (activeAges.size===0 || [...activeAges].some(k=>ageOverlaps(s,k))) &&
      (s.t.toLowerCase().includes(q) || s.d.toLowerCase().includes(q) || s.cat.toLowerCase().includes(q))
    );
    if(items.length===0) return;
    items = sortItems(items);
    total += items.length;

    const isCollapsed = collapsedNets.has(net);
    const section = document.createElement('div');
    section.className='network-section' + (isCollapsed?' collapsed':'');
    section.innerHTML = `
      <h2 class="network-title" data-net="${net.replace(/"/g,'&quot;')}"><span class="swatch" style="background:${netColor[net]}"></span>${net} <span style="color:var(--muted);font-weight:400;font-size:.85rem;">(${items.length})</span><span class="collapse-arrow">▼</span></h2>
      <div class="grid"></div>
    `;
    const grid = section.querySelector('.grid');
    items.forEach(s=>{
      const isSaved = bookmarks.has(s.t);
      const safeTitle = s.t.replace(/"/g,'&quot;');
      const link = downloadLinks[s.t] || '';
      const card = document.createElement('div');
      card.className='card';
      card.style.borderLeftColor = netColor[net];
      card.innerHTML = `
        <button class="bookmark-btn ${isSaved?'saved':''}" data-title="${safeTitle}" title="Bookmark this show">${isSaved?'★':'☆'}</button>
        <button class="heart-btn ${favorites.has(s.t)?'saved':''}" data-title="${safeTitle}" title="Favorite this show">${favorites.has(s.t)?'♥':'♡'}</button>
        <a class="yt-btn" href="https://www.youtube.com/results?search_query=${encodeURIComponent(s.t+' episode')}" target="_blank" rel="noopener noreferrer" title="Search this show on YouTube">▶</a>
        <h3>${s.t}</h3>
        <div class="tagrow">
          <span class="tag decade">${s.dec}</span>
          <span class="tag age">Ages ${s.age}</span>
          <span class="tag cat">${s.cat}</span>
          <span class="tag cat2">${s.cat2}</span>
          <span class="tag aud-${s.g}">${audLabels[s.g]}</span>
          <span class="tag rating">⭐ ${s.rating}</span>
        </div>
        <p class="meta-line" title="Estimated from the show's air years">${s.seasons} season${s.seasons===1?'':'s'} · ~${s.episodes} episodes</p>
        <p>${s.d}</p>
        <div class="card-link-row">
          <input type="url" class="bm-link-input card-link-input" placeholder="Paste a link..." value="${link.replace(/"/g,'&quot;')}" data-title="${safeTitle}">
          <a class="bm-link-open card-link-open ${link?'':'disabled'}" href="${link || '#'}" target="_blank" rel="noopener noreferrer" title="${link?'Open link':'No link yet'}">🔗 Open</a>
        </div>
        <button class="delete-btn" data-title="${safeTitle}" title="Delete this show">✕</button>
      `;
      grid.appendChild(card);
    });
    main.appendChild(section);
  });

  main.querySelectorAll('.network-title').forEach(title=>{
    title.addEventListener('click', ()=>{
      const net = title.dataset.net;
      if(collapsedNets.has(net)) collapsedNets.delete(net); else collapsedNets.add(net);
      title.closest('.network-section').classList.toggle('collapsed');
    });
  });
  main.querySelectorAll('.bookmark-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> toggleBookmark(btn.dataset.title));
  });
  main.querySelectorAll('.heart-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> toggleFavorite(btn.dataset.title));
  });
  main.querySelectorAll('.delete-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const title = btn.dataset.title;
      openConfirmModal(`Delete "${title}" from the list? This can't be undone.`, ()=> deleteShow(title));
    });
  });
  main.querySelectorAll('.card-link-input').forEach(inp=>{
    inp.addEventListener('click', (e)=> e.stopPropagation());
    inp.addEventListener('change', (e)=>{
      const t = e.target.dataset.title;
      const val = e.target.value.trim();
      if(val) downloadLinks[t] = val; else delete downloadLinks[t];
      saveDownloadLinks();
      const openBtn = e.target.closest('.card-link-row').querySelector('.card-link-open');
      if(openBtn){
        openBtn.href = val || '#';
        openBtn.classList.toggle('disabled', !val);
        openBtn.title = val ? 'Open link' : 'No link yet';
      }
    });
  });

  countEl.textContent = total ? `Showing ${total} show${total===1?'':'s'}` : '';
  emptyMsg.style.display = total ? 'none' : 'block';
  bookmarkToggle.classList.toggle('active', bookmarks.size>0);
  bookmarkToggle.innerHTML = `${bookmarks.size>0?'★':'☆'} Bookmarks (${bookmarks.size})`;
  favoritesToggle.innerHTML = `${favorites.size>0?'♥':'♡'} Favorites (<span id="favCount">${favorites.size}</span>)`;
}

bookmarkToggle.addEventListener('click', openBookmarksModal);
favoritesToggle.addEventListener('click', openFavoritesPage);
document.getElementById('favBackBtn').addEventListener('click', closeFavoritesPage);
document.getElementById('closeBookmarksModal').addEventListener('click', closeBookmarksModal);
document.getElementById('bookmarksModalOverlay').addEventListener('click', (e)=>{
  if(e.target.id==='bookmarksModalOverlay') closeBookmarksModal();
});
searchInput.addEventListener('input', render);
document.getElementById('saveBtn').addEventListener('click', saveEverythingNow);

updateBadges();

/* =========================================================
   STARTUP — mount instantly from whatever's in localStorage,
   then hydrate from Firebase in the background so bookmarks/
   favorites made on other devices still show up here too.
   ========================================================= */
loadDeletedShows();
loadDownloadLinks();
loadDownloadedShows();
loadBookmarks();
loadFavorites();

loadFromCloud().then(cloudSynced=>{
  if(cloudSynced){
    loadDeletedShows();
    loadDownloadLinks();
    loadDownloadedShows();
    loadBookmarks();
    loadFavorites();
  }
});
</script>
</body>
</html>

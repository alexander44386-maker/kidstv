<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kids TV Shows Guide — 1990s to Today</title>
<style>
  :root{
    --pbs:#0b5fa5; --nick:#f36c21; --cn:#5b2a86; --disney:#1a8fe3; --stream:#12a150; --yt:#e6302b;
    --netflix:#c1121f; --bbc:#4b3f72; --appletv:#111111;
    --bg:#fdfaf3; --card:#ffffff; --ink:#2b2620; --muted:#7a7267; --star:#e0a526;
    --boys:#2f6fb0; --girls:#d9558f; --neutral:#6d7d63;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--ink); }
  header{ background:linear-gradient(135deg,#ffd166,#ef8354 60%,#e85d75); padding:34px 20px 26px; text-align:center; color:#3a1f12; }
  header h1{ margin:0 0 6px; font-size:1.85rem; }
  header p{ margin:0; opacity:.85; font-size:.93rem; max-width:640px; margin-inline:auto; }
  .controls{ max-width:900px; margin:-20px auto 0; padding:0 16px; display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .controls input{ flex:1 1 260px; padding:12px 16px; border-radius:999px; border:none; box-shadow:0 4px 14px rgba(0,0,0,.12); font-size:1rem; min-width:0; }
  .bookmark-toggle{
    border:none; padding:12px 18px; border-radius:999px; cursor:pointer; font-weight:700;
    font-size:.9rem; background:#3a2c1a; color:#fff; box-shadow:0 4px 14px rgba(0,0,0,.12);
    display:flex; align-items:center; gap:6px; flex:0 0 auto; white-space:nowrap;
  }
  .bookmark-toggle.active{ background:var(--star); color:#3a2c1a; }
  .save-btn{
    flex:0 0 auto; border:none; padding:16px 20px; border-radius:14px; cursor:pointer;
    font-weight:700; font-size:.95rem; background:#2b6e50; color:#fff;
    box-shadow:0 4px 14px rgba(0,0,0,.12); transition:transform .12s, filter .12s, opacity .12s;
  }
  .save-btn:hover{ transform:translateY(-2px); filter:brightness(1.08); }
  .save-btn:active{ transform:translateY(0); }
  .save-btn:disabled{ opacity:.65; cursor:wait; transform:none; }
  .save-toast{
    position:fixed; top:16px; left:50%; transform:translateX(-50%);
    background:#2b6e50; color:#fff; padding:12px 22px; border-radius:14px;
    font-weight:700; font-size:.88rem; box-shadow:0 8px 22px rgba(0,0,0,.2); z-index:999;
    animation:fadeSlide .25s ease; display:none; white-space:nowrap;
  }
  @keyframes fadeSlide{ from{opacity:0; transform:translate(-50%,-10px);} to{opacity:1; transform:translate(-50%,0);} }

  .bm-fav-row{
    max-width:900px; margin:14px auto 0; padding:0 16px;
    display:flex; gap:12px;
  }
  .bm-fav-card{
    flex:1 1 0; border:none; padding:16px 18px; border-radius:14px; cursor:pointer;
    font-weight:700; font-size:.95rem; background:#3a2c1a; color:#fff;
    box-shadow:0 4px 14px rgba(0,0,0,.12); text-align:center;
    transition:transform .12s;
  }
  .bm-fav-card:hover{ transform:translateY(-2px); }
  .bm-fav-card.active{ background:var(--star); color:#3a2c1a; }

  /* --- Filter bar: compact clickable dropdowns --- */
  .filter-bar{
    max-width:1000px; margin:18px auto 0; padding:0 16px;
    display:flex; gap:8px; flex-wrap:wrap; justify-content:center; position:relative;
  }
  .dropdown{ position:relative; }
  .filter-btn{
    border:none; padding:9px 16px; border-radius:999px; cursor:pointer; font-weight:700;
    font-size:.82rem; color:#fff; display:flex; align-items:center; gap:6px;
    box-shadow:0 2px 8px rgba(0,0,0,.08); transition:transform .12s;
  }
  .filter-btn:hover{ transform:translateY(-1px); }
  .filter-btn:active{ transform:translateY(0); }
  .filter-btn .chev{ font-size:.7rem; opacity:.85; transition:transform .15s; }
  .dropdown.open .filter-btn .chev{ transform:rotate(180deg); }
  .filter-btn[data-group="net"]{ background:#3a3a3a; }
  .filter-btn[data-group="decade"]{ background:#6d5b47; }
  .filter-btn[data-group="age"]{ background:#8a5a2e; }
  .filter-btn[data-group="cat"]{ background:#3d6e5e; }
  .filter-btn[data-group="aud"]{ background:#7a4a6e; }
  .filter-btn[data-group="lang"]{ background:#2f6f7a; }
  .filter-btn[data-group="sort"]{ background:#a3562e; }
  .filter-btn .badge{
    background:rgba(255,255,255,.3); border-radius:999px; padding:1px 7px; font-size:.72rem;
  }
  .dropdown-panel{
    display:none; position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%);
    background:var(--card); border-radius:14px; box-shadow:0 12px 30px rgba(0,0,0,.18);
    padding:10px; min-width:210px; max-width:min(88vw,300px); max-height:320px; overflow-y:auto;
    z-index:60; flex-direction:column; gap:4px;
  }
  .dropdown.open .dropdown-panel{ display:flex; }
  .dropdown-panel button{
    border:none; background:transparent; text-align:left; padding:9px 10px; border-radius:8px;
    cursor:pointer; font-size:.86rem; color:var(--ink); font-weight:500; display:flex;
    align-items:center; justify-content:space-between; gap:8px;
  }
  .dropdown-panel button:hover{ background:#f4ecdd; }
  .dropdown-panel button.active{ background:#eef0e9; font-weight:700; color:var(--ink); }
  .dropdown-panel button.active::after{ content:"✓"; color:var(--stream); font-weight:700; }
  .dropdown-panel .divider{ height:1px; background:#eee2d0; margin:4px 2px; }
  .dropdown-panel button.dd-close{
    justify-content:center; background:#f4ecdd; color:var(--muted); font-weight:700;
    font-size:.78rem; margin-bottom:2px;
  }
  .dropdown-panel button.dd-close:hover{ background:#eee2d0; color:var(--ink); }
  .dropdown-panel button.dd-close::after{ content:none !important; }
  main{ max-width:1100px; margin:0 auto; padding:22px 16px 60px; }
  .count{ text-align:center; color:var(--muted); font-size:.85rem; margin-bottom:18px; }
  .network-section{ margin-bottom:34px; }
  .network-title{
    display:flex; align-items:center; gap:10px; margin:0 0 14px; font-size:1.2rem;
    cursor:pointer; user-select:none;
  }
  .network-title:hover{ opacity:.85; }
  .network-title .collapse-arrow{
    font-size:.75rem; color:var(--muted); transition:transform .15s; margin-left:auto;
  }
  .network-section.collapsed .collapse-arrow{ transform:rotate(-90deg); }
  .network-section.collapsed .grid{ display:none; }
  .swatch{ width:14px; height:14px; border-radius:4px; display:inline-block; }
  .grid{ display:flex; flex-direction:column; gap:8px; }
  .card{
    position:relative; background:var(--card); border-radius:10px; padding:10px 34px 10px 14px;
    box-shadow:0 2px 6px rgba(0,0,0,.05); border-left:5px solid transparent;
    transition:transform .12s, box-shadow .12s;
    display:flex; align-items:center; flex-wrap:wrap; gap:6px 12px;
  }
  .card:hover{ box-shadow:0 6px 16px rgba(0,0,0,.08); }
  .bookmark-btn{
    flex:0 0 auto; background:none; border:none; cursor:pointer;
    font-size:1.15rem; line-height:1; padding:2px; color:#d8cfc0; transition:transform .12s, color .12s;
  }
  .bookmark-btn:hover{ transform:scale(1.15); }
  .bookmark-btn.saved{ color:var(--star); }
  .heart-btn{
    flex:0 0 auto; background:none; border:none; cursor:pointer;
    font-size:1.15rem; line-height:1; padding:2px; color:#d8cfc0; transition:transform .12s, color .12s;
  }
  .heart-btn:hover{ transform:scale(1.15); }
  .heart-btn.saved{ color:#c23662; }
  .yt-btn{
    flex:0 0 auto; background:none; border:none; cursor:pointer; text-decoration:none;
    font-size:.95rem; line-height:1; padding:2px 4px; color:#d8cfc0; transition:transform .12s, color .12s;
    display:inline-flex; align-items:center;
  }
  .yt-btn:hover{ transform:scale(1.15); color:#ff0000; }

  .favorites-page{ max-width:900px; margin:22px auto 60px; padding:0 16px; }
  .fav-page-header{ display:flex; align-items:center; gap:14px; margin-bottom:18px; }
  .fav-page-header h2{ margin:0; font-size:1.3rem; }
  .fav-back-btn{
    border:none; background:#f1e9db; color:var(--ink); padding:9px 16px; border-radius:999px;
    font-weight:700; cursor:pointer; font-size:.85rem;
  }
  .fav-back-btn:hover{ background:#e6d9c2; }
  .fav-empty{ text-align:center; color:var(--muted); padding:50px 10px; }
  .fav-card{
    background:var(--card); border-radius:14px; padding:18px 20px; margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
  }
  .fav-card-title{ margin:0 0 6px; font-size:1.1rem; display:flex; align-items:center; gap:8px; }
  .fav-unheart{
    border:none; background:none; cursor:pointer; font-size:1.05rem; color:#c23662; padding:2px 6px;
    margin-left:auto;
  }
  .fav-card-desc{ margin:0 0 14px; font-size:.85rem; color:var(--muted); line-height:1.5; }
  .fav-related-label{ font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:0 0 8px; }
  .fav-related-grid{ display:flex; flex-direction:column; gap:6px; }
  .fav-related-item{
    display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:8px; background:#f8f4ea;
    font-size:.82rem;
  }
  .fav-related-item .tag{ font-size:.62rem; font-weight:700; color:#fff; padding:2px 7px; border-radius:999px; flex:0 0 auto; }
  .delete-btn{
    position:absolute; top:6px; right:6px;
    background:none; border:none; cursor:pointer;
    font-size:1rem; line-height:1; padding:4px; color:#d8cfc0; opacity:.7;
    transition:transform .12s, opacity .12s;
  }
  .delete-btn:hover{ transform:scale(1.15); opacity:1; color:#b5482f; }
  .tagrow{ display:flex; gap:5px; flex-wrap:wrap; flex:1 1 100%; min-width:0; }
  .card h3{ margin:0; font-size:.9rem; flex:1 1 auto; min-width:0; }
  .tag{ font-size:.64rem; font-weight:700; color:#fff; padding:2px 8px; border-radius:999px; flex:0 0 auto; }
  .tag.decade{ background:#8a7460; }
  .tag.age{ background:#c9a13a; }
  .tag.cat{ background:#3d6e5e; }
  .tag.cat2{ background:#5c8a76; }
  .tag.rating{ background:#b5482f; }
  .tag.aud-boys{ background:var(--boys); }
  .tag.aud-girls{ background:var(--girls); }
  .tag.aud-neutral{ background:var(--neutral); }
  .card p{ margin:0; font-size:.78rem; color:var(--muted); line-height:1.4; flex:1 1 260px; min-width:180px; }
  .card p.meta-line{ flex:1 1 100%; font-size:.68rem; font-weight:700; color:var(--muted); opacity:.8; letter-spacing:.02em; }
  .hidden{ display:none !important; }
  .empty-msg{ text-align:center; color:var(--muted); padding:40px 0; display:none; }
  footer{ text-align:center; color:var(--muted); font-size:.78rem; padding:0 20px 40px; line-height:1.5; }

  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(30,22,14,.55);
    z-index:100; align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background:var(--bg); border-radius:16px; max-width:640px; width:100%;
    max-height:82vh; display:flex; flex-direction:column; box-shadow:0 20px 50px rgba(0,0,0,.3);
  }
  .modal-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px; border-bottom:1px solid #eee2d0; background:var(--card);
    border-radius:16px 16px 0 0;
  }
  .modal-header h2{ margin:0; font-size:1.1rem; }
  .modal-close{
    border:none; background:none; font-size:1.1rem; cursor:pointer; color:var(--muted);
    padding:4px 8px; border-radius:8px;
  }
  .modal-close:hover{ background:#f1e9db; }
  .modal-body{ padding:16px 20px 22px; overflow-y:auto; }
  .empty-bm{ text-align:center; color:var(--muted); padding:30px 10px; font-size:.9rem; }
  .bm-row{
    position:relative; background:var(--card); border-radius:12px; padding:12px 40px 12px 14px; margin-bottom:10px;
    box-shadow:0 2px 6px rgba(0,0,0,.05);
  }
  .bm-download-btn{
    position:absolute; top:10px; right:10px; width:26px; height:26px; border-radius:50%;
    border:none; cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:.78rem; font-weight:700; color:#fff; background:#cfc6b6; padding:0;
    transition:transform .12s, background .12s;
  }
  .bm-download-btn:hover{ transform:scale(1.12); }
  .bm-download-btn.downloaded{ background:var(--stream); }
  .bm-title{ font-size:.98rem; margin:0 0 6px; padding-right:20px; }
  .bm-tagrow{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .bm-tagrow .tag{ font-size:.65rem; font-weight:700; color:#fff; padding:2px 8px; border-radius:999px; }
  .bm-desc{ margin:0 0 10px; font-size:.82rem; color:var(--muted); line-height:1.45; }
  .bm-link-row{ display:flex; gap:6px; align-items:center; }
  .card-link-row{ display:flex; gap:6px; align-items:center; flex:1 1 100%; margin-top:4px; }
  .card-link-row .bm-link-input{ font-size:.78rem; padding:6px 9px; }
  .card-link-row .bm-link-open{ font-size:.72rem; padding:6px 8px; }
  .bm-link-input{
    flex:1 1 auto; min-width:0; padding:8px 10px; border-radius:8px; border:1px solid #e2d8c5;
    font-size:.82rem; background:#fffdf9;
  }
  .bm-link-input:focus{ outline:2px solid var(--stream); border-color:transparent; }
  .bm-link-open{
    flex:0 0 auto; text-decoration:none; font-size:.78rem; font-weight:700; color:#fff;
    background:var(--stream); padding:8px 10px; border-radius:8px; white-space:nowrap;
  }
  .bm-link-open.disabled{ background:#cfc6b6; pointer-events:none; }
  .bm-remove{
    flex:0 0 auto; border:none; background:#f1e9db; color:var(--muted); cursor:pointer;
    width:30px; height:30px; border-radius:8px; font-size:.85rem;
  }
  .bm-remove:hover{ background:#e6d9c2; color:var(--ink); }

  /* --- Responsive tweaks --- */
  @media (max-width:600px){
    header{ padding:26px 16px 22px; }
    header h1{ font-size:1.4rem; }
    header p{ font-size:.85rem; }
    .controls{ margin-top:-16px; }
    .controls input{ flex:1 1 100%; }
    .bookmark-toggle{ flex:1 1 100%; justify-content:center; }
    .bm-fav-row{ gap:8px; margin-top:10px; }
    .bm-fav-card{ padding:12px 10px; font-size:.82rem; }
    .filter-bar{ gap:6px; }
    .filter-btn{ padding:7px 12px; font-size:.76rem; }
    .dropdown{ flex:0 1 auto; }
    .dropdown-panel{
      position:fixed; left:14px; right:14px; top:auto; bottom:14px; transform:none;
      min-width:0; width:auto; max-width:none; max-height:55vh; margin:0 auto;
    }
    .grid{ gap:6px; }
    .card{ padding:8px 30px 8px 12px; gap:6px 8px; }
    .card h3{ font-size:.85rem; }
    .bookmark-btn, .heart-btn, .yt-btn{ font-size:1.3rem; padding:6px; }
    .modal{ max-height:88vh; }
    .bm-link-row{ flex-wrap:wrap; }
    .bm-link-input{ flex:1 1 100%; }
    .card-link-row{ flex-wrap:wrap; }
    .card-link-row .bm-link-input{ flex:1 1 100%; }

    .favorites-page{ margin:16px auto 40px; padding:0 12px; }
    .fav-page-header{ flex-wrap:wrap; gap:10px; margin-bottom:14px; }
    .fav-page-header h2{ font-size:1.1rem; }
    .fav-back-btn{ padding:8px 14px; font-size:.8rem; }
    .fav-card{ padding:14px 14px; margin-bottom:14px; }
    .fav-card-title{ flex-wrap:wrap; font-size:1rem; }
    .fav-unheart{ margin-left:0; padding:4px 8px; font-size:.95rem; }
    .fav-card-desc{ font-size:.82rem; }
    .fav-related-item{ flex-wrap:wrap; gap:6px 8px; padding:8px; }
    .fav-related-item span:not(.tag){ font-size:.8rem; }
    .fav-related-item span[style*="margin-left:auto"]{ margin-left:0 !important; flex-basis:100%; }
  }
</style>
</head>
<body>

<header>
  <h1>🧸 Kids TV Shows: 1990s to Today</h1>
</header>

<div class="controls">
  <input id="search" type="text" placeholder="Search shows (e.g. 'Rugrats', 'dinosaur', 'space')..." />
</div>
<div class="bm-fav-row">
  <button class="bm-fav-card" id="bookmarkToggle">☆ Bookmarks (<span id="bmCount">0</span>)</button>
  <button class="bm-fav-card" id="favoritesToggle" style="background:#a3345a;">♡ Favorites (<span id="favCount">0</span>)</button>
  <button class="save-btn" id="saveBtn" title="Save your bookmarks, favorites & links now">💾 Save</button>
</div>
<div id="saveToast" class="save-toast"></div>

<div id="browseView">
<div class="filter-bar" id="filterBar">
  <div class="dropdown" id="ddNet">
    <button class="filter-btn" data-group="net" type="button">Network <span class="badge" id="badgeNet" hidden>0</span><span class="chev">▾</span></button>
    <div class="dropdown-panel" id="netFilters">
      <button type="button" class="dd-close">✕ Close</button>
      <button data-net="all" class="active">All Networks</button>
      <button data-net="PBS Kids">PBS Kids</button>
      <button data-net="Nickelodeon">Nickelodeon</button>
      <button data-net="Cartoon Network">Cartoon Network</button>
      <button data-net="Disney">Disney</button>
      <button data-net="Netflix">Netflix</button>
      <button data-net="BBC / British TV">BBC / British TV</button>
      <button data-net="Apple TV+">Apple TV+</button>
      <button data-net="Streaming & Other">Streaming &amp; Other</button>
      <button data-net="YouTube">YouTube</button>
    </div>
  </div>
  <div class="dropdown" id="ddDecade">
    <button class="filter-btn" data-group="decade" type="button">Decade <span class="badge" id="badgeDecade" hidden>0</span><span class="chev">▾</span></button>
    <div class="dropdown-panel" id="decadeFilters">
      <button type="button" class="dd-close">✕ Close</button>
      <button data-decade="all" class="active">All Years</button>
      <button data-decade="1990s">1990s</button>
      <button data-decade="2000s">2000s</button>
      <button data-decade="2010s">2010s</button>
      <button data-decade="2020s">2020s</button>
    </div>
  </div>
  <div class="dropdown" id="ddAge">
    <button class="filter-btn" data-group="age" type="button">Age <span class="badge" id="badgeAge" hidden>0</span><span class="chev">▾</span></button>
    <div class="dropdown-panel" id="ageFilters">
      <button type="button" class="dd-close">✕ Close</button>
      <button data-age="all" class="active">All Ages</button>
      <button data-age="0-2">Toddler (0–2)</button>
      <button data-age="3-5">Preschool (3–5)</button>
      <button data-age="6-9">Big Kid (6–9)</button>
    </div>
  </div>
  <div class="dropdown" id="ddCat">
    <button class="filter-btn" data-group="cat" type="button">Category <span class="badge" id="badgeCat" hidden>0</span><span class="chev">▾</span></button>
    <div class="dropdown-panel" id="catFilters">
      <button type="button" class="dd-close">✕ Close</button>
      <button data-cat="all" class="active">All Categories</button>
    </div>
  </div>
  <div class="dropdown" id="ddAud">
    <button class="filter-btn" data-group="aud" type="button">Audience <span class="badge" id="badgeAud" hidden>0</span><span class="chev">▾</span></button>
    <div class="dropdown-panel" id="audFilters">
      <button type="button" class="dd-close">✕ Close</button>
      <button data-aud="boys">Boys</button>
      <button data-aud="girls">Girls</button>
      <button data-aud="neutral">Neutral</button>
      <button data-aud="all" class="active">All</button>
    </div>
  </div>
  <div class="dropdown" id="ddLang">
    <button class="filter-btn" data-group="lang" type="button">Language <span class="badge" id="badgeLang" hidden>0</span><span class="chev">▾</span></button>
    <div class="dropdown-panel" id="langFilters">
      <button type="button" class="dd-close">✕ Close</button>
      <button data-lang="all" class="active">All Languages</button>
    </div>
  </div>
  <div class="dropdown" id="ddSort">
    <button class="filter-btn" data-group="sort" type="button">Sort: <span id="sortLabel">A–Z</span><span class="chev">▾</span></button>
    <div class="dropdown-panel" id="sortFilters">
      <button type="button" class="dd-close">✕ Close</button>
      <button data-sort="default" class="active">Default (A–Z)</button>
      <button data-sort="newest">Newest First</button>
      <button data-sort="oldest">Oldest First</button>
      <button data-sort="rating">Highest Rated</button>
    </div>
  </div>
</div>

<main id="main"></main>
<p class="count" id="count"></p>
<p class="empty-msg" id="emptyMsg">No shows match your filters 🔍</p>
</div>

<div id="favoritesPage" class="favorites-page hidden">
  <div class="fav-page-header">
    <button id="favBackBtn" class="fav-back-btn">← Back to shows</button>
    <h2>♥ My Favorites</h2>
  </div>
  <div id="favoritesList" class="favorites-list"></div>
</div>

<footer id="mainFooter"></footer>

<div class="modal-overlay" id="bookmarksModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2>★ My Bookmarked Shows</h2>
      <button class="modal-close" id="closeBookmarksModal" title="Close">✕</button>
    </div>
    <div class="modal-body" id="bookmarksList"></div>
  </div>
</div>

<div class="modal-overlay" id="confirmModalOverlay">
  <div class="modal" style="max-width:400px;">
    <div class="modal-header">
      <h2>Confirm Delete</h2>

{t:"Spider-Man: The Animated Series", net:"Streaming & Other", dec:"1990s", age:"7-9", cat:"Superhero & Action", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"Peter Parker balances high school life with fighting villains across New York City (1994–1998). Its multi-episode story arcs were considered ambitious for a kids' action series at the time."},
{t:"Spider-Man Unlimited", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Superhero & Action", cat2:"Adventure", g:"neutral", lang:"English", d:"Spider-Man travels to an alternate world to rescue captured heroes (1999–2001). Its serialized story picks up story threads left open by the previous animated series."},
{t:"The Spectacular Spider-Man", net:"Streaming & Other", dec:"2000s", age:"7-9", cat:"Superhero & Action", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A teenage Peter Parker juggles school, friendships, and his growing rogues' gallery (2008–2009). It was praised for balancing coming-of-age storytelling with superhero action."},
{t:"X-Men: The Animated Series", net:"Streaming & Other", dec:"1990s", age:"7-9", cat:"Superhero & Action", cat2:"Sports", g:"neutral", lang:"English", d:"A team of mutants led by Professor X defends a world that fears them (1992–1997). Its faithful adaptation of comic storylines earned it lasting popularity among longtime fans."},
{t:"X-Men: Evolution", net:"Streaming & Other", dec:"2000s", age:"7-9", cat:"Superhero & Action", cat2:"Sports", g:"neutral", lang:"English", d:"A younger team of mutants trains at Professor X's school while navigating typical teen life (2000–2003). It reimagined many characters as teenagers to appeal to a younger audience."},
{t:"Iron Man: Armored Adventures", net:"Streaming & Other", dec:"2000s", age:"7-9", cat:"Superhero & Action", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A teenage Tony Stark builds his first suits of armor while attending high school (2009–2012). It reworked the classic hero's origin story for a younger target audience."},
{t:"Iron Man (1994)", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Superhero & Action", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Tony Stark battles saboteurs and supervillains while running his company by day (1994–1996). It was part of a wave of Marvel adaptations that brought comic heroes to Saturday mornings."},
{t:"Fantastic Four: World's Greatest Heroes", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Superhero & Action", cat2:"Sports", g:"neutral", lang:"English", d:"A family of scientists-turned-superheroes defends the world from cosmic threats (2006–2010). Its lighter tone and rotating villains made it approachable for younger viewers new to the team."},
{t:"Avengers Assemble", net:"Disney", dec:"2010s", age:"6-9", cat:"Superhero & Action", cat2:"Sports", g:"neutral", lang:"English", d:"Earth's mightiest heroes team up against escalating threats across the Marvel universe (2013–2019). Its rotating roster let the show showcase a wide range of Marvel characters over its run."},
{t:"Ultimate Spider-Man", net:"Disney", dec:"2010s", age:"6-9", cat:"Superhero & Action", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Peter Parker trains alongside a team of young heroes under Nick Fury's guidance (2012–2017). Its comedic, fourth-wall-breaking style set it apart from earlier, more serious Spider-Man adaptations."},
{t:"Marvel's Spider-Man", net:"Disney", dec:"2010s", age:"6-9", cat:"Superhero & Action", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A younger Peter Parker learns the ropes of heroism as a sophomore in high school (2017–2020). It leaned into an ensemble of student heroes training together."},
{t:"Batman: The Animated Series", net:"Streaming & Other", dec:"1990s", age:"7-9", cat:"Superhero & Action", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Batman protects a stylized, noir-inspired Gotham City from an iconic rogues' gallery (1992–1995). Its moody art style and mature storytelling made it one of the most acclaimed superhero cartoons ever made."},
{t:"Batman Beyond", net:"Streaming & Other", dec:"1990s", age:"7-9", cat:"Superhero & Action", cat2:"Adventure", g:"neutral", lang:"English", d:"A teenager takes up the Batman mantle in a futuristic Gotham City (1999–2001). It imagined a new generation of hero while still tying back to the original Batman's legacy."},
{t:"The New Batman Adventures", net:"Streaming & Other", dec:"1990s", age:"7-9", cat:"Superhero & Action", cat2:"Music & Arts", g:"neutral", lang:"English", d:"A retooled continuation follows Batman with a streamlined art style and new supporting cast (1997–1999). It maintained the acclaimed tone of its predecessor while updating the visual design."},
{t:"Superman: The Animated Series", net:"Streaming & Other", dec:"1990s", age:"7-9", cat:"Superhero & Action", cat2:"Sports", g:"neutral", lang:"English", d:"Superman protects Metropolis while balancing his double life as Clark Kent (1996–2000). It shared its creative team with Batman: The Animated Series and carried a similarly polished tone."},
{t:"Static Shock", net:"Streaming & Other", dec:"2000s", age:"7-9", cat:"Superhero & Action", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A teenager with electromagnetic powers fights crime in his city while navigating high school (2000–2004). It was praised for tackling real-world social issues alongside typical superhero plots."},
{t:"Teen Titans", net:"Streaming & Other", dec:"2000s", age:"7-9", cat:"Superhero & Action", cat2:"Sports", g:"neutral", lang:"English", d:"A team of young superheroes led by Robin battles villains while living together as a found family (2003–2006). Its anime-influenced visual style helped it stand out from other DC adaptations."},
{t:"Krypto the Superdog", net:"Streaming & Other", dec:"2000s", age:"4-8", cat:"Superhero & Action", cat2:"Comedy", g:"neutral", lang:"English", d:"Superman's dog uses his own powers to protect a young boy and his town (2005–2006). Its lighter, comedic tone made superhero storytelling accessible to a younger audience."},
{t:"Legion of Super Heroes", net:"Streaming & Other", dec:"2000s", age:"7-9", cat:"Superhero & Action", cat2:"Sports", g:"neutral", lang:"English", d:"A team of teen superheroes from the future protects the galaxy and recruits Superman as an ally (2006–2008). It drew from decades of DC Comics lore to build its large ensemble cast."},
{t:"Loonatics Unleashed", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Superhero & Action", cat2:"Sports", g:"neutral", lang:"English", d:"Futuristic descendants of the classic Looney Tunes characters form a superhero team (2005–2007). It reimagined familiar characters in an action-oriented format aimed at a slightly older audience."},
{t:"Baby Looney Tunes", net:"Cartoon Network", dec:"2000s", age:"1-4", cat:"Preschool Learning", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"Infant versions of classic Looney Tunes characters learn simple lessons through play (2002–2005). Its slower pacing and gentle humor were tailored specifically to preschool viewers."},
{t:"Taz-Mania", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"The Tasmanian Devil and his family get into slapstick misadventures in the Australian outback (1991–1995). Its wild, high-energy humor stayed close to the classic Looney Tunes tone."},
{t:"Casper's Scare School", net:"Nickelodeon", dec:"2000s", age:"4-8", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"The friendly ghost attends a school for young monsters while trying to make friends (2009–2010, Nicktoons). Its monster-school setting gave it a gentle, low-stakes spin on classic horror tropes."},
{t:"101 Dalmatian Street", net:"Disney", dec:"2010s", age:"6-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"Two of the many Dalmatian puppies take charge of the household while their parents are away (2019–2020). It expanded the classic film's world with a much larger cast of sibling characters."},
{t:"Bunnicula", net:"Cartoon Network", dec:"2010s", age:"6-9", cat:"Comedy", cat2:"Mystery", g:"neutral", lang:"English", d:"A vampire rabbit and his pet-shop friends investigate spooky mysteries around town (2016–2018). Its mix of light horror and comedy was based on the long-running children's book series."},
{t:"Angela Anaconda", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"An imaginative third-grader clashes with her rival at school in a distinctive cutout-animation style (1999–2002, Fox Family). Its visual technique, mixing paper cutouts with photographed backgrounds, was unusual for its time."},
{t:"Braceface", net:"Streaming & Other", dec:"2000s", age:"7-9", cat:"Life Skills & Emotions", cat2:"Sports", g:"neutral", lang:"English", d:"A middle schooler navigates friendship and self-confidence after getting braces that pick up radio signals (2001–2005). Its down-to-earth take on adolescent anxieties gave it a relatable tone for its age group."},
{t:"6teen", net:"Cartoon Network", dec:"2000s", age:"7-9", cat:"Comedy", cat2:"Music & Arts", g:"neutral", lang:"English", d:"A group of friends navigate part-time jobs and friendship at their local shopping mall (2004–2010). Its slice-of-life format focused on everyday social situations rather than fantastical plots."},
{t:"Class of the Titans", net:"Streaming & Other", dec:"2000s", age:"7-9", cat:"Fantasy & Magic", cat2:"Superhero & Action", g:"neutral", lang:"English", d:"Modern-day teen descendants of Greek heroes train to battle mythological villains (2006–2008). It blended classical mythology with a contemporary high-school setting."},
{t:"Detentionaire", net:"Nickelodeon", dec:"2010s", age:"7-9", cat:"Mystery", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A student framed for a prank investigates who really sabotaged his school (2011–2013, Nicktoons). Its season-long mystery arc encouraged viewers to piece together clues across episodes."},
{t:"Grizzly Tales for Gruesome Kids", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Mystery", cat2:"Adventure", g:"neutral", lang:"English", d:"Darkly comic morality tales show misbehaving children facing exaggerated, spooky consequences (2000–2011, UK). Its cautionary-tale format gave each episode a clear, if theatrical, lesson."},
{t:"Camp Camp", net:"YouTube", dec:"2010s", age:"7-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A cynical camper endures a chaotic summer at an underfunded, oddball summer camp (2016–present, YouTube/Rooster Teeth). Its irreverent humor and animated web-series format built a dedicated online fanbase."},
{t:"Rocket Monkeys", net:"Cartoon Network", dec:"2010s", age:"5-8", cat:"Adventure", cat2:"Superhero & Action", g:"neutral", lang:"English", d:"Two monkey brothers take on odd jobs across the galaxy as fledgling space heroes (2013–2016). Its short, self-contained missions kept each episode's stakes light and comedic."},
{t:"League of Super Evil", net:"Disney", dec:"2010s", age:"6-9", cat:"Comedy", cat2:"Superhero & Action", g:"neutral", lang:"English", d:"A team of inept supervillains bumbles through half-baked evil schemes (2009–2012, YTV/Disney XD). Its villain's-eye-view premise flipped the usual superhero formula for comic effect."},
{t:"Almost Naked Animals", net:"Cartoon Network", dec:"2010s", age:"6-9", cat:"Comedy", cat2:"Science & Nature", g:"neutral", lang:"English", d:"Animal friends running a hotel get into everyday comic mishaps with their guests (2011–2014). Its ensemble hotel setting gave the writers a steady stream of new visiting characters each episode."},
{t:"Total Drama", net:"Cartoon Network", dec:"2000s", age:"7-9", cat:"Comedy", cat2:"Sports", g:"neutral", lang:"English", d:"Teen contestants compete in absurd reality-show-style challenges on a remote island (2007–2014). Its parody of reality television competitions gave it a distinct comedic hook among cartoons."},
{t:"Redakai: Conquer the Kastle", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Adventure", cat2:"Music & Arts", g:"boys", lang:"English", d:"Teens compete to master a mysterious martial-arts energy called Kalixium (2011–2013). Its card- and toy-driven premise centered episodes around collectible in-universe artifacts."},
{t:"Yu-Gi-Oh!", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Adventure", cat2:"Superhero & Action", g:"boys", lang:"Japanese", d:"A teen duelist summons monsters in high-stakes card battles tied to ancient Egyptian magic (2000–2004). Its card-game premise became one of the best-selling trading card franchises in the world."},
{t:"Yu-Gi-Oh! GX", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Adventure", cat2:"Sports", g:"neutral", lang:"Japanese", d:"A new generation of duelists attends a school dedicated to competitive card dueling (2004–2008). It shifted the franchise's setting to an academy, introducing a fresh rotating cast."},
{t:"Cardcaptors", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Fantasy & Magic", cat2:"Adventure", g:"neutral", lang:"Japanese", d:"A young girl collects magical cards that have escaped into the real world (2000–2001, English adaptation of Cardcaptor Sakura). Its magical-quest structure gave each episode a clear goal to complete."},
{t:"Digimon Adventure", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Adventure", cat2:"Sci-Fi", g:"neutral", lang:"Japanese", d:"Kids pulled into a digital world partner with evolving creatures to defend it from corruption (1999–2000, English dub 2000). It launched a long-running multimedia franchise spanning multiple animated series."},
{t:"Digimon Fusion", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Adventure", cat2:"Superhero & Action", g:"neutral", lang:"Japanese", d:"A boy travels across a fractured digital world uniting Digimon under one banner (2012–2013, English dub 2013). It introduced a new fusion mechanic allowing Digimon to combine into more powerful forms."},
{t:"Beyblade", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Sports", cat2:"Music & Arts", g:"boys", lang:"Japanese", d:"Kids compete in spinning-top tournaments, using strategy to outlast their rivals' Beyblades (2001–2003, English dub 2003). It was one of the first anime series to popularize competitive toy-based tournaments in the West."},
{t:"Monster Rancher", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Adventure", cat2:"Superhero & Action", g:"neutral", lang:"Japanese", d:"A boy is pulled into a fantasy world where he raises and battles creatures summoned from discs (1999–2001). Its disc-summoning premise tied directly into a companion video game franchise."},
{t:"Zatch Bell!", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Fantasy & Magic", cat2:"Sports", g:"neutral", lang:"Japanese", d:"A boy partners with a mysterious book-wielding creature in a tournament to become king of a hidden world (2003–2006, English dub 2004). Its mix of comedy and battle tournament plotting gave it broad appeal."},
{t:"Dragon Ball Z Kai", net:"Streaming & Other", dec:"2010s", age:"7-9", cat:"Superhero & Action", cat2:"Music & Arts", g:"neutral", lang:"Japanese", d:"A recut, faster-paced retelling of Goku's battles against increasingly powerful foes (2009–2015, English dub 2010). It trimmed filler from the original series to create a tighter viewing experience."},
{t:"Naruto", net:"Streaming & Other", dec:"2000s", age:"7-9", cat:"Superhero & Action", cat2:"Adventure", g:"neutral", lang:"Japanese", d:"A young ninja seeks recognition and works to become his village's leader despite carrying a powerful spirit within him (2002–2007, English dub 2005). It became one of the best-selling manga and anime franchises worldwide."},
{t:"One Piece", net:"Streaming & Other", dec:"2000s", age:"7-9", cat:"Adventure", cat2:"Fantasy & Magic", g:"neutral", lang:"Japanese", d:"A young pirate captain sails the seas gathering a crew in search of a legendary treasure (1999–present, English dub 2004). It holds the record for best-selling manga series in history."},
{t:"My Hero Academia", net:"Streaming & Other", dec:"2010s", age:"7-9", cat:"Superhero & Action", cat2:"Life Skills & Emotions", g:"neutral", lang:"Japanese", d:"A boy without superpowers trains at a school for young heroes after inheriting an extraordinary ability (2016–present, English dub 2016). It has become one of the most popular superhero anime franchises of its decade."},
{t:"Pokemon Journeys", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Adventure", cat2:"Fantasy & Magic", g:"neutral", lang:"Japanese", d:"A new trainer alongside a returning Ash Ketchum explores regions from across the franchise's history (2019–2023, English dub 2020). It served as an anniversary celebration, revisiting locations from the original series."},
{t:"Zak Storm", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Adventure", cat2:"Fantasy & Magic", g:"neutral", lang:"English", d:"A teenager is pulled into a magical ocean and must command a legendary pirate ship (2016–2018). Its swashbuckling, treasure-hunting plots gave it a classic adventure-story structure."},
{t:"Slugterra", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Adventure", cat2:"Superhero & Action", g:"boys", lang:"English", d:"A boy explores an underground world where creatures called slugs are used in friendly battles (2012–2016). Its underground-world setting let the show introduce a wide variety of unique creature designs."},
{t:"Dan Vs.", net:"Streaming & Other", dec:"2010s", age:"7-9", cat:"Comedy", cat2:"Adventure", g:"neutral", lang:"English", d:"A perpetually angry man goes on absurd revenge quests against everyday annoyances (2011–2013, The Hub). Its episodic, over-the-top premise gave each installment a clean, self-contained story."},
{t:"Kong: King of the Apes", net:"Netflix", dec:"2010s", age:"6-9", cat:"Adventure", cat2:"Superhero & Action", g:"neutral", lang:"English", d:"A giant ape and a young scientist team up to protect the world from genetically modified dinosaurs (2016–2018, Netflix). It reimagined the classic giant-ape character as a heroic protector rather than a monster."},
{t:"Freaky Stories", net:"Streaming & Other", dec:"1990s", age:"7-9", cat:"Mystery", cat2:"Fantasy & Magic", g:"neutral", lang:"English", d:"Kids narrate spooky urban legends and campfire-style tales to each other (1997–1999). Its anthology format let each episode stand completely on its own, similar to a campfire storytelling session."},
{t:"Skysurfer Strike Force", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Superhero & Action", cat2:"Sports", g:"boys", lang:"English", d:"A team of high-flying pilots uses jet-powered hoverboards to battle an eco-terrorist organization (1995). Its aerial action sequences were built around a companion toy line of flying vehicles."},
{t:"Extreme Dinosaurs", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Adventure", cat2:"Superhero & Action", g:"neutral", lang:"English", d:"Genetically enhanced dinosaurs battle villainous mutant reptiles trying to take over the world (1997). Its spin-off status tied it loosely to the earlier Street Sharks series."},
{t:"He-Man and the Masters of the Universe (2002)", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Fantasy & Magic", cat2:"Superhero & Action", g:"boys", lang:"English", d:"A reimagined Prince Adam transforms into He-Man to defend the magical realm of Eternia (2002–2004). It gave the classic 1980s franchise a darker, more serialized storytelling approach."},
{t:"Masters of the Universe: Revelation", net:"Netflix", dec:"2020s", age:"7-9", cat:"Fantasy & Magic", cat2:"Superhero & Action", g:"neutral", lang:"English", d:"A new continuation picks up the long-running battle between He-Man and Skeletor for Eternia's fate (2021–2022, Netflix). It was framed as a direct sequel to the original 1980s series' unresolved storylines."},
{t:"Voltron: Legendary Defender", net:"Netflix", dec:"2010s", age:"7-9", cat:"Sci-Fi", cat2:"Fantasy & Magic", g:"boys", lang:"English", d:"Five pilots combine their robotic lions into a giant defender to protect the universe (2016–2018, Netflix). It modernized the classic 1980s franchise with more serialized, character-driven storytelling."},
{t:"ThunderCats (2011)", net:"Streaming & Other", dec:"2010s", age:"7-9", cat:"Fantasy & Magic", cat2:"Superhero & Action", g:"boys", lang:"English", d:"A young cat-like prince fights to reclaim his kingdom after it's conquered by reptilian invaders (2011). It reworked the 1980s original with a more serialized, quest-driven narrative."},
{t:"VR Troopers", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"Teens use virtual-reality technology to transform into armored heroes battling a digital tyrant (1994–1996). It shared the era's live-action-meets-animation formula popularized by Power Rangers."},
{t:"Planet Sketch", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Comedy", cat2:"Science & Nature", g:"neutral", lang:"English", d:"A rapid-fire sketch-comedy show mixes short animated gags on a variety of everyday topics (2008–2011, YTV). Its variety format let it experiment with many different comedic styles within a single episode."},
{t:"Rated A for Awesome", net:"Disney", dec:"2010s", age:"6-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A boy obsessed with self-improvement guides and his friends navigate absurd everyday challenges (2011–2013). Its faux-instructional framing device gave each episode a distinct comedic structure."},
{t:"The Mask: The Animated Series", net:"Streaming & Other", dec:"1990s", age:"7-9", cat:"Comedy", cat2:"Superhero & Action", g:"neutral", lang:"English", d:"An ordinary man transforms into a wildly powered, cartoonishly chaotic hero whenever he dons a magic mask (1995–1997). Its exaggerated slapstick softened the darker tone of the original film for younger viewers."},
{t:"Johnny Test", net:"Cartoon Network", dec:"2000s", age:"6-9", cat:"Comedy", cat2:"Science & Nature", g:"boys", lang:"English", d:"A mischievous boy talks his genius twin sisters into testing their wild inventions on him (2005–2014). Its formula of gadget-driven mishaps gave each episode a clear science-fiction-flavored hook."},
{t:"Jackie Chan Adventures", net:"Streaming & Other", dec:"2000s", age:"7-9", cat:"Adventure", cat2:"Music & Arts", g:"neutral", lang:"English", d:"An archaeologist uses martial arts to recover magical relics from an evil crime organization (2000–2005, Kids' WB). Its blend of humor and stunt-driven action reflected the star's live-action film style."},
{t:"SWAT Kats: The Radical Squadron", net:"Streaming & Other", dec:"1990s", age:"7-9", cat:"Superhero & Action", cat2:"Music & Arts", g:"boys", lang:"English", d:"Two vigilante feline pilots defend their city using homemade jet fighters (1993–1995). Its detailed vehicle designs and aerial combat set it apart from other animal-hero cartoons of its era."},
{t:"Biker Mice from Mars", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Superhero & Action", cat2:"Science & Nature", g:"boys", lang:"English", d:"Three motorcycle-riding Martian mice battle an alien corporation that destroyed their home planet (1993–1996). Its high-speed chase sequences were built around a companion toy line of vehicles."},
{t:"Wild West C.O.W.-Boys of Moo Mesa", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Adventure", cat2:"Superhero & Action", g:"neutral", lang:"English", d:"Cattle-riding cowboy heroes defend a frontier town from outlaws in an Old West setting (1992–1993). Its western setting gave the show a distinct visual identity among early-'90s action cartoons."},
{t:"Men in Black: The Series", net:"Streaming & Other", dec:"1990s", age:"7-9", cat:"Sci-Fi", cat2:"Mystery", g:"neutral", lang:"English", d:"Secret agents monitor alien activity on Earth while training a new recruit (1997–2001). It expanded on the film's premise with a wider variety of extraterrestrial cases each episode."},
{t:"Extreme Ghostbusters", net:"Streaming & Other", dec:"1990s", age:"7-9", cat:"Mystery", cat2:"Sports", g:"neutral", lang:"English", d:"A new, younger team of ghost hunters takes over paranormal investigations in New York City (1997). It continued the original animated series with a more serialized, slightly darker tone."},
{t:"Ben 10: Alien Force", net:"Cartoon Network", dec:"2000s", age:"7-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"An older Ben regains his alien-transforming watch to fight a growing intergalactic threat (2008–2010). It picked up several years after the original series, aging up the cast and story stakes."},
{t:"Ben 10: Ultimate Alien", net:"Cartoon Network", dec:"2010s", age:"7-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"Ben unlocks more powerful alien forms while facing an escalating alien invasion (2010–2012). It introduced upgraded transformations that built directly on the previous series' cast of aliens."},
{t:"Ben 10: Omniverse", net:"Cartoon Network", dec:"2010s", age:"6-9", cat:"Superhero & Action", cat2:"Music & Arts", g:"neutral", lang:"English", d:"A teenage Ben partners with a new sidekick while balancing hero duties with growing up (2012–2014). Its lighter, more comedic tone was a deliberate shift from the darker preceding series."},
{t:"Ben 10 (2016)", net:"Cartoon Network", dec:"2010s", age:"6-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"neutral", lang:"English", d:"A full reboot returns Ben to his original age, discovering the alien watch for the first time again (2016–2021). It reintroduced the franchise's classic monster-of-the-week formula to a new generation."},
{t:"Max Steel (2013)", net:"Disney", dec:"2010s", age:"7-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"A teenager bonds with an alien energy being to become a technologically powered superhero (2013–2014). Its hero-and-companion premise gave the show a buddy-action structure alongside typical villain fights."},
{t:"Godzilla: The Series", net:"Streaming & Other", dec:"1990s", age:"7-9", cat:"Sci-Fi", cat2:"Sports", g:"neutral", lang:"English", d:"A scientist and his team study and defend against giant mutated creatures alongside a young Godzilla (1998–2000). It continued the story from an earlier feature film with a broader cast of kaiju threats."},
{t:"Jumanji: The Animated Series", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Adventure", cat2:"Sports", g:"neutral", lang:"English", d:"Kids drawn into the magical board game must survive jungle dangers to escape it (1996–1999). Each episode's board-game premise gave the writers a built-in excuse for new wilderness perils."},
{t:"Mummies Alive!", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Fantasy & Magic", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Reanimated ancient Egyptian guardians protect the reincarnated soul of a young pharaoh (1997). Its mythological premise gave the show a distinct fantasy-adventure hook among '90s action cartoons."},
{t:"Roughnecks: Starship Troopers Chronicles", net:"Streaming & Other", dec:"1990s", age:"7-9", cat:"Sci-Fi", cat2:"Superhero & Action", g:"neutral", lang:"English", d:"A squad of space marines defends human colonies from giant alien bugs (1999–2000). It used CGI animation to depict large-scale military sci-fi battles for a younger audience."},
{t:"Pirates of Dark Water", net:"Streaming & Other", dec:"1990s", age:"7-9", cat:"Adventure", cat2:"Music & Arts", g:"neutral", lang:"English", d:"A prince and his crew search for magical relics to stop a corrupting force called the Dark Water (1991–1993). Its serialized quest structure was unusually ambitious for a Saturday morning cartoon."},
{t:"Widget the World Watcher", net:"Streaming & Other", dec:"1990s", age:"4-8", cat:"Science & Nature", cat2:"Sci-Fi", g:"neutral", lang:"English", d:"A shape-shifting alien helps kids solve environmental problems in their community (1990–1991). Its eco-friendly message was woven into simple, kid-scaled problem-solving stories."},
{t:"Cybersix", net:"Streaming & Other", dec:"1990s", age:"7-9", cat:"Mystery", cat2:"Superhero & Action", g:"neutral", lang:"English", d:"A genetically engineered hero secretly protects a city from the mad scientist who created her (1999). Its noir-influenced visual style set it apart from brighter, more comedic superhero cartoons."},
{t:"The Mystery Files of Shelby Woo", net:"Nickelodeon", dec:"1990s", age:"7-9", cat:"Mystery", cat2:"Adventure", g:"neutral", lang:"English", d:"A teenage amateur detective solves puzzling cases in her uncle's restaurant town (1996–2000). Its case-of-the-week format encouraged viewers to piece together clues alongside the young sleuth."},
{t:"Space Cases", net:"Nickelodeon", dec:"1990s", age:"7-9", cat:"Sci-Fi", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"Students and teachers become stranded aboard a sentient spaceship after a field trip goes wrong (1996–1997). Its ensemble cast of stranded characters gave it a found-family adventure structure."},
{t:"Double Dare", net:"Nickelodeon", dec:"1990s", age:"6-9", cat:"Sports", cat2:"Comedy", g:"neutral", lang:"English", d:"Kid contestants answer trivia and complete messy physical challenges to win prizes (1986–1993, revived 2018–2019). Its slime-and-obstacle-course format made it one of Nickelodeon's most recognizable game shows."},
{t:"Flight 29 Down", net:"Streaming & Other", dec:"2000s", age:"7-9", cat:"Adventure", cat2:"Sports", g:"neutral", lang:"English", d:"Teens survive on a deserted island after their plane crashes during a school trip (2005–2007, Discovery Kids/NBC). Its survival-focused plots emphasized teamwork and resourcefulness over conflict."},
{t:"Prank Patrol", net:"Streaming & Other", dec:"2000s", age:"7-9", cat:"Comedy", cat2:"Sports", g:"neutral", lang:"English", d:"A team helps kids pull elaborate, good-natured pranks on family and friends (2006–2010, Discovery Kids/YTV). Its real-kid, real-prank format gave it a playful reality-show energy distinct from scripted comedies."},
{t:"DragonflyTV", net:"PBS Kids", dec:"2000s", age:"7-9", cat:"Science & Nature", cat2:"Mystery", g:"neutral", lang:"English", d:"Real kids design and carry out their own science experiments and investigations (2002–2011). Its student-led format aimed to model hands-on scientific inquiry rather than simply presenting facts."},
{t:"Hilda", net:"Netflix", dec:"2010s", age:"7-9", cat:"Fantasy & Magic", cat2:"Music & Arts", g:"neutral", lang:"English", d:"An adventurous girl and her friends explore a world of gentle magical creatures after moving to a bustling city (2018–2023, Netflix). Its whimsical folklore-inspired world was praised for its atmospheric art and calm pacing."},
{t:"Carmen Sandiego (2019)", net:"Netflix", dec:"2010s", age:"7-9", cat:"Mystery", cat2:"Superhero & Action", g:"neutral", lang:"English", d:"A reformed master thief traces stolen treasures across the globe while outwitting a criminal organization (2019–2021, Netflix). It reimagined the classic edutainment character as the story's clever hero rather than the villain."},
{t:"Bravest Warriors", net:"Streaming & Other", dec:"2010s", age:"7-9", cat:"Sci-Fi", cat2:"Superhero & Action", g:"neutral", lang:"English", d:"A team of young heroes takes on odd interstellar missions after their parents leave to fight a galactic threat (2012–2018, Cartoon Hangover). It was one of the earliest hit original series for online animated web platforms."},
{t:"LEGO Star Wars: The Freemaker Adventures", net:"Disney", dec:"2010s", age:"6-9", cat:"Sci-Fi", cat2:"Superhero & Action", g:"neutral", lang:"English", d:"A family of scavengers builds powerful starships from salvaged parts while getting pulled into galactic conflict (2016–2017). Its LEGO-brick aesthetic gave the Star Wars universe a lighter, more comedic tone."},
{t:"LEGO Monkie Kid", net:"Streaming & Other", dec:"2020s", age:"6-9", cat:"Fantasy & Magic", cat2:"Superhero & Action", g:"neutral", lang:"English", d:"A young delivery driver teams up with legendary heroes inspired by Journey to the West to battle mythical demons (2020–present). Its blend of Chinese mythology and modern city life gave it a distinctive setting."},
{t:"LEGO City Adventures", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Adventure", cat2:"Music & Arts", g:"neutral", lang:"English", d:"A rookie police officer and his community handle everyday emergencies and light-hearted capers (2019–present). Its short-episode format mirrors the quick, mission-based play style of the LEGO City toy line."},
{t:"Jurassic World: Chaos Theory", net:"Netflix", dec:"2020s", age:"7-9", cat:"Adventure", cat2:"Science & Nature", g:"neutral", lang:"English", d:"Survivors from an earlier dinosaur-park disaster face new threats years later as escaped dinosaurs spread worldwide (2024–present, Netflix). It continues the animated franchise's focus on teamwork under high-stakes pressure."},
{t:"Hamster & Gretel", net:"Disney", dec:"2020s", age:"6-9", cat:"Superhero & Action", cat2:"Sports", g:"neutral", lang:"English", d:"A girl and her genetically enhanced pet hamster secretly fight crime as a superhero duo (2022–present). Its comedic pet-sidekick premise puts a lighthearted spin on typical superhero team-up stories."},
{t:"Kiff", net:"Disney", dec:"2020s", age:"6-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"An overenthusiastic young squirrel navigates everyday small-town mishaps with her best friend (2023–present). Its high-energy, optimistic lead character drives most of the show's comedic situations."},
{t:"Zombies: The Re-Animated Series", net:"Disney", dec:"2020s", age:"6-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"Animated shorts follow a high school where zombies and cheerleaders navigate everyday teen life together (2022–present). It expands on the world of Disney's Zombies films in a shorter, comedic animated format."},
{t:"Marvel's Moon Girl and Devil Dinosaur", net:"Disney", dec:"2020s", age:"6-9", cat:"Superhero & Action", cat2:"Science & Nature", g:"neutral", lang:"English", d:"A brilliant young inventor partners with a giant red dinosaur to protect her New York neighborhood (2023–present). It centers a science-genius kid hero, unusual for typically power-based superhero premises."},
{t:"Hailey's On It!", net:"Disney", dec:"2020s", age:"6-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"An overachieving kid tackles absurd neighborhood problems with checklist-driven determination (2023–present). Its list-making, problem-solving format gives each episode a clear structure built around a new challenge."},
{t:"Teenage Mutant Ninja Turtles (2003)", net:"Streaming & Other", dec:"2000s", age:"7-9", cat:"Superhero & Action", cat2:"Adventure", g:"boys", lang:"English", d:"A more serialized retelling follows the four turtle brothers training under their rat sensei to battle the Foot Clan (2003–2009). It stayed closer to the original comic's tone than earlier lighter adaptations."},
{t:"Teenage Mutant Ninja Turtles (1987)", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Superhero & Action", cat2:"Music & Arts", g:"boys", lang:"English", d:"Four pizza-loving turtle brothers battle the villainous Shredder across New York City (1987–1996, still airing into the '90s). It launched one of the most successful action-cartoon toy franchises in history."},
{t:"Marsupilami", net:"Streaming & Other", dec:"1990s", age:"4-8", cat:"Comedy", cat2:"Science & Nature", g:"neutral", lang:"French", d:"A stretchy-tailed jungle creature gets into slapstick misadventures with his animal friends (1993–1995). Its rubbery, exaggerated animation style gave the character's antics a distinct visual bounce."},
{t:"Let's Get Building!", net:"PBS Kids", dec:"2020s", age:"3-6", cat:"Science & Nature", cat2:"Adventure", g:"neutral", lang:"English", d:"A young builder and friends tackle simple construction and engineering challenges around their neighborhood (2020–present). Real tools and hands-on problem-solving anchor each episode's central project."},
{t:"Fizzy's Lunch Lab", net:"PBS Kids", dec:"2010s", age:"5-9", cat:"Life Skills & Emotions", cat2:"Music & Arts", g:"neutral", lang:"English", d:"A quirky chef and a shrunken sidekick explore where food comes from and how to eat well (2010–2012). Each episode centers on a single ingredient, tracing it from farm to plate."},
{t:"Design Squad Global", net:"PBS Kids", dec:"2010s", age:"7-9", cat:"Science & Nature", cat2:"Sports", g:"neutral", lang:"English", d:"Teen inventors from around the world team up on hands-on engineering challenges (2011–2015). Its international pairings gave each build project a cross-cultural, collaborative twist."},
{t:"The Ren & Stimpy Show", net:"Nickelodeon", dec:"1990s", age:"7-9", cat:"Comedy", cat2:"Music & Arts", g:"boys", lang:"English", d:"A neurotic chihuahua and a dim-witted cat get into gross-out misadventures together (1991–1996). Its exaggerated, close-up animation style pushed the boundaries of what a Saturday-morning cartoon could look like."},
{t:"Ned's Declassified School Survival Guide", net:"Nickelodeon", dec:"2000s", age:"7-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A middle schooler offers deadpan tips for surviving school life, framed as chapters in a survival guide (2004–2007). Its direct-to-camera format made ordinary school problems feel like practical advice."},
{t:"Zoey 101", net:"Nickelodeon", dec:"2000s", age:"7-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A group of friends navigate life at a recently co-ed boarding school (2005–2008). Its ensemble-cast format balanced everyday school storylines with lighter comedic subplots."},
{t:"Unfabulous", net:"Nickelodeon", dec:"2000s", age:"7-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A middle schooler narrates the awkward ups and downs of early adolescence through comic asides (2004–2007). Its confessional narration format made everyday embarrassments feel relatable rather than dramatic."},
{t:"Fred: The Show", net:"Nickelodeon", dec:"2010s", age:"7-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"boys", lang:"English", d:"A hyperactive teenager's chaotic daily life, based on the viral YouTube character (2012). It was among the first Nickelodeon shows built directly from an existing web-video franchise."},
{t:"The Naked Brothers Band", net:"Nickelodeon", dec:"2000s", age:"7-9", cat:"Music & Arts", cat2:"Comedy", g:"neutral", lang:"English", d:"A mockumentary-style series follows two real-life musician brothers and their band (2007–2009). Its blend of scripted storylines and original songs gave it an unusually music-forward format for the network."},
{t:"Making Fiends", net:"Nickelodeon", dec:"2000s", age:"6-9", cat:"Comedy", cat2:"Superhero & Action", g:"neutral", lang:"English", d:"A relentlessly cheerful girl in a monster-filled town keeps befriending a villain who wants her gone (2008). Its darkly funny, web-series-turned-TV format gave it a scrappier, more offbeat tone than typical Nicktoons."},
{t:"Tak and the Power of Juju", net:"Nickelodeon", dec:"2000s", age:"6-9", cat:"Fantasy & Magic", cat2:"Superhero & Action", g:"boys", lang:"English", d:"A young shaman-in-training uses magical Juju powers to protect his jungle village (2007–2009). Based on a video game franchise, it leaned on quest-driven episodes built around problem-solving with magic."},
{t:"Catscratch", net:"Nickelodeon", dec:"2000s", age:"6-9", cat:"Comedy", cat2:"Adventure", g:"boys", lang:"English", d:"Three wealthy house cats navigate absurd domestic misadventures after inheriting a mansion (2005–2007). Its exaggerated character designs and chaotic pacing echoed classic Nicktoon slapstick."},
{t:"Random! Cartoons", net:"Nickelodeon", dec:"2000s", age:"6-9", cat:"Comedy", cat2:"Music & Arts", g:"neutral", lang:"English", d:"An anthology series showcasing rotating short pilots from up-and-coming animators (2008–2009). Several of its shorts, unusually, went on to become full standalone series of their own."},
{t:"Bunsen Is a Beast!", net:"Nickelodeon", dec:"2010s", age:"6-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A friendly young monster and his human best friend navigate life at a school built for monsters (2017–2018). Its odd-couple premise let it mix everyday school storylines with light fantasy elements."},
{t:"Kappa Mikey", net:"Nickelodeon", dec:"2000s", age:"6-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"An American actor becomes the star of a Japanese anime studio's flagship show (2006–2008). Its deliberately mismatched animation style parodied anime conventions for laughs."},
{t:"Wayside", net:"Nickelodeon", dec:"2000s", age:"6-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"Students at an oddly built thirty-story school get into surreal, rule-bending misadventures (2007–2008). Based on Louis Sachar's novels, its absurdist premise gave it a much stranger sense of humor than typical school sitcoms."},
{t:"Taina", net:"Nickelodeon", dec:"2000s", age:"7-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A performing-arts high schooler chases her dream of becoming a star while juggling family life (2001–2002). It was notable for centering a Puerto Rican family at a time when the network's live-action slate rarely did so."},
{t:"Caitlin's Way", net:"Nickelodeon", dec:"2000s", age:"7-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A streetwise city teen adjusts to life on a Montana ranch after moving in with relatives (2000–2002). Its fish-out-of-water premise leaned on culture-clash humor between city and rural life."},
{t:"Romeo!", net:"Nickelodeon", dec:"2000s", age:"7-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A teenager balances school life with growing up in a family of musicians and performers (2003–2006). Its family-business setting gave episodes a workplace-sitcom flavor rare for a kids' show."},
{t:"Just Jordan", net:"Nickelodeon", dec:"2000s", age:"7-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"boys", lang:"English", d:"A teenager moves from New York to Los Angeles to live with his eccentric extended family (2007–2008). Its fish-out-of-water setup mined humor from clashing personalities under one roof."},
{t:"Every Witch Way", net:"Nickelodeon", dec:"2010s", age:"7-9", cat:"Fantasy & Magic", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Teenagers at a performing-arts school navigate friendship, rivalry, and secret magical powers (2014–2015). Its telenovela-inspired plotting gave the show a more soap-opera-like structure than typical tween sitcoms."},
{t:"The Other Kingdom", net:"Nickelodeon", dec:"2010s", age:"7-9", cat:"Fantasy & Magic", cat2:"Mystery", g:"neutral", lang:"English", d:"A teenager discovers she's secretly a princess from a hidden magical realm (2016). Its fish-out-of-water premise mixed everyday high-school plots with fantasy-kingdom intrigue."},
{t:"I Am Weasel", net:"Cartoon Network", dec:"1990s", age:"6-9", cat:"Comedy", cat2:"Sports", g:"boys", lang:"English", d:"A modest, talented weasel constantly outshines his jealous rival, an incompetent red baboon (1997–2000). Spun off from Cow and Chicken, it kept the same absurdist, non-sequitur humor in a new odd-couple format."},
{t:"The Life and Times of Juniper Lee", net:"Cartoon Network", dec:"2000s", age:"6-9", cat:"Fantasy & Magic", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A young girl inherits her family's duty to keep the balance between the human and magical worlds (2005–2007). Its urban-fantasy premise mixed everyday family life with monster-of-the-week conflicts."},
{t:"Megas XLR", net:"Cartoon Network", dec:"2000s", age:"7-9", cat:"Sci-Fi", cat2:"Music & Arts", g:"boys", lang:"English", d:"A slacker who wins a giant alien robot in a junkyard becomes Earth's unlikely defender (2004–2005). It leaned into deliberately over-the-top mecha-anime tropes for comic effect."},
{t:"Evil Con Carne", net:"Cartoon Network", dec:"2000s", age:"6-9", cat:"Comedy", cat2:"Superhero & Action", g:"boys", lang:"English", d:"A disembodied villain's brain, still attached to one arm and a leg, schemes for world domination with a ragtag team (2003–2004). A Grim Adventures spin-off, it kept the same dark, absurdist humor in a new villain-focused format."},
{t:"Secret Mountain Fort Awesome", net:"Cartoon Network", dec:"2010s", age:"6-9", cat:"Comedy", cat2:"Mystery", g:"boys", lang:"English", d:"Five monster brothers try to fit in with the human town next door despite their chaotic instincts (2011–2012). Its short-lived run leaned on crude, high-energy slapstick typical of the network's edgier block."},
{t:"The Powerpuff Girls", net:"Cartoon Network", dec:"1990s", age:"6-9", cat:"Superhero & Action", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Three chemically created kindergarteners with superpowers defend their city from monsters and villains (1998–2005). Its blend of saccharine visuals with genuinely tough action became one of the network's defining formulas."},
{t:"The Powerpuff Girls (2016)", net:"Cartoon Network", dec:"2010s", age:"6-9", cat:"Superhero & Action", cat2:"Music & Arts", g:"neutral", lang:"English", d:"A reboot of the superpowered kindergarten trio with updated animation and new adventures (2016–2019). It kept the original's hero-versus-villain structure while modernizing its humor for a new generation."},
{t:"Mad", net:"Cartoon Network", dec:"2010s", age:"7-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A rapid-fire sketch-comedy show parodying movies, TV, and pop culture for a younger audience (2010–2013). Modeled after MAD Magazine, it packed dozens of short parody bits into each episode."},
{t:"Steven Universe Future", net:"Cartoon Network", dec:"2020s", age:"7-9", cat:"Fantasy & Magic", cat2:"Sci-Fi", g:"neutral", lang:"English", d:"A continuation following Steven as he processes the emotional aftermath of years of saving the world (2019–2020). Its more introspective, slower-paced episodes marked a tonal shift from the original series' adventure focus."},
{t:"Justice League Action", net:"Cartoon Network", dec:"2010s", age:"6-9", cat:"Superhero & Action", cat2:"Adventure", g:"neutral", lang:"English", d:"Short, fast-paced episodes send Batman, Superman, and a rotating roster of DC heroes on quick missions (2016–2018). Its shorter episode format favored rapid-fire action over the longer arcs of earlier DC animated shows."},
{t:"Tower Prep", net:"Cartoon Network", dec:"2010s", age:"7-9", cat:"Mystery", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"Teens with unusual abilities are secretly enrolled at a boarding school they can't leave or explain to anyone (2010). Its central mystery about the school's true purpose drove the season's overarching plot."},
{t:"Unnatural History", net:"Cartoon Network", dec:"2010s", age:"7-9", cat:"Adventure", cat2:"Mystery", g:"neutral", lang:"English", d:"A globe-trotting teen and his friends investigate mysteries tied to his family's natural history museum (2010). Each episode combined artifact-driven puzzles with international adventure."},
{t:"The Suite Life on Deck", net:"Disney", dec:"2000s", age:"7-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"Twin brothers continue their hotel-set hijinks aboard a school ship that sails the world (2008–2011). Its shipboard setting let it swap in a new international destination almost every episode."},
{t:"Good Luck Charlie", net:"Disney", dec:"2010s", age:"4-8", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"An older sister records video diaries of advice for her baby sister to watch when she's older (2010–2014). Its home-video framing device gave otherwise ordinary family sitcom plots a sentimental throughline."},
{t:"Liv and Maddie", net:"Disney", dec:"2010s", age:"7-9", cat:"Comedy", cat2:"Science & Nature", g:"neutral", lang:"English", d:"Twin sisters with opposite personalities navigate high school after one returns from a TV acting career (2013–2017). A single actress playing both leads became the show's signature technical challenge."},
{t:"Andi Mack", net:"Disney", dec:"2010s", age:"7-9", cat:"Comedy", cat2:"Mystery", g:"neutral", lang:"English", d:"A thirteen-year-old learns a long-held family secret that upends what she thought she knew about her life (2017–2019). Its slower-paced, more serialized storytelling was a departure from Disney Channel's typical episodic sitcoms."},
{t:"The Replacements", net:"Disney", dec:"2000s", age:"6-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"Two orphaned kids use a catalog to order new, often absurd, replacement parents and siblings whenever needed (2006–2009). Its swap-anyone premise let each episode reset the family dynamic for a new comedic scenario."},
{t:"Aaron Stone", net:"Disney", dec:"2000s", age:"7-9", cat:"Superhero & Action", cat2:"Sports", g:"boys", lang:"English", d:"A teenage video-game champion is recruited to become a real-life masked hero (2009–2010). It blended live-action superhero action with a video-game framing device unusual for the channel."},
{t:"Zeke and Luther", net:"Disney", dec:"2000s", age:"7-9", cat:"Comedy", cat2:"Sports", g:"boys", lang:"English", d:"Two best friends pursue their dream of becoming professional skateboarders through one harebrained scheme after another (2009–2012). Its skate-culture setting and stunt sequences set it apart from more conventional school sitcoms."},
{t:"Pair of Kings", net:"Disney", dec:"2000s", age:"7-9", cat:"Comedy", cat2:"Adventure", g:"boys", lang:"English", d:"Twin brothers discover they're long-lost royalty and are sent to rule a tropical island kingdom (2010–2013). Its fish-out-of-water premise mixed sitcom antics with island-adventure plots."},
{t:"Crash & Bernstein", net:"Disney", dec:"2010s", age:"6-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"boys", lang:"English", d:"A boy's homemade puppet comes to life as an unruly, oversized \"brother\" who upends his household (2012–2014). Its puppet-and-human buddy format gave it a broader, more slapstick comedic style than typical Disney sitcoms."},
{t:"I'm in the Band", net:"Disney", dec:"2000s", age:"7-9", cat:"Comedy", cat2:"Music & Arts", g:"boys", lang:"English", d:"A middle schooler convinces his favorite has-been rock band to let him join as their guitarist (2009–2011). Its rock-band setting gave the show a running thread of original music alongside its sitcom plots."},
{t:"Bizaardvark", net:"Disney", dec:"2010s", age:"7-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"Two best friends create viral comedy videos together at a studio for young internet creators (2016–2019). Its show-within-a-show format let it parody real online video trends of its era."},
{t:"Sydney to the Max", net:"Disney", dec:"2010s", age:"7-9", cat:"Comedy", cat2:"Adventure", g:"neutral", lang:"English", d:"A teenager discovers her dad's old diary and realizes he was once just as much a troublemaker as she is (2019–2021). Its dual-timeline structure let episodes jump between the present and her father's own teenage years."},
{t:"Phil of the Future", net:"Disney", dec:"2000s", age:"7-9", cat:"Sci-Fi", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A family from the future gets stranded in present-day suburbia while repairing their time machine (2004–2006). Its futuristic gadgets provided a steady stream of sci-fi solutions to otherwise ordinary teen problems."},
{t:"So Random!", net:"Disney", dec:"2010s", age:"7-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A sketch-comedy show spun off from a fictional series-within-a-series, featuring an ensemble cast of young comedians (2011–2012). Its fast-paced format packed several unrelated comedic bits into every episode."},
{t:"Sonny with a Chance", net:"Disney", dec:"2000s", age:"7-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A small-town girl joins the cast of her favorite sketch-comedy show and adjusts to Hollywood life (2009–2011). Its show-within-a-show format let it parody sketch comedy while also being one itself."},
{t:"Dog with a Blog", net:"Disney", dec:"2010s", age:"4-8", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A blended family's talking dog secretly documents their chaotic household on his own blog (2012–2015). Its animal's-eye narration gave familiar sitcom family plots a novel comedic perspective."},
{t:"Tiny Toon Adventures", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Comedy", cat2:"Music & Arts", g:"neutral", lang:"English", d:"A new generation of young cartoon students learn the ropes from the original Looney Tunes cast (1990–1992). It leaned harder into meta, fourth-wall-breaking gags than its predecessors, setting a template for later self-aware cartoons."},
{t:"Eek! The Cat", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Comedy", cat2:"Music & Arts", g:"neutral", lang:"English", d:"An eternally optimistic cat stumbles through misadventures no matter how badly they turn out (1992–1997). Its rubber-band, guaranteed-terrible-outcome structure gave the humor a dependable comic rhythm each week."},
{t:"Life with Louie", net:"Streaming & Other", dec:"1990s", age:"4-8", cat:"Comedy", cat2:"Life Skills & Emotions", g:"boys", lang:"English", d:"Comedian Louie Anderson's animated memories of growing up in a big, loud Midwestern family (1995–1998). Its warm, nostalgic tone stood out among the era's more frantic Saturday-morning fare."},
{t:"Bobby's World", net:"Streaming & Other", dec:"1990s", age:"3-7", cat:"Comedy", cat2:"Superhero & Action", g:"neutral", lang:"English", d:"A young boy's wild imagination transforms ordinary situations into elaborate fantasies (1990–1998). The show's crayon-drawn dream sequences became its most recognizable visual signature."},
{t:"Histeria!", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"English", d:"A troupe of history-obsessed kid characters spoof famous events and figures through sketch comedy (1998–2000). Its rapid-fire parody format packed genuine historical trivia into broad slapstick gags."},
{t:"Masked Rider", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Superhero & Action", cat2:"Music & Arts", g:"boys", lang:"English", d:"An alien prince disguised as a teenager defends Earth using a transforming battle suit (1995–1996). It followed the Saban formula of imported tokusatsu footage repackaged with new American storylines."},
{t:"Big Bad Beetleborgs", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Superhero & Action", cat2:"Adventure", g:"boys", lang:"English", d:"Three kids accidentally become armored superheroes after a haunted-house dare goes wrong (1996–1998). It blended sitcom-style kid banter with imported action footage, a hallmark of its production studio."},
{t:"Mighty Morphin Power Rangers", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"Five ordinary teenagers become armored heroes piloting giant robots to defend their city (1993–1996). Its combination of teen drama and imported action footage helped launch a global toy and media franchise."},
{t:"Power Rangers Turbo", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Superhero & Action", cat2:"Adventure", g:"boys", lang:"English", d:"The Power Rangers trade their zords for turbo-charged vehicles in a new fight against evil (1997). It followed the franchise's established rookies-to-heroes arc with a racing-themed twist."},
{t:"Power Rangers S.P.D.", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"A futuristic police force of Power Rangers battles alien crime across a sci-fi metropolis (2005). The show leaned further into space-opera style than earlier, more grounded seasons."},
{t:"Power Rangers RPM", net:"Streaming & Other", dec:"2000s", age:"7-9", cat:"Superhero & Action", cat2:"Music & Arts", g:"neutral", lang:"English", d:"Survivors in a post-apocalyptic domed city pilot Ranger suits against a robotic uprising (2009). Its noticeably darker tone set it apart from the franchise's typically lighter seasons."},
{t:"Superhuman Samurai Syber-Squad", net:"Streaming & Other", dec:"1990s", age:"6-9", cat:"Superhero & Action", cat2:"Sci-Fi", g:"boys", lang:"English", d:"Teenagers get pulled into cyberspace to battle a virus-spreading villain using morphing samurai armor (1994). It was an early example of a kids' show built around then-novel ideas about computers and virtual worlds."},
{t:"Oggy and the Cockroaches", net:"Streaming & Other", dec:"2000s", age:"6-9", cat:"Comedy", cat2:"Adventure", g:"neutral", lang:"French", d:"A blue cat's home is endlessly invaded by three mischievous cockroaches determined to make his life miserable (2001–present). Its wordless, purely visual slapstick format let it travel easily to audiences worldwide."},
{t:"Mr. Bean: The Animated Series", net:"Streaming & Other", dec:"2000s", age:"4-8", cat:"Comedy", cat2:"Adventure", g:"neutral", lang:"English", d:"An animated version of the famously silent comedian gets into everyday misadventures around town (2002–2019). Its near-wordless format built humor entirely around exaggerated physical comedy."},
{t:"Larva", net:"Streaming & Other", dec:"2010s", age:"6-9", cat:"Comedy", cat2:"Life Skills & Emotions", g:"neutral", lang:"Korean", d:"Two bumbling larvae living in a sewer get into slapstick trouble with everything they encounter (2011–present). Its dialogue-free format relies on exaggerated sound effects and physical gags."},
{t:"Pucca", net:"Streaming & Other", dec:"2000s", age:"4-8", cat:"Comedy", cat2:"Adventure", g:"neutral", lang:"Korean", d:"A noodle-shop girl relentlessly chases a ninja boy who wants nothing to do with romance (2006–2008). Its wordless, slapstick-driven format let it travel easily to audiences worldwide."},
{t:"Vroomiz", net:"Streaming & Other", dec:"2010s", age:"5-7", cat:"Adventure", cat2:"Comedy", g:"boys", lang:"Korean", d:"Anthropomorphic race cars solve everyday problems around their bustling garage town (2016–2019)."},
{t:"Zoomer & Zip", net:"Streaming & Other", dec:"2010s", age:"5-7", cat:"Adventure", cat2:"Comedy", g:"boys", lang:"English", d:"Two speedy race-car pals get into playful mishaps zooming around their hometown (2015–2017)."},
